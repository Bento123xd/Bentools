  { l: 0, q: "Se a reta r está contida no plano α e é paralela ao plano π, então (Questão 73)", o: ["a reta interseção de α e π, se existir, será paralela a r", "α e π são dois planos paralelos", "α e π são dois planos perpendiculares", "α e π são planos congruentes"],
    ow: [null, "Não necessariamente: α pode cortar π.", "Nada garante 90° entre α e π.", "'Congruentes' não descreve posição de planos."],
    s: ["Se α e π forem secantes, a interseção i está em α e em π.", "r e i estão no mesmo plano α, e r não corta π, logo não corta i.", "Coplanares sem ponto comum: r é paralela a i."] },
  { l: 0, q: "Considere as retas r e s e os planos α e β. Podemos afirmar que (Questão 96)", o: ["r // s e r // α ⇒ s // α ou s ⊂ α", "r = α ∩ β e s ⊂ α ⇒ s // β", "r // s e s ⊂ α ⇒ r ⊂ α", "r // α e s // α ⇒ r // s"],
    ow: [null, "s pode cortar r e, portanto, cortar β.", "r pode ser paralela a α, fora dele.", "Duas retas paralelas a um mesmo plano podem ser concorrentes ou reversas."],
    s: ["Se r é paralela a α, existe em α uma reta t paralela a r.", "s // r ⇒ s // t (ou s = t).", "Assim s é paralela a α ou está contida em α."] },
  { l: 0, q: "I. Se um plano intercepta dois outros planos paralelos, as interseções são retas paralelas. II. Se dois planos são paralelos, qualquer reta de um é paralela a qualquer reta do outro. III. Se uma reta é paralela a dois planos, esses planos são paralelos. IV. Se dois planos são paralelos, uma reta de um pode ser reversa a uma reta do outro. (Questão 22)", o: ["Apenas I e IV são verdadeiras", "Apenas I e II são verdadeiras", "Apenas I e III são verdadeiras", "Apenas II e IV são verdadeiras"],
    ow: [null, "II é falsa: retas de planos paralelos podem ser reversas.", "III é falsa: planos secantes podem ser paralelos a uma mesma reta.", "II é falsa (I é verdadeira e ficou de fora)."],
    s: ["I: verdadeira (as duas interseções são coplanares e não se encontram).", "II: falsa. No teto e no chão, retas em direções diferentes são reversas.", "III: falsa. Dois planos secantes são paralelos a qualquer reta paralela à interseção.", "IV: verdadeira, como no exemplo do teto e do chão.", "Verdadeiras: I e IV."] },
  { l: 0, q: "Duas retas distintas perpendiculares a uma terceira podem ser: I. concorrentes; II. perpendiculares; III. paralelas; IV. reversas e não ortogonais; V. ortogonais. (Questão 78)", o: ["VVVVV", "VFVFV", "FVFFF", "VVVVF"],
    ow: [null, "II e IV também são possíveis (veja os exemplos da resolução).", "Concorrentes e paralelas também são possíveis.", "V também é possível: duas arestas do cubo ortogonais entre si, ambas perpendiculares a uma terceira."],
    s: ["Pense no cubo e numa aresta vertical t.", "Duas arestas da base que partem do pé de t são perpendiculares a t e concorrentes (e perpendiculares entre si): I e II.", "Uma aresta da base que sai do pé de t e a aresta paralela a ela no topo, que sai da ponta de t, são perpendiculares a t e paralelas entre si: III.", "Retas horizontais que cortam t em alturas diferentes são perpendiculares a t e reversas entre si; conforme a direção, formam 90° (ortogonais) ou outro ângulo (não ortogonais): IV e V.", "Todas possíveis: VVVVV."] },
  { l: 0, q: "Considere duas retas r e s concorrentes em P. Assinale a correta. (Questão 85)", o: ["Se u é reversa a r e a s, existe uma única reta por P paralela a u", "Se t é perpendicular a r em P, t não pode ser perpendicular a s em P", "Qualquer plano contendo r intercepta s em um único ponto", "Se m é paralela a r, então m intercepta s"],
    ow: [null, "A reta por P perpendicular ao plano (r, s) é perpendicular às duas.", "O plano que contém r e s contém s inteira.", "m pode estar fora do plano de r e s e ser reversa a s."],
    s: ["Postulado das paralelas: por um ponto fora de uma reta passa uma única paralela a ela.", "P não está em u (u é reversa a r e s, logo não passa por P).", "Então existe uma única reta por P paralela a u."] },
  { l: 0, q: "Quantos pares de arestas reversas há num tetraedro?", f: ["3"],
    s: ["Arestas reversas não têm vértice comum e não são coplanares.", "Num tetraedro ABCD, cada aresta tem exatamente uma aresta oposta sem vértice comum: AB e CD, AC e BD, AD e BC.", "São 3 pares (Questão 72)."] },
  { l: 0, q: "Quantos pares de retas reversas podem ser formados com as retas suporte das arestas de um cubo? (Questão 17)", f: ["24"],
    s: ["Pegue uma aresta. Das outras 11: 3 são paralelas a ela, 4 a encontram num vértice. Sobram 11 − 3 − 4 = 4 reversas.", "Cada uma das 12 arestas tem 4 reversas: 12 · 4 = 48.", "Cada par foi contado duas vezes: 48 ÷ 2 = 24."] },
  { l: 0, q: "I. Se duas retas r e s são reversas, não existe plano paralelo a r e s. II. Se uma reta é ortogonal a duas retas paralelas de um plano, ela é perpendicular ao plano. III. Quatro pontos não coplanares determinam exatamente quatro planos. IV. Se dois planos são perpendiculares, toda reta perpendicular a um deles é paralela ao outro. (Questão 24)", o: ["Três afirmativas são falsas", "Apenas uma é falsa", "Duas são falsas", "Todas são falsas"],
    ow: [null, "Há mais de uma falsa: I, II e IV.", "Há três falsas: I, II e IV.", "III é verdadeira."],
    s: ["I: falsa. O plano que contém r e é paralelo a s (questão anterior) é paralelo às duas; planos paralelos a ele também.", "II: falsa. As duas retas precisam ser concorrentes, não paralelas.", "III: verdadeira (C(4,3) = 4).", "IV: falsa. A reta pode estar contida no outro plano.", "Três falsas."] },
  { l: 0, q: "I. Duas retas coplanares são concorrentes. II. Duas retas sem ponto comum são reversas. III. Dadas duas retas reversas, existem dois, e apenas dois, planos paralelos, cada um contendo uma das retas. IV. Os pontos médios dos lados de um quadrilátero reverso definem um paralelogramo. São verdadeiras apenas (Questão 99)", o: ["III e IV", "III", "I e III", "II e III"],
    ow: [null, "IV também é verdadeira (teorema do segmento médio).", "I é falsa: coplanares podem ser paralelas.", "II é falsa: sem ponto comum, podem ser paralelas."],
    s: ["I: falsa (podem ser paralelas).", "II: falsa (podem ser paralelas).", "III: verdadeira. Cada reta está num plano paralelo à outra, e esse par é único.", "IV: verdadeira. Num quadrilátero ABCD, o segmento médio de AB e BC é paralelo a AC e mede AC/2; o de CD e DA também. Os lados opostos ficam paralelos e iguais.", "Verdadeiras: III e IV."] },
  { l: 0, q: "r e s são retas reversas. Então a distância entre r e s (Questão 35)", o: ["é igual àquela entre dois planos paralelos que contenham r e s respectivamente", "não se define", "é igual àquela entre qualquer ponto de r e qualquer ponto de s", "é igual àquela entre dois quaisquer planos que contenham r e s respectivamente"],
    ow: [null, "Está definida: é a menor distância entre pontos de r e de s.", "A distância entre pontos varia; a distância entre as retas é a menor delas.", "Planos quaisquer podem ser secantes (distância zero)."],
    s: ["A distância entre retas reversas é o comprimento da perpendicular comum.", "Os dois planos paralelos que contêm r e s (um cada) estão separados exatamente por essa perpendicular comum.", "Logo a distância entre r e s é a distância entre esses planos paralelos."] },

  /* ================= Nível 2 · perpendicularismo ================= */
  { l: 1, q: "A é um ponto que não pertence à reta r. Quantos são os planos que contêm A e são perpendiculares a r? (Questão 25)", f: ["1"],
    s: ["Por um ponto passa um único plano perpendicular a uma reta dada.", "Isso vale para A fora de r ou em r.", "Resposta: 1."] },
  { l: 1, q: "Assinale a afirmação correta. (Questão 12)", o: ["Não existem retas distintas, concorrentes, perpendiculares a um plano α", "Não existem ângulos de lados paralelos não congruentes", "Não existem retas distintas, perpendiculares a uma reta r, passando por um ponto P de r", "Não existem retas paralelas e distintas perpendiculares a um mesmo plano"],
    ow: [null, "Ângulos de lados paralelos podem ser suplementares (60° e 120°).", "Por P passam infinitas perpendiculares a r (todas no plano perpendicular a r por P).", "Retas perpendiculares a um mesmo plano são paralelas, então existem sim."],
    s: ["Retas perpendiculares a um mesmo plano são paralelas entre si.", "Se fossem concorrentes, teriam um ponto comum e por ele passariam duas perpendiculares ao plano, o que é impossível.", "Logo não existem retas distintas e concorrentes perpendiculares a α."] },
  { l: 1, q: "Assinale a alternativa correta. (Questão 58)", o: ["Se duas retas distintas são perpendiculares a um plano, elas são paralelas", "Se duas retas são perpendiculares a uma reta do espaço, elas são paralelas", "Se duas retas não se cruzam, elas são ortogonais", "3 pontos determinam um plano"],
    ow: [null, "Podem ser concorrentes ou reversas (veja o Nível 1).", "Retas sem ponto comum podem ser paralelas ou reversas em qualquer ângulo.", "Só se forem não colineares."],
    s: ["Teorema: duas retas perpendiculares a um mesmo plano são paralelas.", "As outras afirmações têm contraexemplos simples no cubo."] },
  { l: 1, q: "Indique a proposição verdadeira. (Questão 56)", o: ["Se um plano é perpendicular a duas retas distintas, elas são coplanares", "Duas retas perpendiculares a uma terceira são paralelas entre si", "Se s é secante às retas r e t, os ângulos colaterais externos são suplementares"],
    ow: [null, "Podem ser concorrentes ou reversas.", "Só vale se r e t forem paralelas."],
    s: ["Duas retas perpendiculares ao mesmo plano são paralelas.", "Retas paralelas distintas são coplanares.", "Logo as duas retas são coplanares."] },
  { l: 1, q: "I. Se dois planos distintos são paralelos a uma mesma reta, são paralelos entre si. II. Se duas retas distintas são paralelas a um mesmo plano, são paralelas entre si. III. Se dois planos distintos são perpendiculares a uma mesma reta, são paralelos. IV. Se duas retas distintas são perpendiculares a um mesmo plano, são paralelas. Estão corretas (Questão 20)", o: ["III e IV", "I, II, III e IV", "I e II", "IV"],
    ow: [null, "I e II são falsas.", "I e II são falsas; III e IV são as verdadeiras.", "III também é verdadeira."],
    s: ["I: falsa. Planos secantes podem ser paralelos à mesma reta.", "II: falsa. Retas paralelas ao chão podem ser concorrentes ou reversas.", "III: verdadeira. Planos perpendiculares à mesma reta são paralelos.", "IV: verdadeira. Retas perpendiculares ao mesmo plano são paralelas.", "Corretas: III e IV."] },
  { l: 1, q: "I. Duas retas no espaço, paralelas a uma terceira, são paralelas entre si. II. Um plano α, perpendicular a uma reta de um plano β, é paralelo a β. III. Dois planos perpendiculares à mesma reta são paralelos. Então (Questão 15)", o: ["Somente II é falsa", "Todas são falsas", "Todas são verdadeiras", "Somente I é falsa"],
    ow: [null, "I e III são verdadeiras.", "II é falsa.", "I é verdadeira (transitividade do paralelismo)."],
    s: ["I: verdadeira (o paralelismo de retas é transitivo).", "II: falsa. Se α é perpendicular a uma reta de β, então α ⊥ β, e não α // β.", "III: verdadeira.", "Somente II é falsa."] },
  { l: 1, q: "I. Se dois planos são perpendiculares, toda reta de um deles perpendicular à interseção é perpendicular ao outro. II. Se dois planos são perpendiculares, toda reta paralela a um deles é perpendicular ao outro. III. Duas retas perpendiculares a um mesmo plano são paralelas. (Questão 23)", o: ["Apenas I e III são verdadeiras", "Todas são verdadeiras", "Todas são falsas", "Apenas I e II são verdadeiras"],
    ow: [null, "II é falsa.", "I e III são teoremas verdadeiros.", "II é falsa e III é verdadeira."],
    s: ["I: verdadeira. É o teorema dos planos perpendiculares (a parede e o chão: uma reta da parede perpendicular ao rodapé é vertical).", "II: falsa. Uma reta paralela à parede pode ser horizontal e paralela ao chão.", "III: verdadeira.", "Verdadeiras: I e III."] },
  { l: 1, q: "Qual das proposições é FALSA? (Questão 63)", o: ["Se uma reta e um plano são paralelos, toda reta perpendicular à reta dada é perpendicular ao plano", "Por um ponto A pode-se conduzir uma única reta perpendicular a um plano α", "Se dois planos são perpendiculares a uma reta, então eles são paralelos", "Se dois planos são paralelos e uma reta é perpendicular a um deles, então é perpendicular ao outro"],
    ow: [null, "Verdadeira: por um ponto passa uma única perpendicular a um plano.", "Verdadeira.", "Verdadeira: planos paralelos têm as mesmas perpendiculares."],
    s: ["Tome o chão e uma reta r horizontal acima dele (paralela ao chão).", "Uma reta perpendicular a r pode ser horizontal também, e aí ela é paralela ao chão, não perpendicular.", "Por isso essa é a afirmação falsa."] },
  { l: 1, q: "Qual das afirmações é FALSA? (Questão 60)", o: ["Duas retas perpendiculares a uma terceira são paralelas entre si (no espaço)", "Se dois planos são perpendiculares à mesma reta, eles são paralelos", "Se duas retas são perpendiculares a um plano, elas são paralelas", "Se uma reta é perpendicular a um plano, toda reta paralela a ela é perpendicular ao plano"],
    ow: [null, "Verdadeira.", "Verdadeira.", "Verdadeira: a direção perpendicular se mantém."],
    s: ["No espaço, duas retas perpendiculares a uma terceira podem ser concorrentes, paralelas ou reversas (Nível 1, questão 78).", "Então dizer que são sempre paralelas é falso."] },
  { l: 1, q: "Assinale a afirmação correta. (Questão 87)", o: ["Uma reta perpendicular a um plano é perpendicular a todas as retas do plano", "Uma reta e um plano são paralelos. Toda reta perpendicular à reta dada é perpendicular ao plano", "Se uma reta é perpendicular a duas retas distintas de um plano, ela é perpendicular ao plano", "Se uma reta é perpendicular a duas retas paralelas e distintas de um plano, ela está contida no plano"],
    ow: [null, "Falsa (veja a questão anterior).", "As duas retas precisam ser concorrentes.", "Não precisa estar contida; pode até ser oblíqua ao plano."],
    s: ["Na linguagem desta lista, uma reta perpendicular a um plano forma 90° com todas as retas do plano (perpendicular às que passam pelo pé e ortogonal às demais).", "É a definição de reta perpendicular a plano; as outras alternativas falham nas condições."] },
  { l: 1, q: "Assinale a única proposição errada. (Questão 57)", o: ["Uma reta ortogonal a duas retas de um plano é ortogonal ao plano", "Duas retas do espaço paralelas a uma terceira são paralelas entre si", "Um plano perpendicular a dois planos incidentes é perpendicular à reta interseção deles", "Dois planos perpendiculares à mesma reta são paralelos"],
    ow: [null, "Correta (transitividade).", "Correta: é o teorema de α ⊥ γ, β ⊥ γ ⇒ (α ∩ β) ⊥ γ.", "Correta."],
    s: ["Para a reta ser perpendicular ao plano, as duas retas do plano precisam ser concorrentes.", "Se forem paralelas, a reta pode ser oblíqua ao plano.", "Por isso essa afirmação é a errada."] },
  { l: 1, q: "Se um plano α e uma reta r são tais que r ∩ α = r, então (Questão 30)", o: ["toda reta perpendicular a α é perpendicular a r", "existe um plano que contém r e não intercepta α", "existe uma reta em α concorrente com r em mais de um ponto", "toda reta paralela a α é paralela a r"],
    ow: [null, "Todo plano que contém r corta α (pelo menos em r).", "Retas distintas se cortam em no máximo um ponto.", "Retas paralelas a α podem ter qualquer direção paralela a α."],
    s: ["r ∩ α = r significa que r está contida em α.", "Uma reta perpendicular a α forma 90° com todas as retas de α, inclusive r.", "Logo toda perpendicular a α é perpendicular (ou ortogonal) a r."] },
  { l: 1, q: "Considere uma reta s contida em um plano α e uma reta r perpendicular a s. Então, necessariamente (Questão 26)", o: ["r e s são coplanares", "r é perpendicular a α", "r é paralela a α", "r está contida em α"],
    ow: [null, "Para ser perpendicular a α, r precisaria ser perpendicular a duas retas concorrentes de α.", "r corta s, que está em α, então r não é paralela a α.", "r pode sair de α."],
    s: ["Retas perpendiculares são concorrentes (se cortam formando 90°).", "Duas retas concorrentes determinam um plano.", "Logo r e s são coplanares."] },
  { l: 1, q: "Se um dos lados de um ângulo reto é paralelo a um plano e o outro não é perpendicular a esse plano, a projeção do ângulo sobre o plano é (Questão 13)", o: ["um ângulo reto", "um ângulo agudo", "um ângulo obtuso", "dependente da posição do plano"],
    ow: [null, "A projeção mantém os 90° nesse caso.", "A projeção mantém os 90° nesse caso.", "O resultado é sempre o mesmo: 90°."],
    s: ["O lado paralelo ao plano se projeta com a mesma direção.", "O outro lado é perpendicular ao primeiro; ao projetar, a componente que some é vertical, que também é perpendicular ao primeiro lado.", "Logo a projeção do segundo lado continua perpendicular ao primeiro: o ângulo projetado é reto (teorema das três perpendiculares)."] },
  { l: 1, q: "Considere um plano α e uma reta r que encontra esse plano num ponto P e não é perpendicular a α. Assinale a verdadeira. (Questão 47)", o: ["Existe uma e somente uma reta de α perpendicular a r por P", "Existem infinitas retas de α perpendiculares a r pelo ponto P", "Não existe reta de α perpendicular a r por P", "Existem duas retas de α perpendiculares a r passando por P"],
    ow: [null, "Isso só acontece se r for perpendicular a α.", "Existe: é a interseção de α com o plano perpendicular a r por P.", "O plano perpendicular a r por P corta α numa única reta."],
    s: ["As perpendiculares a r por P formam um plano β (perpendicular a r em P).", "Como r não é perpendicular a α, β ≠ α, e os dois se cortam numa única reta.", "Essa reta está em α, passa por P e é perpendicular a r: é única."] },
  { l: 1, q: "O plano π₁ é perpendicular a π₂, π₂ é perpendicular a π₃, e π₁ e π₃ se interceptam segundo a reta ℓ. É correto afirmar que (Questão 18)", o: ["a reta ℓ é perpendicular a π₂", "π₁ e π₃ são perpendiculares", "π₁ e π₃ são paralelos", "π₂ também contém a reta ℓ"],
    ow: [null, "Não necessariamente: podem formar qualquer ângulo.", "Eles se cortam em ℓ, então não são paralelos.", "ℓ é perpendicular a π₂, então não está contida nele."],
    s: ["Teorema: se dois planos secantes são ambos perpendiculares a um terceiro, a interseção deles é perpendicular a esse terceiro.", "π₁ ⊥ π₂ e π₃ ⊥ π₂, com π₁ ∩ π₃ = ℓ.", "Logo ℓ ⊥ π₂ (pense em duas paredes e no chão: a quina é vertical)."] },
  { l: 1, q: "Dados os planos distintos α, β e γ, se α ⊥ γ e β ⊥ γ, então necessariamente (Questão 33)", o: ["se i = α ∩ β, então i ⊥ γ", "α // β", "α não é paralelo a β", "se i = α ∩ β, então i // γ"],
    ow: [null, "Podem ser secantes (duas paredes vizinhas).", "Podem ser paralelos (duas paredes opostas).", "A interseção é perpendicular a γ, não paralela."],
    s: ["Mesmo teorema da questão anterior.", "Se α e β se cortam numa reta i e ambos são perpendiculares a γ, então i ⊥ γ."] },
  { l: 1, q: "Sejam as retas r // s // t e um plano α ⊥ r. Pode-se dizer que (Questão 34)", o: ["α ⊥ s e α ⊥ t, necessariamente", "α // s", "α // t", "α ⊥ s e α não ⊥ t, necessariamente"],
    ow: [null, "Uma reta paralela a r é perpendicular a α, não paralela.", "Uma reta paralela a r é perpendicular a α, não paralela.", "t também é paralela a r, então também é perpendicular a α."],
    s: ["Se uma reta é perpendicular a um plano, toda reta paralela a ela também é.", "s e t são paralelas a r, então α ⊥ s e α ⊥ t."] },
  { l: 1, q: "Sejam a e b duas retas ortogonais, perpendiculares à reta r em A e B, respectivamente. Sejam M ∈ a e N ∈ b pontos distintos de A e B. O ângulo MB̂N (Questão 48)", o: ["é reto", "é agudo", "não pode ser reto", "depende de M e N"],
    ow: [null, "É sempre 90°.", "É sempre 90°.", "Não depende: vale para quaisquer M e N."],
    s: ["b é perpendicular a r e ortogonal a a, que são concorrentes em A. Logo b é perpendicular ao plano determinado por a e r.", "O ponto M está em a e o ponto B está em r: o segmento BM está nesse plano.", "Como b ⊥ plano, b ⊥ BM. N está em b, então o ângulo MBN é reto."] },
  { l: 1, q: "Por uma reta não paralela nem perpendicular a um plano α passam: I. infinitos planos paralelos a α; II. nenhum plano paralelo a α; III. nenhum plano perpendicular a α; IV. um único plano perpendicular a α. Valem (Questão 49)", o: ["II e IV", "II e III", "I e III", "I e IV"],
    ow: [null, "III é falsa: existe um plano perpendicular a α pela reta.", "A reta corta α, então nenhum plano que a contém é paralelo a α.", "I é falsa."],
    s: ["A reta corta α (não é paralela), então nenhum plano que a contém é paralelo a α: II.", "Pela reta passa o plano que contém a perpendicular a α por um de seus pontos: esse plano é perpendicular a α e é único, porque a reta não é perpendicular a α: IV.", "Valem II e IV."] },
  { l: 1, q: "Todas as afirmações estão corretas, EXCETO (Questão 01)", o: ["Toda secção de um diedro reto é um ângulo reto", "Dois diedros opostos pela aresta são congruentes", "O bissetor de um diedro reto forma, com suas faces, dois diedros de 45°", "Dois planos perpendiculares determinam quatro diedros retos"],
    ow: [null, "Correta: como ângulos opostos pelo vértice.", "Correta: o bissetor divide 90° em 45° e 45°.", "Correta: é a definição de planos perpendiculares."],
    s: ["Só a secção reta, feita por um plano perpendicular à aresta, mede o ângulo do diedro.", "Uma secção oblíqua de um diedro reto pode dar um ângulo agudo ou obtuso.", "Por isso 'toda secção' é a afirmação incorreta."] },
  { l: 1, q: "Quanto à soma dos ângulos que uma reta forma com dois planos perpendiculares, podemos afirmar que (Questão 68)", o: ["não podemos garantir nenhuma das outras respostas", "é menor do que 90 graus", "é igual a 90 graus", "é maior do que 90 e menor do que 180 graus"],
    ow: [null, "Pode ser igual a 90° (reta perpendicular à interseção dos planos).", "Só acontece em alguns casos; em outros a soma é menor.", "A soma nunca passa de 90°."],
    s: ["Com os planos z = 0 e x = 0 e uma reta de direção (a, b, c) unitária, sen θ₁ = |c| e sen θ₂ = |a|.", "Como a² + c² ≤ 1, a soma θ₁ + θ₂ fica entre 0° e 90°.", "Ela é 90° quando b = 0 e menor que 90° nos outros casos. Então nenhuma das respostas fixas vale sempre."] },
  { l: 1, q: "Sejam α e β dois planos paralelos a 4 m um do outro, e r uma reta que os intercepta em A ∈ α e B ∈ β, com AB = 5 m. Quanto mede a projeção ortogonal de AB sobre β, em metros? (Questão 98)", f: ["3"],
    s: ["AB, sua projeção e a distância entre os planos formam um triângulo retângulo.", "A hipotenusa é AB = 5 e um cateto é a distância 4.", "Projeção = √(5² − 4²) = √9 = 3 m."] },
  { l: 1, q: "Um triângulo ABC está inclinado em relação a um plano α, e as distâncias dos vértices A, B e C ao plano são 3 cm, 5 cm e 7 cm. Qual é a distância do baricentro ao plano, em cm? (Questão 94)", f: ["5"],
    s: ["O baricentro G é a média dos vértices: G = (A + B + C)/3.", "A distância a α (com todos do mesmo lado) também é a média.", "(3 + 5 + 7)/3 = 15/3 = 5 cm."] },
  { l: 1, q: "O ponto A pertence à reta r, contida no plano α. A reta s, perpendicular a α, o intercepta em B. O ponto C pertence a s e dista 2√5 cm de B. A projeção ortogonal de AB em r mede 5 cm e B dista 6 cm de r. Qual é a distância de A a C, em cm? (Questão 02)", f: ["9"],
    s: ["Em α: a projeção de AB sobre r (5) e a distância de B a r (6) são catetos de um triângulo retângulo com hipotenusa AB.", "AB² = 5² + 6² = 61.", "BC é perpendicular a α, então é perpendicular a AB: triângulo ABC retângulo em B.", "AC² = AB² + BC² = 61 + (2√5)² = 61 + 20 = 81 ⇒ AC = 9 cm."] },
  { l: 1, q: "Os planos α e β são paralelos, a 8 cm de distância. As retas s e t são as interseções de α e β com um plano perpendicular a ambos. O ponto A está em α e dista 5 cm da reta s. Qual é a distância de A até t, em cm? (Questão 77, item 04)", f: ["√89"],
    s: ["Seja A' o pé da perpendicular de A até s (AA' = 5, dentro de α).", "t está em β, diretamente abaixo de s, a 8 cm: o segmento de A' até t mede 8 e é perpendicular a α, logo perpendicular a AA'.", "AA' também é perpendicular a t (ele é perpendicular ao plano que contém s e t).", "Distância² = 5² + 8² = 89 ⇒ distância = √89 ≈ 9.43 cm."] },
  { l: 1, q: "São dados três pontos A, B e C não alinhados e um ponto P fora do plano ABC. Quantos planos passam por P e são equidistantes de A, B e C? (Questão 08)", f: ["4"],
    s: ["Um plano equidistante de três pontos ou deixa os três do mesmo lado, ou separa um deles dos outros dois.", "Mesmo lado: o plano é paralelo a ABC. Por P passa exatamente um (1 plano).", "Separando um ponto: o plano é paralelo ao plano que passa pelos pontos médios dos lados que saem desse ponto, e há uma escolha para cada vértice: 3 planos, cada um por P.", "Total: 1 + 3 = 4 planos."] },
  { l: 1, q: "O plano γ intercepta dois planos paralelos α e β. O conjunto dos pontos equidistantes de α, β e γ é (Questão 36)", o: ["a reunião de duas retas", "um único ponto", "uma reta", "um plano"],
    ow: [null, "Há infinitos pontos (duas retas inteiras).", "São duas retas, uma de cada lado de γ.", "A condição de equidistar de γ restringe a retas."],
    s: ["Equidistantes de α e β: o plano μ paralelo a eles, no meio, a d/2 de cada um (d = distância entre α e β).", "Nesse plano, os pontos a distância d/2 de γ formam duas retas paralelas a μ ∩ γ, uma de cada lado de γ.", "O conjunto é a reunião de duas retas."] },
  { l: 1, q: "Leia as afirmativas: I. Dados um plano α e dois pontos A e B fora dele, é sempre possível passar por A e B um plano perpendicular a α. II. Dadas duas retas reversas, não existe plano equidistante delas. III. Se a interseção de duas retas é vazia, elas são paralelas ou reversas. IV. Quatro pontos não coplanares determinam 5 planos. V. Se dois planos são perpendiculares, todo plano perpendicular a um deles é perpendicular ao outro. VI. O poliedro regular com 30 arestas e 20 vértices é o dodecaedro. Quantas são verdadeiras? (Questão 71)", o: ["Apenas três", "Apenas duas", "Apenas quatro", "Todas são falsas"],
    ow: [null, "São três: I, III e VI.", "IV, II e V são falsas, então não chegam a quatro.", "I, III e VI são verdadeiras."],
    s: ["I: verdadeira. O plano que contém AB e a perpendicular a α por A é perpendicular a α.", "II: falsa. O plano no meio entre os dois planos paralelos que contêm as reversas é equidistante delas.", "III: verdadeira.", "IV: falsa (são 4).", "V: falsa (pense em parede, chão e outra parede paralela à primeira).", "VI: verdadeira. Dodecaedro: 12 faces pentagonais, 2A = 60 ⇒ A = 30, V = 2 + 30 − 12 = 20.", "Três verdadeiras: I, III e VI."] },

  /* ================= Nível 3 · poliedros ================= */
  { l: 2, q: "Quantas arestas tem um prisma pentagonal? (Questão 03)", f: ["15"],
    s: ["Um prisma de base com n lados tem n arestas em cada base e n arestas laterais.", "Total: 3n = 3 · 5 = 15."] },
  { l: 2, q: "Um prisma hexagonal tem quantos vértices, faces e arestas?", f: ["12", "8", "18"], lab: ["vértices =", "faces =", "arestas ="],
    s: ["Base com n = 6 lados.", "Vértices: 2n = 12 (6 em cada base).", "Faces: n + 2 = 8 (6 laterais + 2 bases).", "Arestas: 3n = 18. Confira com Euler: 12 − 18 + 8 = 2 ✓."] },
  { l: 2, q: "Uma pirâmide hexagonal tem quantos vértices, faces e arestas?", f: ["7", "7", "12"], lab: ["vértices =", "faces =", "arestas ="],
    s: ["Base com n = 6 lados.", "Vértices: n + 1 = 7 (6 da base + o ápice).", "Faces: n + 1 = 7 (6 triângulos laterais + a base).", "Arestas: 2n = 12. Euler: 7 − 12 + 7 = 2 ✓."] },
  { l: 2, q: "Um prisma tem 30 arestas. Quantos lados tem o polígono da base?", f: ["10"],
    s: ["Prisma de base com n lados tem 3n arestas.", "3n = 30 ⇒ n = 10: as bases são decágonos."] },
  { l: 2, q: "Uma pirâmide tem 10 arestas. Quantas faces ela tem?", f: ["6"],
    s: ["Pirâmide de base com n lados tem 2n arestas: 2n = 10 ⇒ n = 5.", "Faces: n + 1 = 6 (5 laterais + a base). Euler: V = 6, 6 − 10 + 6 = 2 ✓."] },
  { l: 2, q: "Quantos poliedros regulares (de Platão) existem?", f: ["5"],
    s: ["Em cada vértice precisam se encontrar pelo menos 3 faces, e a soma dos ângulos tem de ser menor que 360°.", "Triângulos: 3, 4 ou 5 por vértice (tetraedro, octaedro, icosaedro). Quadrados: 3 (cubo). Pentágonos: 3 (dodecaedro). Hexágonos já somam 360°.", "São 5."] },
  { l: 2, q: "Um poliedro convexo tem 8 faces e 12 vértices. Quantas arestas ele tem?", f: ["18"],
    s: ["Euler: V − A + F = 2.", "12 − A + 8 = 2 ⇒ A = 18."] },
  { l: 2, q: "Um poliedro convexo tem 20 faces, todas triangulares. Quantos vértices ele tem?", f: ["12"],
    s: ["Cada face tem 3 arestas e cada aresta é compartilhada por 2 faces: 2A = 20 · 3 ⇒ A = 30.", "Euler: V = 2 + A − F = 2 + 30 − 20 = 12. É o icosaedro."] },
  { l: 2, q: "A soma dos ângulos de todas as faces de um poliedro convexo com V vértices é S = 360°·(V − 2). Quanto vale S para o cubo, em graus?", f: ["2160"],
    s: ["O cubo tem V = 8.", "S = 360° · (8 − 2) = 2160°.", "Conferindo: 6 faces quadradas de 360° cada dão 6 · 360° = 2160° ✓."] },
  { l: 2, q: "O poliedro regular que tem 30 arestas e 20 vértices é o", o: ["dodecaedro", "icosaedro", "octaedro", "hexaedro"],
    ow: [null, "O icosaedro tem 30 arestas mas 12 vértices.", "O octaedro tem 12 arestas e 6 vértices.", "O cubo tem 12 arestas e 8 vértices."],
    s: ["Euler: F = 2 + A − V = 2 + 30 − 20 = 12 faces.", "Poliedro regular com 12 faces: dodecaedro (Questão 71, item VI)."] },
  { l: 2, q: "Um poliedro convexo tem 6 faces quadradas e 8 faces triangulares. Quantos vértices ele tem? (Questão 83)", f: ["12"],
    s: ["Arestas: 2A = 6·4 + 8·3 = 48 ⇒ A = 24.", "Faces: F = 6 + 8 = 14.", "Euler: V = 2 + A − F = 2 + 24 − 14 = 12."] },
  { l: 2, q: "Um silo é formado por 20 placas hexagonais e 12 placas pentagonais, como uma bola de futebol. Quantas arestas e quantos vértices ele tem? (Questão 86)", f: ["90", "60"], lab: ["arestas =", "vértices ="],
    s: ["2A = 20·6 + 12·5 = 120 + 60 = 180 ⇒ A = 90.", "F = 20 + 12 = 32.", "Euler: V = 2 + 90 − 32 = 60."] },
  { l: 2, q: "Qual é a medida da diagonal de um cubo de aresta 6 cm?", f: ["6√3"],
    s: ["A diagonal da face mede a√2 = 6√2.", "A diagonal do cubo é a hipotenusa do triângulo com catetos a diagonal da face e a aresta: √((6√2)² + 6²) = √(72 + 36) = √108.", "√108 = 6√3 ≈ 10.39 cm (fórmula: d = a√3)."] },
  { l: 2, q: "Um paralelepípedo retângulo tem dimensões 3, 4 e 12. Quanto mede sua diagonal?", f: ["13"],
    s: ["d = √(a² + b² + c²).", "d = √(9 + 16 + 144) = √169 = 13."] },
  { l: 2, q: "Calcule a área total e o volume de um cubo de aresta 5 cm.", f: ["150", "125"], lab: ["área total (cm²) =", "volume (cm³) ="],
    s: ["São 6 faces quadradas de área 5² = 25: área total = 6 · 25 = 150 cm².", "Volume = a³ = 5³ = 125 cm³."] },
  { l: 2, q: "Calcule a área total e o volume de um paralelepípedo retângulo de dimensões 2, 3 e 4.", f: ["52", "24"], lab: ["área total =", "volume ="],
    s: ["Área total = 2(ab + ac + bc) = 2(6 + 8 + 12) = 2 · 26 = 52.", "Volume = abc = 2 · 3 · 4 = 24."] },
  { l: 2, q: "Uma pirâmide tem base quadrada de lado 3 e altura 4. Qual é o volume?", f: ["12"],
    s: ["Área da base = 3² = 9.", "Volume = (área da base × altura)/3 = 9 · 4/3 = 12."] },
  { l: 2, q: "No cubo ABCDEFGH de aresta 6 cm, X e Y são os pontos médios das arestas AB e GH. O polígono XCYE é (Questão 29)", o: ["losango, mas não quadrado", "quadrado", "retângulo, mas não quadrado", "paralelogramo, mas não losango"],
    ow: [null, "As diagonais XY e EC têm medidas diferentes, então não é quadrado.", "Os quatro lados são iguais e as diagonais diferentes: é losango, não retângulo.", "Os quatro lados são iguais, então é losango."],
    s: ["Coloque A = (0,0,0), B = (6,0,0), C = (6,6,0), E = (0,0,6), G = (6,6,6), H = (0,6,6). Então X = (3,0,0) e Y = (3,6,6).", "Lados: XC, CY, YE e EX medem todos √(3² + 6²) = √45 = 3√5.", "Diagonais: XY = √(6² + 6²) = 6√2 e CE = 6√3. São diferentes.", "Quatro lados iguais e diagonais diferentes: losango que não é quadrado."] },
  { l: 2, q: "Quantas diagonais de um prisma octogonal partem de um mesmo vértice? (Questão 90)", f: ["5"],
    s: ["Diagonal do prisma liga dois vértices que não estão na mesma face.", "Tome um vértice da base de cima. Os vértices da mesma base estão na face da base: não contam.", "Na base de baixo há 8 vértices; 3 deles estão numa face lateral junto com o vértice escolhido (o de baixo e os dois vizinhos).", "Sobram 8 − 3 = 5 diagonais."] },
  { l: 2, q: "Um prisma triangular regular tem aresta da base 4 e altura 10. Calcule a área da base e o volume.", f: ["4√3", "40√3"], lab: ["área da base =", "volume ="],
    s: ["A base é um triângulo equilátero de lado 4: área = 4²√3/4 = 4√3 ≈ 6.93.", "Volume = área da base × altura = 4√3 · 10 = 40√3 ≈ 69.28."] },
  { l: 2, q: "Um prisma hexagonal regular tem aresta da base 2 e altura 5. Calcule o volume.", f: ["30√3"],
    s: ["O hexágono regular é formado por 6 triângulos equiláteros de lado 2.", "Área da base = 6 · (2²√3/4) = 6√3.", "Volume = 6√3 · 5 = 30√3 ≈ 51.96."] },
  { l: 2, q: "Uma pirâmide quadrangular regular tem aresta da base 6 e altura 4. Calcule o apótema da pirâmide, a área total e o volume.", f: ["5", "96", "48"], lab: ["apótema =", "área total =", "volume ="],
    s: ["O apótema da base (do centro ao meio de um lado) mede 3.", "Apótema da pirâmide: √(4² + 3²) = 5.", "Área lateral: 4 triângulos de base 6 e altura 5 = 4 · 15 = 60. Área da base: 36. Área total = 96.", "Volume = (36 · 4)/3 = 48."] },
  { l: 2, q: "Uma pirâmide tem como base um triângulo equilátero de lado 2 cm e altura 8 cm. Qual é o volume, em cm³? (Questão 77, item 02)", f: ["8√3/3"],
    s: ["Área da base = 2²√3/4 = √3.", "Volume = (área da base × altura)/3 = √3 · 8/3 = 8√3/3 ≈ 4.62 cm³."] },
  { l: 2, q: "Calcule a altura e o volume de um tetraedro regular de aresta 6.", f: ["2√6", "18√2"], lab: ["altura =", "volume ="],
    s: ["O pé da altura é o centro da base. A distância do centro a um vértice da base é (2/3) da altura do triângulo: (2/3) · (6√3/2) = 2√3.", "Altura: h = √(6² − (2√3)²) = √(36 − 12) = √24 = 2√6 ≈ 4.90.", "Área da base = 6²√3/4 = 9√3. Volume = 9√3 · 2√6 / 3 = 6√18 = 18√2 ≈ 25.46."] },
  { l: 2, q: "São dados um tetraedro e um plano. A interseção dos dois será (Questão 45)", o: ["ou um ponto, ou um segmento, ou um triângulo, ou um quadrilátero, ou vazio", "um triângulo", "ou um triângulo ou um quadrilátero", "ou um ponto, ou um segmento, ou um triângulo, ou vazio"],
    ow: [null, "Também pode ser quadrilátero, ponto, segmento ou vazio.", "Faltam os casos ponto, segmento e vazio.", "Falta o quadrilátero: um plano pode separar duas arestas de cada lado e cortar 4 arestas."],
    s: ["O plano pode não tocar o tetraedro (vazio), tocar só num vértice (ponto) ou conter uma aresta (segmento).", "Se separar um vértice dos outros três, corta 3 arestas: triângulo.", "Se separar dois vértices dos outros dois, corta 4 arestas: quadrilátero."] },
  { l: 2, q: "Quantos triângulos, com vértices entre os 20 vértices de um dodecaedro regular, NÃO estão contidos em nenhuma das faces? (Questão 91)", f: ["1020"],
    s: ["Total de triângulos com 3 dos 20 vértices: C(20,3) = 1140 (não há 3 vértices colineares).", "Em cada face pentagonal cabem C(5,3) = 10 triângulos; são 12 faces: 120.", "Triângulos fora das faces: 1140 − 120 = 1020."] },

  /* ================= Nível 4 · corpos redondos ================= */
  { l: 3, q: "Um cilindro tem raio 3 e altura 5. Calcule a área lateral e o volume.", f: ["30π", "45π"], lab: ["área lateral =", "volume ="],
    s: ["Área lateral = 2πrh = 2π · 3 · 5 = 30π ≈ 94.25.", "Volume = πr²h = π · 9 · 5 = 45π ≈ 141.37."] },
  { l: 3, q: "A planificação da superfície lateral de um cilindro reto de raio r e altura h é", o: ["um retângulo de lados 2πr e h", "um setor circular de raio h", "um retângulo de lados πr e h", "um quadrado de lado h"],
    ow: [null, "Setor circular é a planificação lateral do cone.", "O comprimento da circunferência é 2πr, não πr.", "Só seria quadrado se 2πr = h."],
    s: ["Ao 'desenrolar' a lateral, a altura vira um lado do retângulo.", "O outro lado é o comprimento da circunferência da base: 2πr."] },
  { l: 3, q: "Um cilindro equilátero (altura igual ao diâmetro) tem raio 2. Calcule a área total e o volume.", f: ["24π", "16π"], lab: ["área total =", "volume ="],
    s: ["Equilátero: h = 2r = 4.", "Área total = 2πr² + 2πrh = 8π + 16π = 24π ≈ 75.40.", "Volume = πr²h = π · 4 · 4 = 16π ≈ 50.27."] },
  { l: 3, q: "Um cilindro tem raio 2 e altura 10. Qual é a área total?", f: ["48π"],
    s: ["Área das duas bases: 2πr² = 2π · 4 = 8π.", "Área lateral: 2πrh = 2π · 2 · 10 = 40π.", "Área total = 48π ≈ 150.80."] },
  { l: 3, q: "A seção meridiana de um cilindro é um quadrado de área 36. Qual é o volume do cilindro?", f: ["54π"],
    s: ["A seção meridiana tem lados 2r e h. Quadrado de área 36: 2r = h = 6, então r = 3.", "Volume = π · 3² · 6 = 54π ≈ 169.65."] },
  { l: 3, q: "Um cone reto tem raio 3 e altura 4. Calcule a geratriz, a área lateral, a área total e o volume.", f: ["5", "15π", "24π", "12π"], lab: ["geratriz =", "área lateral =", "área total =", "volume ="],
    s: ["g = √(r² + h²) = √(9 + 16) = 5.", "Área lateral = πrg = π · 3 · 5 = 15π.", "Área total = πr² + πrg = 9π + 15π = 24π.", "Volume = πr²h/3 = π · 9 · 4/3 = 12π."] },
  { l: 3, q: "Um cone tem geratriz 10 e raio 6. Calcule a altura e o volume.", f: ["8", "96π"], lab: ["altura =", "volume ="],
    s: ["h = √(g² − r²) = √(100 − 36) = 8.", "Volume = πr²h/3 = π · 36 · 8/3 = 96π ≈ 301.59."] },
  { l: 3, q: "Um cone equilátero (geratriz igual ao diâmetro) tem raio 3. Calcule a altura e o volume.", f: ["3√3", "9√3π"], lab: ["altura =", "volume ="],
    s: ["Equilátero: g = 2r = 6.", "h = √(g² − r²) = √(36 − 9) = √27 = 3√3 ≈ 5.20.", "Volume = π · 9 · 3√3/3 = 9√3π ≈ 48.97."] },
  { l: 3, q: "Um cone e um cilindro têm a mesma base (raio 2) e a mesma altura (6). Quanto vale o volume do cone e que fração ele é do volume do cilindro?", f: ["8π", "1/3"], lab: ["volume do cone =", "fração do cilindro ="],
    s: ["Cilindro: π · 4 · 6 = 24π.", "Cone: 24π/3 = 8π.", "Fração: 8π/24π = 1/3. Sempre vale: o cone tem 1/3 do cilindro de mesma base e altura."] },
  { l: 3, q: "Calcule a área da superfície e o volume de uma esfera de raio 3.", f: ["36π", "36π"], lab: ["área =", "volume ="],
    s: ["Área = 4πR² = 4π · 9 = 36π.", "Volume = 4πR³/3 = 4π · 27/3 = 36π. (Para R = 3 os dois números coincidem.)"] },
  { l: 3, q: "Se o raio de uma esfera dobra, a área da superfície fica multiplicada por quanto?", f: ["4"],
    s: ["A área é 4πR², proporcional a R².", "Com raio 2R: 4π(2R)² = 16πR², ou seja, 4 vezes a área original. (O volume ficaria 8 vezes maior.)"] },
  { l: 3, q: "Uma esfera tem volume 288π. Qual é o raio?", f: ["6"],
    s: ["4πR³/3 = 288π ⇒ R³ = 288 · 3/4 = 216.", "R = ∛216 = 6."] },
  { l: 3, q: "Uma esfera tangencia dois planos paralelos que estão a 8 cm um do outro. Qual é a área da superfície dessa esfera, em cm²? (Questão 77, item 03)", f: ["64π"],
    s: ["Tangente aos dois planos paralelos, a esfera tem diâmetro igual à distância entre eles: 2R = 8 ⇒ R = 4.", "Área = 4π · 16 = 64π ≈ 201.06 cm².", "Por isso o item 03 da questão 77, que dizia 256π, é falso."] },
  { l: 3, q: "Uma esfera de raio 6 é cortada por um plano a 4 do centro. Calcule o raio e a área da seção.", f: ["2√5", "20π"], lab: ["raio da seção =", "área da seção ="],
    s: ["O raio da esfera, a distância ao centro e o raio da seção formam um triângulo retângulo: r² = R² − d².", "r² = 36 − 16 = 20 ⇒ r = 2√5 ≈ 4.47.", "Área da seção = πr² = 20π ≈ 62.83."] },
  { l: 3, q: "Sejam E₁, E₂, E₃ e E₄ quatro pontos não coplanares. Sobre as superfícies esféricas que passam por eles, é correto afirmar que (Questão 31)", o: ["existe uma única superfície esférica contendo E₁, E₂, E₃ e E₄", "existem infinitas superfícies esféricas com centros numa mesma reta, cada uma contendo os quatro pontos", "existem infinitas superfícies esféricas com centros fora de uma mesma reta, cada uma contendo os quatro pontos", "nenhuma das anteriores"],
    ow: [null, "Isso aconteceria com só três pontos (centros na reta perpendicular ao plano deles).", "Os quatro pontos fixam um único centro.", "A primeira alternativa é verdadeira."],
    s: ["O centro precisa estar à mesma distância dos quatro pontos.", "Os pontos equidistantes de E₁ e E₂ formam um plano (plano mediador); o mesmo para E₁E₃ e E₁E₄.", "Com os pontos não coplanares, esses três planos se cortam num único ponto: o centro. O raio fica determinado: a esfera é única."] },
  { l: 3, q: "Se uma reta r encontra a superfície lateral C de um cilindro em um ponto P, então (Questão 32)", o: ["P pode ser o único ponto comum a r e C", "a reta e a superfície terão necessariamente infinitos pontos em comum", "a reta e a superfície terão necessariamente dois únicos pontos em comum", "a reta e a superfície podem ter exatamente 3 pontos em comum"],

const MQ = MAT_RAW.map((r, id) => ({ id, ...r }));

/* ---------- leitor de respostas ----------
 * Aceita ponto ou vírgula como separador decimal, frações (3/4), raízes (2√7, √2/2),
 * números complexos (2-3i, -i, 1/2i) e um "x =" no começo. Devolve { re, im } ou null. */
function matLerReal(t, vazioVale1) {
  if (t === "") return vazioVale1 ? 1 : null;
  const partes = t.split("/");
  if (partes.length > 2) return null;
  const vals = partes.map((p) => {
    const m = /^(\d*\.?\d*)(?:√(\d*\.?\d+))?$/.exec(p);
    if (!m || (!m[1] && m[2] == null)) return null;
    if (m[1] && !/\d/.test(m[1])) return null;
    const coef = m[1] ? Number(m[1]) : 1;
    return m[2] != null ? coef * Math.sqrt(Number(m[2])) : coef;
  });
  if (vals.includes(null)) return null;
  if (vals.length === 2) return vals[1] === 0 ? null : vals[0] / vals[1];
  return vals[0];
}
function matLer(bruto) {
  let s = String(bruto == null ? "" : bruto).toLowerCase()
    .replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".")
    .replace(/[°º]|graus?/g, "").replace(/sqrt|raiz/g, "√").replace(/[*·×]/g, "")
    .replace(/√\((\d*\.?\d+)\)/g, "√$1").replace(/pi/g, "π");
  s = s.replace(/^(?:\|z\||[a-zθρ][a-z0-9₀-₉]*)=/, "")
    .replace(/(?:metros?|cent[ií]metros?|(?:cm|dm|mm|km|m)(?:²|³|2|3)?)$/, "");
  if (!s) return null;
  const termos = s.match(/[+-]?[^+-]+/g);
  if (!termos || termos.join("") !== s) return null;
  let re = 0, im = 0;
  for (let t of termos) {
    let sinal = 1;
    if (t[0] === "+" || t[0] === "-") { if (t[0] === "-") sinal = -1; t = t.slice(1); }
    const nI = (t.match(/i/g) || []).length, nPi = (t.match(/π/g) || []).length;
    if (nI > 1 || nPi > 1) return null;
    t = t.replace("i", "").replace("π", "");
    if (t[0] === "/") t = "1" + t;
    let v = matLerReal(t, nI === 1 || nPi === 1);
    if (v != null && nPi) v *= Math.PI;
    if (v == null || !Number.isFinite(v)) return null;
    if (nI) im += sinal * v; else re += sinal * v;
  }
  return { re, im };
}
const matPerto = (a, b) => Math.abs(a - b) <= 0.011 + 0.001 * Math.abs(b);
const matIgual = (a, b) => matPerto(a.re, b.re) && matPerto(a.im, b.im);
/* compara as respostas do jogador com as esperadas; em "set" a ordem não importa */
function matConfere(q, vals) {
  const dados = vals.map(matLer), certos = q.f.map(matLer);
  if (!q.set) return certos.every((c, i) => matIgual(dados[i], c));
  const usado = new Array(certos.length).fill(false);
  const tenta = (i) => {
    if (i === dados.length) return true;
    for (let j = 0; j < certos.length; j++) {
      if (!usado[j] && matIgual(dados[i], certos[j])) { usado[j] = true; if (tenta(i + 1)) return true; usado[j] = false; }
    }
    return false;
  };
  return tenta(0);
}

/* ---------- formatação ---------- */
const mfmt = (s) => esc(s).replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>");
const matMostra = (s) => esc(String(s).replace(/(.)([+-])/g, "$1 $2 ").replace(/-/g, "−"));
const matSup = (n) => String(n).replace(/[0-9-]/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] || "⁻");
function matNum(x) {
  if (!Number.isFinite(x)) return "∞";
  if (x >= 1e6) { const [m, e] = x.toExponential(2).split("e"); return `${m.replace(/\.?0+$/, "")} × 10${matSup(+e)}`; }
  const [int, dec] = String(Math.round(x * 100) / 100).split(".");
  const g = int.length > 4 ? int.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : int;
  return dec ? `${g}.${dec}` : g;
}
const matExpoTxt = (k) => String(Math.round(matExpo(k) * 1000) / 1000);
const matFormula = (k) => `${matForca(k).toFixed(1).replace(/\.0$/, "")}<sup>${matExpoTxt(k)}</sup>`;

const MAT_KEY = "masmorra-dlc-geometria-espacial";
function matRecordes() {
  try { const d = JSON.parse(localStorage.getItem(MAT_KEY)); return (d && d[USER.name.toLowerCase()]) || {}; } catch (e) { return {}; }
}
function matSalvaRecorde(lvl, r) {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(MAT_KEY)) || {}; } catch (e) { d = {}; }
  const k = USER.name.toLowerCase();
  const meu = d[k] || {}, ant = meu[lvl] || { best: 0, ko: false, combo: 0 };
  const novo = r.score > ant.best;
  meu[lvl] = { best: Math.max(ant.best, r.score), ko: ant.ko || r.ko, combo: Math.max(ant.combo, r.combo) };
  d[k] = meu;
  try { localStorage.setItem(MAT_KEY, JSON.stringify(d)); } catch (e) { /* sem armazenamento: o recorde só vale nesta sessão */ }
  return novo;
}

function matComecar(lvl) {
  const ids = MQ.filter((q) => q.l === lvl).map((q) => q.id); /* ordem fixa: da mais fácil para a mais difícil */
  S = { screen: "mat-ring", m: { lvl, hp: MAT_HP, k: 0, combo: 0, score: 0, hits: 0, tries: 0, log: [], ko: false, continuar: false, deck: ids, total: ids.length, cur: null } };
  matSacar();
  render();
}
function matSacar() {
  const m = S.m, id = m.deck.shift();
  m.cur = { id, n: m.total - m.deck.length, vals: [], err: "", done: false, order: MQ[id].o ? shuffle(MQ[id].o.map((_, i) => i)) : null };
  fx.modal = true;
}
async function matResponder(escolha) {
  const m = S.m, c = m.cur, q = MQ[c.id];
  if (!c || c.done || busy) return;
  let ok;
  if (q.o) {
    c.chosen = escolha;
    ok = c.order[escolha] === 0;
  } else {
    c.vals = escolha;
    if (escolha.some((v) => !String(v).trim())) { c.err = q.f.length > 1 ? "Preencha todos os campos." : "Digite uma resposta."; c.errAt = escolha.findIndex((v) => !String(v).trim()); render(); return; }
    const ruim = escolha.findIndex((v) => !matLer(v));
    if (ruim >= 0) { c.err = `Não entendi “${escolha[ruim]}”. Escreva números como 1.5, 3/4, 6√3 ou 36π.`; c.errAt = ruim; render(); return; }
    ok = matConfere(q, escolha);
  }
  c.err = ""; c.done = true; c.ok = ok;
  m.tries++;
  const antes = m.hp, jaCaiu = m.ko;
  c.hpAntes = antes;
  if (ok) {
    m.k++; m.hits++;
    c.k = m.k;
    c.dmg = jaCaiu ? 0 : matGolpe(m.k);
    m.hp = Math.max(0, m.hp - c.dmg);
    c.pts = 10 * m.k * (m.lvl + 1) + Math.round(Math.min(c.dmg, antes));
    if (!jaCaiu && m.hp <= 0) { m.ko = true; c.bonus = 250 * (m.lvl + 1); c.pts += c.bonus; }
    m.score += c.pts;
    m.combo = Math.max(m.combo, m.k);
  } else {
    c.lost = m.k;
    m.k = 0;
  }
  m.log.push({ id: c.id, ok, given: q.o ? q.o[c.order[escolha]] : escolha.slice() });
  busy = true;
  render();
  try { await (jaCaiu ? wait(150) : ok ? matSoco(c, antes) : matErro(c)); } finally { busy = false; }
  $app.querySelectorAll("[data-act='mat-next'], [data-act='mat-cont']").forEach((b) => { b.disabled = false; });
  const nb = document.getElementById("matNext");
  if (nb) nb.focus({ preventScroll: true });
}
function matProxima() {
  const m = S.m;
  if (busy || !m.cur || !m.cur.done) return;
  if (!m.deck.length || (m.ko && !m.continuar)) {
    m.newBest = matSalvaRecorde(m.lvl, { score: m.score, ko: m.ko, combo: m.combo });
    S.screen = "mat-end";
  } else matSacar();
  render();
}
function matContinuar() {
  if (busy || !S.m.cur || !S.m.cur.done) return;
  S.m.continuar = true;
  matProxima();
}

function matAlternativas(q, dada) {
  if (!q.o) return "";
  const outras = q.o.map((t, i) => ({ t, w: q.ow[i] })).slice(1).filter((x) => x.t !== dada);
  const marcada = dada != null && dada !== q.o[0] ? `<p class="porque"><b>Por que “${mfmt(dada)}” está errada:</b> ${mfmt(q.ow[q.o.indexOf(dada)])}</p>` : "";
  return `${marcada}
    <details class="outras"><summary>${marcada ? "Por que as outras alternativas também estão erradas" : "Por que as outras alternativas estão erradas"}</summary>
      <ul>${outras.map((x) => `<li><b>${mfmt(x.t)}</b>: ${mfmt(x.w)}</li>`).join("")}</ul>
    </details>`;
}
/* bloco completo de estudo: o que foi respondido, a resposta certa, a resolução e as alternativas */
function matEstudo(q, ok, given) {
  return `
    <p class="linha-resp">${q.o ? "Você marcou" : "Sua resposta"}: <b class="${ok ? "certo" : "errado"}">${matDada(q, given)}</b></p>
    ${ok ? "" : `<p class="linha-resp">Resposta certa: <b class="certo">${matCerta(q)}</b></p>`}
    ${q.o ? matAlternativas(q, given) : ""}
    ${matPassos(q)}`;
}

/* ---------- telas ---------- */
function vMatHome() {
  const rec = matRecordes();
  let acum = 0, koEm = 0;
  const linhas = [];
  for (let k = 1; k <= 30 && !koEm; k++) {
    const d = matGolpe(k);
    acum += d;
    if (acum >= MAT_HP) koEm = k;
    if ([1, 2, 5, 10, 15, 18, 19].includes(k) || koEm) {
      linhas.push(`<tr><td class="num">${k}º</td><td class="num">${matFormula(k)}</td><td class="num">${matNum(d)}</td><td class="num">${koEm ? `${matNum(acum)} <b>nocaute</b>` : matNum(acum)}</td></tr>`);
    }
  }
  return `
  <section class="title">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> Masmorra do Deploy</span>
    <h1>Ringue da <span>Matemática</span></h1>
    <p class="lead">Geometria espacial em quatro níveis: posição de retas e planos, perpendicularismo, poliedros e corpos redondos. Um boneco de palha com ${MAT_HP} de vida, pendurado como saco de pancadas: cada resposta certa é um soco. Não tem relógio, e toda pergunta, certa ou errada, mostra a resolução completa.</p>
  </section>
  <section class="mat-rules">
    <div class="panel">
      <h3>Sequência é tudo</h3>
      <p class="muted">Todo golpe começa em 1. O expoente começa em 1.001 e, a cada acerto seguido, soma 1/10 dele mesmo. A força do soco sobe 0.1 por golpe. Errar devolve você ao golpe 1.</p>
      <table class="golpes"><thead><tr><th>Golpe</th><th>Conta</th><th>Dano</th><th>Total</th></tr></thead><tbody>${linhas.join("")}</tbody></table>
      <p class="muted">Com ${koEm} acertos seguidos o boneco cai. Sequências menores também tiram vida, só que bem menos.</p>
    </div>
    <div class="panel">
      <h3>Como responder</h3>
      <p class="muted">As perguntas seguem a ordem da lista, da mais fácil para a mais difícil. Algumas são de marcar; a maioria pede a conta e a resposta digitada. Use <b>ponto</b> no lugar da vírgula decimal.</p>
      <ul class="exemplos">
        <li><code>2.5</code> ou <code>5/2</code></li>
        <li><code>6√3</code> ou <code>10.39</code></li>
        <li><code>36π</code>, <code>8√3/3</code> ou <code>113.1</code> (unidades como cm³ podem ficar de fora)</li>
      </ul>
      <p class="muted">Pontos por acerto: 10 × golpe × nível, mais o dano causado. O nocaute dá bônus. Depois do nocaute você pode continuar estudando as perguntas que faltam.</p>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:24px">Escolha o nível</h2>
    <div class="mat-levels">
      ${MAT_NIVEIS.map((n, i) => {
        const r = rec[i], qt = MQ.filter((q) => q.l === i).length;
        return `
        <button class="card mat-card" style="--dom:${n.cor}" data-act="mat-go" data-v="${i}">
          <span class="band"><span>${esc(n.fonte)}</span><span>${qt} perguntas</span></span>
          <span class="skill">${n.nome}</span>
          <span class="desc"><b>${esc(n.tema)}.</b> ${esc(n.txt)}</span>
          <span class="tags">${r ? `<span class="tag">${r.ko ? "Nocaute ✓" : "Sem nocaute"}</span><span class="tag">Recorde ${r.best}</span><span class="tag">Maior sequência ${r.combo}</span>` : `<span class="tag">Ainda não jogado</span>`}</span>
        </button>`;
      }).join("")}
    </div>
  </section>
  <div class="row"><button class="btn ghost" data-act="home">Voltar à masmorra</button></div>`;
}

function vMatIntro() {
  const i = S.lvl, n = MAT_NIVEIS[i], qt = MQ.filter((q) => q.l === i).length;
  return `
  <section class="title">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> ${esc(n.fonte)}</span>
    <h1>${n.nome}: <span>${esc(n.tema)}</span></h1>
    <p class="lead">${esc(n.txt)} São ${qt} perguntas, da mais fácil para a mais difícil.</p>
  </section>
  <section class="panel resumo" style="--dom:${n.cor}">
    <h2>Resumo da matéria</h2>
    <ul>${n.resumo.map((t) => `<li>${mfmt(t)}</li>`).join("")}</ul>
  </section>
  <div class="row">
    <button class="btn" data-act="mat-start" data-v="${i}">Começar o ${n.nome}</button>
    <button class="btn ghost" data-act="mat-home">Voltar</button>
  </div>`;
}

function vMatCombo(m) {
  const prox = m.k + 1;
  if (m.ko) return `
  <div class="combo hot">
    <div><span class="eyebrow">Sequência</span><b class="num">×${m.k}</b></div>
    <div><span class="eyebrow">Boneco</span><b class="num">Nocaute</b><span class="muted">${m.continuar ? "Modo estudo: sem dano" : ""}</span></div>
  </div>`;
  return `
  <div class="combo${m.k ? " hot" : ""}">
    <div><span class="eyebrow">Sequência</span><b class="num">×${m.k}</b></div>
    <div><span class="eyebrow">Próximo golpe</span><b class="num">${matFormula(prox)}</b><span class="muted num">= ${matNum(matGolpe(prox))} de dano</span></div>
  </div>`;
}

function vMatRing() {
  const m = S.m, n = MAT_NIVEIS[m.lvl], c = m.cur, q = MQ[c.id];
  const letters = "ABCD";
  const hpVis = c.done && busy && c.hpAntes != null ? c.hpAntes : m.hp;
  const corpo = q.o
    ? `<div class="opts">${c.order.map((oi, k) => {
        let cls = "opt";
        if (c.done && oi === 0) cls += " right";
        if (c.done && k === c.chosen && oi !== 0) cls += " wrong";
        return `<button class="${cls}" data-act="mat-mc" data-v="${k}" ${c.done ? "disabled" : ""}><span class="l">${letters[k]}</span><span>${mfmt(q.o[oi])}</span></button>`;
      }).join("")}</div>`
    : `<form class="mat-form" id="matForm" autocomplete="off" novalidate>
        <div class="ans-grid">
          ${q.f.map((_, i) => {
            const rot = q.lab ? q.lab[i] : q.f.length > 1 ? `${i + 1}ª raiz` : "Resposta";
            return `<label class="ans${c.errAt === i && c.err ? " bad" : ""}"><span>${esc(rot)}</span>
              <input name="r${i}" inputmode="text" spellcheck="false" autocapitalize="none" enterkeyhint="${i === q.f.length - 1 ? "done" : "next"}" value="${esc(c.vals[i] || "")}" ${c.done ? "disabled" : ""} placeholder="${i === 0 ? "ex.: 12 · 6√3 · 36π" : ""}"></label>`;
          }).join("")}
        </div>
        ${q.set ? `<p class="set-note">Em qualquer ordem.</p>` : ""}
        ${c.done ? "" : `
        <div class="keys" aria-label="Símbolos">
          ${["π", "√", "/", "−", "."].map((s) => `<button type="button" class="key" data-act="mat-key" data-v="${s === "−" ? "-" : s}">${s}</button>`).join("")}
        </div>
        <p class="err" role="alert">${esc(c.err || "")}</p>
        <button class="btn punch" type="submit">Socar</button>`}
      </form>`;
  const ultimo = m.log[m.log.length - 1];
  const fim = !m.deck.length, acabouDeCair = m.ko && !m.continuar;
  const titulo = c.ok
    ? (c.dmg ? `Certo! Golpe ${c.k}: ${matNum(c.dmg)} de dano · +${c.pts} pontos` : `Certo! Sequência ×${c.k} · +${c.pts} pontos`)
    : c.lost ? `Errou · a sequência de ${c.lost} acabou` : "Errou";
  return `
  <header class="hud">
    <div class="lvl"><span class="eyebrow"><span class="dlc-tag">DLC</span> ${esc(n.fonte)} · ${esc(n.tema)}</span><h2>${n.nome}</h2></div>
    <div class="wallet"><span><b>${m.score}</b> pontos</span><span>Acertos ${m.hits}/${m.tries}</span><span>Maior sequência ${m.combo}</span></div>
  </header>
  <section class="ring" style="--dom:${n.cor}">
    <div class="panel ring-side">
      <div class="ringbox"><div class="bag${m.ko && !(busy && c.bonus) ? " down" : ""}">${MAT_SACO}</div></div>
      <div class="ring-info">
        <div class="row between"><span class="eyebrow">Boneco de palha</span><span class="mat-hpnum hpnum">${matNum(hpVis)} / ${MAT_HP}</span></div>
        <div class="bar mat-hp" role="progressbar" aria-label="Vida do boneco" aria-valuemin="0" aria-valuemax="${MAT_HP}" aria-valuenow="${Math.round(m.hp)}"><i style="width:${(hpVis / MAT_HP) * 100}%"></i></div>
        ${vMatCombo(m)}
      </div>
    </div>
    <div class="qbox mat-q${fx.modal ? " enter" : ""}" style="--dom:${n.cor}">
      <div class="band"><span>Pergunta ${c.n} de ${m.total}</span><span>${q.o ? "Marque" : "Calcule e digite"}</span></div>
      <div class="qbody">
        <h2 id="mqt">${mfmt(q.q)}</h2>
        ${corpo}
        ${c.done ? `
        <div class="feedback ${c.ok ? "ok" : "bad"}">
          <strong>${titulo}</strong>
          ${c.ok && c.bonus ? `<p><b>Nocaute!</b> Bônus de ${c.bonus} pontos.</p>` : ""}
          ${matEstudo(q, c.ok, ultimo.given)}
        </div>
        <div class="row mat-acoes">
          ${acabouDeCair && !fim ? `<button class="btn ghost" data-act="mat-cont" ${busy ? "disabled" : ""}>Continuar estudando (${m.deck.length} restantes)</button>` : ""}
          <button class="btn" data-act="mat-next" id="matNext" ${busy ? "disabled" : ""}>${fim || acabouDeCair ? "Ver resultado" : "Próxima pergunta"}</button>
        </div>` : ""}
      </div>
    </div>
  </section>
  <div class="row"><button class="btn ghost small" data-act="mat-home">Sair do ringue</button></div>`;
}

function vMatEnd() {
  const m = S.m, n = MAT_NIVEIS[m.lvl], rec = matRecordes()[m.lvl] || {};
  const pct = m.tries ? Math.round((m.hits / m.tries) * 100) : 0;
  const erros = m.log.filter((x) => !x.ok).length;
  return `
  <section class="title end">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> ${n.nome} · ${esc(n.tema)}</span>
    <h1>${m.ko ? "Nocaute!" : "O boneco aguentou"}</h1>
    <p class="lead">${m.ko
      ? `O boneco de palha caiu. Você respondeu ${m.tries} de ${m.total} perguntas, com maior sequência de ${m.combo} acertos.`
      : `As perguntas do nível acabaram com o boneco em ${matNum(m.hp)} de vida. Sequências longas batem muito mais forte: tente de novo.`}</p>
    <p class="wallet"><span>Pontuação <b>${m.score}</b></span><span>${m.newBest ? "Novo recorde neste nível!" : `Recorde do nível: ${rec.best || m.score}`}</span></p>
    <div class="row">
      <button class="btn" data-act="mat-start" data-v="${m.lvl}">Tentar de novo</button>
      ${m.lvl < MAT_NIVEIS.length - 1 ? `<button class="btn ghost" data-act="mat-go" data-v="${m.lvl + 1}">Ir para o ${MAT_NIVEIS[m.lvl + 1].nome}</button>` : ""}
      <button class="btn ghost" data-act="mat-home">Outros níveis</button>
    </div>
  </section>
  <section class="stats">
    <div class="panel stat"><span class="eyebrow">Acertos</span><span class="big">${m.hits}/${m.tries}</span><div class="bar"><i style="width:${pct}%;background:var(--ok)"></i></div><span class="hpnum">${pct}% de acerto</span></div>
    <div class="panel stat"><span class="eyebrow">Maior sequência</span><span class="big">×${m.combo}</span><span class="hpnum">Golpe mais forte: ${matNum(m.combo ? matGolpe(m.combo) : 0)}</span></div>
    <div class="panel stat"><span class="eyebrow">Vida do boneco</span><span class="big">${matNum(m.hp)}</span><div class="bar"><i style="width:${(m.hp / MAT_HP) * 100}%"></i></div><span class="hpnum">de ${MAT_HP}</span></div>
  </section>
  <section class="review">
    <h2 style="font-size:24px">Revisão completa</h2>
    <p class="muted">Todas as ${m.tries} perguntas respondidas, na ordem do nível, com a resolução passo a passo. ${erros ? `${erros === 1 ? "O erro aparece aberto" : `Os ${erros} erros aparecem abertos`}; toque num acerto para revisar também.` : "Você não errou nenhuma: toque em qualquer pergunta para revisar a resolução."}</p>
    ${m.log.map((x, i) => {
      const q = MQ[x.id];
      return `<details class="panel rev ${x.ok ? "rev-ok" : "rev-bad"}" ${x.ok ? "" : "open"}>
        <summary><span class="marca">${x.ok ? "✓" : "✗"}</span><span><span class="eyebrow">Pergunta ${i + 1} · ${x.ok ? "acertou" : "errou"}</span>${mfmt(q.q)}</span></summary>
        <div class="rev-corpo">${matEstudo(q, x.ok, x.given)}</div>
      </details>`;
    }).join("")}
    ${m.deck.length ? `
    <h3 style="font-size:20px;margin-top:8px">Perguntas que ficaram sem resposta (${m.deck.length})</h3>
    <p class="muted">O nocaute encerrou o nível antes delas. A resolução também está aqui para você estudar.</p>
    ${m.deck.map((id, i) => {
      const q = MQ[id];
      return `<details class="panel rev">
        <summary><span class="marca">·</span><span><span class="eyebrow">Pergunta ${m.tries + i + 1} · não respondida</span>${mfmt(q.q)}</span></summary>
        <div class="rev-corpo"><p class="linha-resp">Resposta: <b class="certo">${matCerta(q)}</b></p>${q.o ? matAlternativas(q, null) : ""}${matPassos(q)}</div>
      </details>`;
    }).join("")}` : ""}
  </section>`;
}

function matTecla(sim) {
  const form = document.getElementById("matForm");
  if (!form) return;
  const alvo = (matUltimoCampo && form.contains(matUltimoCampo)) ? matUltimoCampo : form.querySelector("input");
  if (!alvo) return;
  const a = alvo.selectionStart ?? alvo.value.length, b = alvo.selectionEnd ?? alvo.value.length;
  alvo.value = alvo.value.slice(0, a) + sim + alvo.value.slice(b);
  alvo.focus();
  alvo.setSelectionRange(a + sim.length, a + sim.length);
}
let matUltimoCampo = null;
document.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches("#matForm input")) matUltimoCampo = e.target; });

/* ================= render ================= */
function render() {
  if (!USER && S.screen !== "login") S = { screen: "login" };
  const views = { login: vLogin, start: vStart, intro: vIntro, battle: vBattle, clear: vClear, shop: vShop, end: vEnd, "mat-home": vMatHome, "mat-intro": vMatIntro, "mat-ring": vMatRing, "mat-end": vMatEnd };
  const prevScreen = $app.dataset.screen;
  $app.innerHTML = (views[S.screen] || vStart)();
  $app.dataset.screen = S.screen;
  $modal.innerHTML = S.screen === "battle" && S.cur ? vQuestion() : "";
  drawSprites($app);
  fx = { cards: new Set(), modal: false };
  if (S.screen !== "shop") toast = "";
  if (prevScreen !== S.screen) window.scrollTo(0, 0);
  const focus = $modal.querySelector("#nextBtn") || $modal.querySelector(".opt:not(:disabled)");
  if (focus) focus.focus({ preventScroll: true });
  if (S.screen === "login" && !authUI.busy) {
    const u = $app.querySelector("#f-user"), pw = $app.querySelector("#f-pass");
    (u && !u.value ? u : pw)?.focus({ preventScroll: true });
  }
  if (S.screen === "end" && !S.saved) saveGame();
  if (S.screen === "mat-ring" && S.m.cur) {
    const c = S.m.cur;
    const alvo = c.done ? $app.querySelector("#matNext:not(:disabled)")
      : $app.querySelector(c.err && c.errAt != null ? `#matForm input[name="r${c.errAt}"]` : "#matForm input") || $app.querySelector(".mat-q .opt");
    if (alvo) alvo.focus({ preventScroll: true });
    fx.modal = false;
  }
}

/* relógio das perguntas */
setInterval(() => {
  const c = S.cur;
  if (S.screen !== "battle" || !c || c.chosen != null || !c.deadline) return;
  const rem = timeLeft(c);
  const bar = document.querySelector("#tbar"), num = document.querySelector("#tnum");
  if (bar) { bar.firstElementChild.style.width = (rem / (lvl().tempo * 1000)) * 100 + "%"; bar.classList.toggle("low", rem < 10000); }
  if (num) num.textContent = Math.ceil(rem / 1000);
  if (rem <= 0) answer(-1);
}, 200);

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "cls": newGame(v); break;
    case "enter": enterChapter(); break;
    case "play": play(+v); break;
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "so": useSO(); break;
    case "pato": usePato(); break;
    case "hotfix": useHotfix(); break;
    case "shop": S.screen = "shop"; render(); break;
    case "buy": buy(v); break;
    case "promote": promote(); break;
    case "again": newGame(S.cls); break;
    case "home": S = { screen: "start" }; render(); break;
    case "logout": logout(); break;
    case "mat-home": S = { screen: "mat-home" }; render(); break;
    case "mat-go": S = { screen: "mat-intro", lvl: +v }; render(); break;
    case "mat-start": matComecar(+v); break;
    case "mat-cont": matContinuar(); break;
    case "mat-mc": matResponder(+v); break;
    case "mat-next": matProxima(); break;
    case "mat-key": matTecla(v); break;
    case "tab": {
      const u = $app.querySelector("#f-user");
      if (u) authUI.name = u.value;
      authUI.tab = v; authUI.error = ""; render(); break;
    }
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "authForm") { e.preventDefault(); submitAuth(e.target); }
  if (e.target.id === "matForm") { e.preventDefault(); matResponder([...e.target.querySelectorAll("input")].map((x) => x.value)); }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || busy || S.screen === "login") return;
  const k = e.key.toLowerCase();
  if (S.screen === "mat-ring") {
    const c = S.m.cur;
    if (c && !c.done && MQ[c.id].o && !e.target.matches("input")) {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0) { e.preventDefault(); matResponder(idx); }
    }
    return;
  }
  if (S.screen === "battle" && S.cur) {
    if (S.cur.chosen == null) {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0) { e.preventDefault(); answer(idx); }
    } else if (k === "enter" || k === " ") { e.preventDefault(); next(); }
  } else if (S.screen === "battle") {
    const idx = "123".indexOf(k);
    if (idx >= 0) { e.preventDefault(); play(idx); }
  }
});

/* ================= boot ================= */
async function start(data) {
  try { USER = (await Auth.current()).user || null; } catch (e) { USER = null; }
  if (USER) await refreshRanking();
  if (USER && data && data.state && data.state.screen && data.state.screen !== "login") {
    S = data.state;
    if (S.pending) resolvePending();
    if (S.cur && S.cur.deadline && S.cur.chosen == null) S.cur.deadline = Date.now() + lvl().tempo * 1000;
  } else {
    S = { screen: USER ? "start" : "login" };
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) { /* fora do viewer */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
