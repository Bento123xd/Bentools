<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masmorra do Deploy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sala de servidores à noite; cartas de mesa em papel com faixa colorida por área; HUD em painéis de rack. */
:root {
  color-scheme: dark;
  --bg: #0e131b;
  --bg-grid: #151c27;
  --panel: #171f2b;
  --panel-2: #1d2735;
  --line: #2a3648;
  --fg: #eef1f5;
  --muted: #a3afc0;
  --paper: #f1e9d6;
  --paper-2: #f9f4e8;
  --paper-ink: #221d13;
  --paper-muted: #675c48;
  --paper-edge: #b3a68a;
  --infra: #5ab6c8;
  --dev: #ef7d63;
  --redes: #e8b84a;
  --gold: #f0c75e;
  --ok: #6fcb8f;
  --bad: #e65a66;
  --shield: #8fb8ff;
  --led-off: #2b3340;
  --f-display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--fg);
  font: 400 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .9em; background: rgba(127,140,160,.18); padding: 1px 6px; border-radius: 5px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.muted { color: var(--muted); }
.btn {
  border: 0; border-radius: 10px; padding: 12px 22px;
  background: var(--paper); color: var(--paper-ink);
  font-family: var(--f-display); font-size: 17px; font-weight: 700;
  box-shadow: 0 4px 0 var(--paper-edge);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-edge); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

/* domínios */
.d-infra { --dom: var(--infra); }
.d-dev { --dom: var(--dev); }
.d-redes { --dom: var(--redes); }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--f-display); font-size: 13px; font-weight: 600;
  padding: 3px 11px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--dom, var(--line)); color: var(--dom, var(--muted));
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--dom, var(--muted)); }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* título */
.title { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.title h1 { font-size: clamp(42px, 9vw, 78px); font-weight: 800; letter-spacing: -.025em; line-height: 1.02; }
.title h1 span { color: var(--gold); }
.title .lead { color: var(--muted); max-width: 62ch; font-size: 17px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rules .panel { display: flex; flex-direction: column; gap: 6px; }
.rules h3 { font-size: 18px; }
.rules p { color: var(--muted); font-size: 15px; }

/* cartas */
.hand, .classes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card {
  position: relative; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 200px; padding: 0 0 14px;
  background: var(--paper); color: var(--paper-ink);
  border: 0; border-radius: 14px; overflow: hidden;
  box-shadow: 0 6px 0 var(--paper-edge), 0 14px 30px rgba(0,0,0,.35);
  transition: transform .15s ease, box-shadow .15s ease;
}
.card.deal, .classes .card { animation: deal .4s cubic-bezier(.2,.8,.3,1.2) both; }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(-.6deg); }
.card .band {
  background: var(--dom); color: #17130b;
  font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 8px 14px; display: flex; justify-content: space-between; gap: 8px;
}
.card .skill { font-family: var(--f-display); font-size: clamp(17px, 2.4vw, 22px); font-weight: 700; padding: 0 14px; line-height: 1.2; overflow-wrap: anywhere; }
.card .desc { padding: 0 14px; font-size: 14px; color: var(--paper-muted); line-height: 1.45; }
.card .power { margin-top: auto; padding: 0 14px; display: flex; align-items: baseline; gap: 6px; font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--paper-muted); }
.card .power b { font-size: 38px; font-weight: 800; color: var(--paper-ink); line-height: 1; }
.card .tags { padding: 0 14px; display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; }
.card .tag { font-family: var(--f-display); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: #17130b; color: var(--paper); }
.card .tag.weak { background: var(--bad); color: #fff; }
.card .key { position: absolute; right: 12px; bottom: 12px; font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--paper-muted); border: 1px solid #c9bda3; border-radius: 5px; padding: 0 6px; }
@keyframes deal { from { transform: translateY(30px) rotate(4deg) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

/* HUD */
.hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud .lvl { display: flex; flex-direction: column; gap: 2px; }
.hud h2 { font-size: 28px; }
.wallet { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.wallet span { color: var(--muted); font-size: 14px; }
.wallet b { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }

.arena { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.boss { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; position: relative; }
.boss canvas, .sprite { width: 128px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.boss .info { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.boss h3 { font-size: 23px; }
.boss .quote { color: var(--muted); font-style: italic; font-size: 15px; }
.bar { height: 14px; background: var(--led-off); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--bad); transition: width .5s cubic-bezier(.3,.7,.2,1); }
.hpnum { font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player { display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.leds { display: flex; gap: 6px; flex-wrap: wrap; }
.led { width: 28px; height: 13px; border-radius: 3px; background: var(--led-off); border: 1px solid var(--line); transition: background .3s; }
.led.on { background: var(--ok); box-shadow: 0 0 8px rgba(111,203,143,.55); border-color: transparent; }
.led.dying { animation: ledOut .6s steps(2) 3; }
@keyframes ledOut { 50% { background: var(--bad); box-shadow: 0 0 10px var(--bad); } }
.inv { display: flex; gap: 8px; flex-wrap: wrap; }
.item { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 7px 11px; font-size: 14px; text-align: left; line-height: 1.35; }
.item b { font-family: var(--f-display); font-weight: 700; display: block; font-size: 14px; color: var(--gold); }
.item:disabled { opacity: .45; cursor: not-allowed; }
.item.passive { cursor: default; border-color: var(--shield); }
.item.passive b { color: var(--shield); }
.log { font-size: 15px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; min-height: 2.8em; }
.log b { color: var(--fg); }
.hint { color: var(--muted); font-size: 14px; text-align: center; }

/* animações de ataque */
.bolt { position: fixed; z-index: 30; width: 30px; height: 30px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff 0 22%, var(--dom) 55%, transparent 72%);
  box-shadow: 0 0 18px 6px var(--dom), 0 0 40px 10px var(--dom); }
.bolt.big { width: 46px; height: 46px; }
.burst { position: absolute; width: 20px; height: 20px; border-radius: 50%; pointer-events: none; border: 4px solid var(--dom, var(--gold)); transform: translate(-50%, -50%); }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 2px; background: var(--dom, var(--gold)); pointer-events: none; }
.float { position: absolute; z-index: 5; font-family: var(--f-display); font-size: 40px; font-weight: 800; color: var(--gold); pointer-events: none; text-shadow: 0 3px 0 #000, 0 0 16px rgba(0,0,0,.6); transform: translate(-50%, -50%); white-space: nowrap; }
.float.crit { color: var(--bad); font-size: 46px; }
.float small { display: block; font-size: 14px; letter-spacing: .08em; text-align: center; }
.float.hurt { color: var(--bad); }
.float.block { color: var(--shield); font-size: 26px; }
.claw { position: absolute; inset: 0; pointer-events: none; }
.claw i { position: absolute; left: 10%; width: 80%; height: 5px; border-radius: 3px; background: var(--bad); box-shadow: 0 0 12px var(--bad); transform-origin: left center; }
.hitflash { filter: brightness(2.6) saturate(.4); }
.panel.hurtflash { background: #4a1d24; transition: background .1s; }

/* pergunta */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(6,9,14,.8);
  display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.qbox {
  width: min(700px, 100%);
  background: var(--paper); color: var(--paper-ink);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 8px 0 var(--paper-edge), 0 30px 80px rgba(0,0,0,.5);
}
.qbox.enter { animation: deal .3s cubic-bezier(.2,.8,.3,1.1) both; }
.qbox .band { background: var(--dom); color: #17130b; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: .03em; padding: 10px 20px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.timer { height: 6px; background: rgba(34,29,19,.15); }
.timer i { display: block; height: 100%; background: var(--paper-ink); transition: width .2s linear; }
.timer.low i { background: var(--bad); }
.qbody { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.qbody h2 { font-family: var(--f-body); font-weight: 600; font-size: clamp(18px, 2.4vw, 21px); line-height: 1.45; letter-spacing: 0; }
.qbody code { background: rgba(34,29,19,.1); }
.opts { display: grid; gap: 9px; }
.opt {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start;
  text-align: left; padding: 12px 14px; border-radius: 10px; line-height: 1.45;
  background: var(--paper-2); border: 1px solid #d6caaf; color: var(--paper-ink); font-size: 16px;
}
.opt:hover:not(:disabled) { border-color: var(--paper-ink); }
.opt .l { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: var(--paper-ink); color: var(--paper); border-radius: 6px; text-align: center; padding: 1px 0; }
.opt.right { background: #d9f0df; border-color: #3e9a5e; }
.opt.right .l { background: #2f7d4a; }
.opt.wrong { background: #f7d9d9; border-color: #b8404a; }
.opt.wrong .l { background: #b8404a; }
.opt.elim { opacity: .3; text-decoration: line-through; }
.opt:disabled { cursor: default; }
.qtools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qtools .row { gap: 8px; }
.tool { border: 1px dashed var(--paper-muted); background: transparent; color: var(--paper-ink); border-radius: 9px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.tool:disabled { opacity: .4; cursor: not-allowed; }
.qtools small { color: var(--paper-muted); font-size: 13px; }
.feedback { border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
.feedback strong { font-family: var(--f-display); font-size: 20px; }
.feedback.ok { background: #d9f0df; }
.feedback.bad { background: #f7d9d9; }
.qbox .btn { background: var(--paper-ink); color: var(--paper); box-shadow: 0 4px 0 #000; align-self: flex-end; }

/* jornada */
.path { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
.step .eyebrow { font-size: 12px; }
.step b { font-family: var(--f-display); font-size: 18px; }
.step.done { border-color: var(--ok); }
.step.done b::after { content: " ✓"; color: var(--ok); }
.step.now { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.step.locked { opacity: .5; }
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.intro .sprite { width: 168px; height: 168px; }
.intro h2 { font-size: clamp(28px, 5vw, 40px); }
.intro .txt { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* loja */
.shop-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.shop-head h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 800; }
.shop-status { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; }
.shop .card { min-height: 0; cursor: default; }
.shop .card:hover { transform: none; }
.shop .card .band { background: var(--dom, #c9bda3); }
.shop .buy { margin: 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.shop .buy button { border: 0; border-radius: 8px; padding: 8px 14px; background: var(--paper-ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.shop .buy button:disabled { opacity: .35; cursor: not-allowed; }
.shop .owned { font-size: 13px; color: var(--paper-muted); }
.price { white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--paper-ink); }
.price small { font-size: 13px; font-weight: 600; color: var(--paper-muted); }
.k-rec { --dom: #9ed3a9; }
.k-sup { --dom: #c9bda3; }
.k-atk { --dom: #f0a07a; }
.k-up { --dom: var(--gold); }
.toast { min-height: 1.6em; color: var(--ok); font-weight: 500; }

/* fim */
.end h1 { font-size: clamp(36px, 7vw, 60px); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .chip { align-self: flex-start; }
.stat .big { font-family: var(--f-display); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; }
.stat .bar i { background: var(--dom); }
.review { display: flex; flex-direction: column; gap: 10px; }
.miss { display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--dom); }
.miss p { font-size: 15px; }
.miss .you { color: var(--bad); }
.miss .ans { color: var(--ok); }
.miss .exp { color: var(--muted); }

@media (max-width: 720px) {
  .arena { grid-template-columns: 1fr; }
  .hand, .classes { gap: 8px; }
  .card { min-height: 176px; }
  .hand .card .desc, .classes .card .desc { display: none; }
  .hand .card .band, .classes .card .band { padding: 7px 9px; font-size: 11px; letter-spacing: .02em; }
  .hand .card .skill, .hand .card .power, .hand .card .tags,
  .classes .card .skill, .classes .card .power { padding: 0 9px; }
  .card .key { display: none; }
  .boss canvas { width: 92px; height: 92px; }
  .path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { grid-template-columns: 1fr; }
  .intro .sprite { width: 112px; height: 112px; }
  .stats { grid-template-columns: 1fr; }
}
@media (max-width: 430px) {
  .hand .card .band span + span, .classes .card .band span + span { display: none; }
  .card .power b { font-size: 30px; }
  .hand .card .skill { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

const BASE_HP = 5, HAND = 3, HOTFIX_DMG = 4, BEST_KEY = "masmorra-deploy-best";
let S = { screen: "start" };
let fx = { cards: new Set(), modal: false };
let busy = false;
let toast = "";

const $app = document.getElementById("app");
const $modal = document.getElementById("modal");
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const loadBest = () => { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } };
const saveBest = (v) => { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* sem storage */ } };

const lvl = () => NIVEIS[S.ch];
const boss = () => lvl().boss;
function dmgFor(q) {
  let d = 2 + (q.dom === S.cls ? 1 : 0) + (S.cert[q.dom] || 0);
  if (q.dom === boss().fraco) d *= 2;
  return d;
}
const price = (it) => it.preco + (it.passo || 0) * (S.buys[it.id] || 0);

function newGame(cls) {
  S = { screen: "intro", cls, ch: 0, hp: BASE_HP, maxHp: BASE_HP, xp: 0, score: 0, cleared: -1,
        inv: { so: 1, pato: 1, rollback: 0, hotfix: 0 }, cert: { infra: 0, dev: 0, redes: 0 }, buys: {},
        seen: [], names: {}, stats: { infra: [0, 0], dev: [0, 0], redes: [0, 0] }, missed: [] };
  render();
}
function enterChapter() {
  S.deck = shuffle(Q.filter((q) => q.lvl === S.ch && !S.seen.includes(q.id)).map((q) => q.id));
  S.hand = [];
  S.bossHp = boss().hp;
  S.cur = null; S.pending = null;
  S.log = `<b>${esc(boss().nome)}</b> bloqueia o caminho. Escolha uma carta.`;
  while (S.hand.length < HAND && draw()) { /* compra */ }
  S.screen = "battle";
  render();
}
/* compra uma pergunta nunca vista na jornada; se o nível acabar, usa um nível vizinho */
function freshId(filter) {
  const pool = Q.filter((q) => !S.seen.includes(q.id) && !S.hand.includes(q.id) && filter(q));
  return pool.length ? pick(pool).id : null;
}
function draw() {
  let id = null;
  while (S.deck.length && id == null) { const c = S.deck.pop(); if (!S.seen.includes(c)) id = c; }
  if (id == null) id = freshId((q) => q.lvl === S.ch) ?? freshId((q) => Math.abs(q.lvl - S.ch) === 1) ?? freshId(() => true);
  if (id == null) return false;
  S.hand.push(id);
  S.seen.push(id);
  const usados = S.hand.map((h) => S.names[h]);
  const livres = ATAQUES[Q[id].dom].filter((n) => !usados.includes(n));
  S.names[id] = pick(livres.length ? livres : ATAQUES[Q[id].dom]);
  fx.cards.add(id);
  return true;
}
function play(i) {
  if (busy || S.cur || S.hand[i] == null) return;
  const t = lvl().tempo;
  S.cur = { slot: i, id: S.hand[i], order: shuffle([0, 1, 2, 3]), elim: [], chosen: null, deadline: t ? Date.now() + t * 1000 : 0 };
  fx.modal = true;
  render();
}
function answer(k) {
  const c = S.cur;
  if (!c || c.chosen != null || (k >= 0 && c.elim.includes(k))) return;
  c.chosen = k;
  const q = Q[c.id];
  c.ok = k >= 0 && c.order[k] === 0;
  S.stats[q.dom][1]++;
  if (c.ok) {
    c.dmg = dmgFor(q);
    S.stats[q.dom][0]++;
    S.xp += c.dmg * 10; S.score += c.dmg * 10;
  } else {
    S.missed.push({ id: q.id, picked: k >= 0 ? c.order[k] : -1 });
  }
  render();
}
async function next() {
  const c = S.cur;
  if (busy || !c || c.chosen == null) return;
  const q = Q[c.id];
  S.cur = null;
  S.pending = { kind: c.ok ? "hit" : "miss", slot: c.slot, dom: q.dom, dmg: c.ok ? c.dmg : 0, crit: c.ok && q.dom === boss().fraco, shield: !c.ok && S.inv.rollback > 0 };
  await animateAndResolve();
}
async function useHotfix() {
  if (busy || S.cur || !S.inv.hotfix) return;
  S.inv.hotfix--;
  S.xp += HOTFIX_DMG * 5; S.score += HOTFIX_DMG * 5;
  S.pending = { kind: "hit", slot: null, dom: "hotfix", dmg: HOTFIX_DMG, crit: false, hotfix: true };
  await animateAndResolve();
}
async function animateAndResolve() {
  busy = true;
  render();
  try { await (S.pending.kind === "hit" ? animHit(S.pending) : animMiss(S.pending)); } catch (e) { /* animação é opcional */ }
  resolvePending();
  busy = false;
  render();
}
function resolvePending() {
  const p = S.pending;
  if (!p) return;
  const nomeAtk = p.slot != null ? S.names[S.hand[p.slot]] : "Hotfix em Produção";
  if (p.kind === "hit") {
    S.bossHp = Math.max(0, S.bossHp - p.dmg);
    S.log = `<b>${esc(nomeAtk)}</b> causou ${p.dmg} de dano${p.crit ? " (fraqueza!)" : ""}.`;
  } else if (p.shield) {
    S.inv.rollback--;
    S.log = `O <b>Rollback</b> desfez o golpe de ${esc(boss().nome)}. Nenhum uptime perdido.`;
  } else {
    S.hp = Math.max(0, S.hp - lvl().dano);
    S.log = `<b>${esc(nomeAtk)}</b> falhou. ${esc(boss().nome)} derrubou ${lvl().dano} de uptime.`;
  }
  if (p.slot != null) { S.hand.splice(p.slot, 1); draw(); }
  S.pending = null;
  if (S.bossHp <= 0) {
    S.cleared = S.ch;
    const ganho = lvl().bonus + S.hp * 20;
    S.lastReward = { bonus: lvl().bonus, uptime: S.hp * 20 };
    S.xp += ganho; S.score += ganho;
    S.screen = S.ch === NIVEIS.length - 1 ? "end" : "clear";
  } else if (S.hp <= 0) {
    S.screen = "end";
  } else if (!S.hand.length) {
    S.screen = "end";
  }
  if (S.screen === "end" && S.score > loadBest()) { S.newBest = true; saveBest(S.score); }
}
function useSO() {
  const c = S.cur;
  if (!c || c.chosen != null || !S.inv.so || c.elim.length) return;
  S.inv.so--;
  c.elim = shuffle([0, 1, 2, 3].filter((k) => c.order[k] !== 0)).slice(0, 2);
  render();
}
function usePato() {
  const c = S.cur;
  if (!c || c.chosen != null || !S.inv.pato) return;
  const dom = Q[c.id].dom;
  const id = freshId((q) => q.lvl === S.ch && q.dom === dom) ?? freshId((q) => q.lvl === S.ch);
  if (id == null) return;
  S.inv.pato--;
  S.deck = S.deck.filter((d) => d !== id);
  S.seen.push(id);
  S.names[id] = S.names[c.id];
  S.hand[c.slot] = id;
  const t = lvl().tempo;
  S.cur = { slot: c.slot, id, order: shuffle([0, 1, 2, 3]), elim: [], chosen: null, deadline: t ? Date.now() + t * 1000 : 0 };
  fx.modal = true;
  render();
}
function buy(id) {
  const it = SHOP.find((s) => s.id === id);
  if (!it || !canBuy(it)) return;
  S.xp -= price(it);
  S.buys[id] = (S.buys[id] || 0) + 1;
  it.compra();
  toast = `Compra feita: ${it.nome}.`;
  render();
}
function canBuy(it) {
  if (S.xp < price(it)) return false;
  if (it.max && (S.buys[it.id] || 0) >= it.max) return false;
  if (it.pode && !it.pode()) return false;
  return true;
}
function promote() {
  S.ch++;
  S.screen = "intro";
  render();
}

/* ================= animações ================= */
function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
function spawnIn(parent, cls, x, y, html = "") {
  const pr = parent.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = cls;
  el.style.left = (x - pr.left) + "px";
  el.style.top = (y - pr.top) + "px";
  el.innerHTML = html;
  parent.appendChild(el);
  return el;
}
async function animHit(p) {
  if (reduceMotion()) { await wait(150); return; }
  const target = $app.querySelector(".boss canvas");
  const bossPanel = $app.querySelector(".boss");
  const origin = p.slot != null ? $app.querySelector(`.hand .card[data-v="${p.slot}"]`) : $app.querySelector('[data-act="hotfix"]');
  if (!target || !origin) return;
  const domCls = p.hotfix ? "k-atk" : `d-${p.dom}`;
  if (p.slot != null) origin.animate([{ transform: "none" }, { transform: "translateY(-34px) scale(1.07) rotate(-2deg)" }], { duration: 200, easing: "ease-out", fill: "forwards" });
  await wait(180);
  const a = center(origin), b = center(target);
  const bolt = document.createElement("div");
  bolt.className = `bolt ${domCls}${p.crit || p.hotfix ? " big" : ""}`;
  bolt.style.left = a.x + "px"; bolt.style.top = a.y + "px";
  document.body.appendChild(bolt);
  const mx = (a.x + b.x) / 2 - a.x, my = Math.min(a.y, b.y) - 90 - a.y;
  await bolt.animate([
    { transform: "translate(-50%,-50%) scale(.5)" },
    { transform: `translate(calc(-50% + ${mx}px), calc(-50% + ${my}px)) scale(1)` },
    { transform: `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px)) scale(1.4)` }
  ], { duration: 460, easing: "cubic-bezier(.45,0,.55,1)" }).finished;
  bolt.remove();
  /* impacto */
  if (p.slot != null) origin.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-50px) scale(.85)" }], { duration: 260, fill: "forwards" });
  target.classList.add("hitflash");
  target.animate([{ transform: "none" }, { transform: "translateX(-10px) rotate(-4deg)" }, { transform: "translateX(9px) rotate(3deg)" }, { transform: "translateX(-5px)" }, { transform: "none" }], { duration: 420 });
  const ring = spawnIn(bossPanel, `burst ${domCls}`, b.x, b.y);
  ring.animate([{ width: "20px", height: "20px", opacity: 1 }, { width: p.crit ? "220px" : "150px", height: p.crit ? "220px" : "150px", opacity: 0 }], { duration: 520, easing: "ease-out" }).finished.then(() => ring.remove());
  for (let i = 0; i < (p.crit ? 14 : 9); i++) {
    const s = spawnIn(bossPanel, `spark ${domCls}`, b.x, b.y);
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 60;
    s.animate([{ transform: "translate(-50%,-50%)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) rotate(180deg)`, opacity: 0 }], { duration: 560, easing: "ease-out" }).finished.then(() => s.remove());
  }
  const fl = spawnIn(bossPanel, `float${p.crit ? " crit" : ""}`, b.x, b.y - 10, `−${p.dmg}${p.crit ? "<small>CRÍTICO</small>" : p.hotfix ? "<small>HOTFIX</small>" : ""}`);
  fl.animate([{ transform: "translate(-50%,-30%) scale(.6)", opacity: 0 }, { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-170%) scale(1)", opacity: 0 }], { duration: 1000, easing: "ease-out", fill: "forwards" }).finished.then(() => fl.remove());
  const bar = $app.querySelector(".boss .bar i");
  if (bar) bar.style.width = (Math.max(0, S.bossHp - p.dmg) / boss().hp) * 100 + "%";
  await wait(170);
  target.classList.remove("hitflash");
  await wait(600);
}
async function animMiss(p) {
  if (reduceMotion()) { await wait(150); return; }
  const target = $app.querySelector(".boss canvas");
  const pl = $app.querySelector(".player");
  const card = p.slot != null ? $app.querySelector(`.hand .card[data-v="${p.slot}"]`) : null;
  if (!target || !pl) return;
  if (card) card.animate([{ filter: "none", opacity: 1 }, { filter: "grayscale(1) brightness(.6)", opacity: 0, transform: "translateY(20px) rotate(6deg) scale(.9)" }], { duration: 420, fill: "forwards" });
  const a = center(target), b = center(pl);
  const dx = (b.x - a.x) * 0.35, dy = (b.y - a.y) * 0.35;
  await target.animate([
    { transform: "none" },
    { transform: "translate(-8px, 4px) scale(.95)", offset: .25 },
    { transform: `translate(${dx}px, ${dy}px) scale(1.25)`, offset: .55 },
    { transform: "none" }
  ], { duration: 520, easing: "ease-in-out" }).finished.catch(() => {});
  if (p.shield) {
    const fl = spawnIn(pl, "float block", b.x, b.y, "ROLLBACK!");
    fl.animate([{ transform: "translate(-50%,-50%) scale(.5)", opacity: 0 }, { transform: "translate(-50%,-50%) scale(1.1)", opacity: 1, offset: .3 }, { transform: "translate(-50%,-120%)", opacity: 0 }], { duration: 900, fill: "forwards" }).finished.then(() => fl.remove());
    pl.animate([{ boxShadow: "0 0 0 0 var(--shield)" }, { boxShadow: "0 0 0 6px var(--shield)" }, { boxShadow: "0 0 0 0 var(--shield)" }], { duration: 600 });
    await wait(700);
    return;
  }
  const claw = document.createElement("div");
  claw.className = "claw";
  claw.innerHTML = [18, 40, 62].map((t) => `<i style="top:${t}%;transform:rotate(-14deg) scaleX(0)"></i>`).join("");
  pl.appendChild(claw);
  claw.querySelectorAll("i").forEach((line, i) => line.animate([{ transform: "rotate(-14deg) scaleX(0)", opacity: 1 }, { transform: "rotate(-14deg) scaleX(1)", opacity: 1, offset: .5 }, { transform: "rotate(-14deg) scaleX(1)", opacity: 0 }], { duration: 520, delay: i * 70, fill: "forwards" }));
  pl.classList.add("hurtflash");
  $app.animate([{ transform: "none" }, { transform: "translate(-6px, 2px)" }, { transform: "translate(6px, -2px)" }, { transform: "translate(-3px, 1px)" }, { transform: "none" }], { duration: 360 });
  const dano = lvl().dano;
  const leds = [...pl.querySelectorAll(".led.on")].slice(-dano);
  leds.forEach((l) => { l.classList.add("dying"); });
  const fl = spawnIn(pl, "float hurt", b.x, b.y, `−${dano}<small>UPTIME</small>`);
  fl.animate([{ transform: "translate(-50%,-30%) scale(.6)", opacity: 0 }, { transform: "translate(-50%,-70%) scale(1.1)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-150%)", opacity: 0 }], { duration: 950, fill: "forwards" });
  await wait(250);
  pl.classList.remove("hurtflash");
  await wait(700);
  leds.forEach((l) => l.classList.remove("on"));
}

function drawSprites(root) {
  root.querySelectorAll("canvas[data-boss]").forEach((cv) => {
    const b = NIVEIS[+cv.dataset.boss].boss;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, 12, 12);
    b.px.forEach((row, y) => {
      for (let x = 0; x < 12; x++) {
        const ch = row[x] || ".";
        if (ch === ".") continue;
        ctx.fillStyle = ch === "k" ? "#0b0f15" : (b.cores[ch] || b.cores.a);
        ctx.fillRect(x, y, 1, 1);
      }
    });
  });
}

      ? "Você derrotou o Dragão do Débito Técnico e venceu os quatro capítulos."
      : `Seu uptime chegou a zero no capítulo ${S.ch + 1}. Nível alcançado: <b>${rankName()}</b>.`}</p>
    <p class="wallet"><span>Pontuação <b>${S.score}</b></span><span>${S.newBest ? "Novo recorde!" : best ? `Recorde ${best}` : ""}</span></p>
    <div class="row">
      <button class="btn" data-act="again">Jogar de novo</button>
      <button class="btn ghost" data-act="home">Trocar de classe</button>
    </div>
  </section>
  ${vPath()}
  <section class="stats">
    ${["infra", "dev", "redes"].map((d) => {
      const [ok, tot] = S.stats[d];
      const p = tot ? Math.round((ok / tot) * 100) : 0;
      return `<div class="panel stat d-${d}">${domChip(d)}<span class="big">${ok}/${tot}</span><div class="bar"><i style="width:${p}%"></i></div><span class="hpnum">${tot ? p + "% de acerto" : "Nenhuma carta jogada"}</span></div>`;
    }).join("")}
  </section>
  ${S.missed.length ? `
  <section class="review">
    <h2 style="font-size:24px">Para revisar</h2>
    ${S.missed.map((m) => {
      const q = Q[m.id];
      return `<div class="panel miss d-${q.dom}">
        <span class="eyebrow">${DOM[q.dom].nome} · Nível ${NIVEIS[q.lvl].nome}</span>
        <p><b>${rich(q.q)}</b></p>
        <p class="you">Sua resposta: ${m.picked < 0 ? "tempo esgotado" : rich(q.opts[m.picked])}</p>
        <p class="ans">Correta: ${rich(q.opts[0])}</p>
        <p class="exp">${rich(q.exp)}</p>
      </div>`;
    }).join("")}
  </section>` : ""}`;
}

/* ================= render ================= */
function render() {
  const views = { start: vStart, intro: vIntro, battle: vBattle, clear: vClear, shop: vShop, end: vEnd };
  const prevScreen = $app.dataset.screen;
  $app.innerHTML = (views[S.screen] || vStart)();
  $app.dataset.screen = S.screen;
  $modal.innerHTML = S.screen === "battle" && S.cur ? vQuestion() : "";
  drawSprites($app);
  fx = { cards: new Set(), modal: false };
  if (S.screen !== "shop") toast = "";
  if (prevScreen !== S.screen) window.scrollTo(0, 0);
  const focus = $modal.querySelector("#nextBtn") || $modal.querySelector(".opt:not(:disabled)");
  if (focus) focus.focus({ preventScroll: true });
}

/* relógio das perguntas */
setInterval(() => {
  const c = S.cur;
  if (S.screen !== "battle" || !c || c.chosen != null || !c.deadline) return;
  const rem = timeLeft(c);
  const bar = document.querySelector("#tbar"), num = document.querySelector("#tnum");
  if (bar) { bar.firstElementChild.style.width = (rem / (lvl().tempo * 1000)) * 100 + "%"; bar.classList.toggle("low", rem < 10000); }
  if (num) num.textContent = Math.ceil(rem / 1000);
  if (rem <= 0) answer(-1);
}, 200);

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "cls": newGame(v); break;
    case "enter": enterChapter(); break;
    case "play": play(+v); break;
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "so": useSO(); break;
    case "pato": usePato(); break;
    case "hotfix": useHotfix(); break;
    case "shop": S.screen = "shop"; render(); break;
    case "buy": buy(v); break;
    case "promote": promote(); break;
    case "again": newGame(S.cls); break;
    case "home": S = { screen: "start" }; render(); break;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || busy) return;
  const k = e.key.toLowerCase();
  if (S.screen === "battle" && S.cur) {
    if (S.cur.chosen == null) {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0) { e.preventDefault(); answer(idx); }
    } else if (k === "enter" || k === " ") { e.preventDefault(); next(); }
  } else if (S.screen === "battle") {
    const idx = "123".indexOf(k);
    if (idx >= 0) { e.preventDefault(); play(idx); }
  }
});

/* ================= boot ================= */
function start(data) {
  if (data && data.state && data.state.screen) {
    S = data.state;
    if (S.pending) resolvePending();
    if (S.cur && S.cur.deadline && S.cur.chosen == null) S.cur.deadline = Date.now() + lvl().tempo * 1000;
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) { /* fora do viewer */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
