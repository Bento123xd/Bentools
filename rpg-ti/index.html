    s: ["Chame t = x + 1, ou seja, x = t − 1: P(t) = 3(t − 1)² − (t − 1) + 5.", "3(t² − 2t + 1) − t + 1 + 5 = 3t² − 6t + 3 − t + 6 = 3t² − 7t + 9.", "Trocando t por x: P(x) = 3x² − 7x + 9. Conferindo: P(2) = 12 − 14 + 9 = 7, igual à questão anterior."] },
  { l: 0, q: "Num polinômio P(x) do 3º grau, o coeficiente de x³ é 1. Se P(1) = P(2) = 0 e P(3) = 30, calcule P(−1).", f: ["66"],
    s: ["1 e 2 são raízes: P(x) = (x − 1)(x − 2)(x − r), em que r é a terceira raiz.", "P(3) = (3 − 1)(3 − 2)(3 − r) = 2·1·(3 − r) = 30 ⇒ 3 − r = 15 ⇒ r = −12.", "P(x) = (x − 1)(x − 2)(x + 12).", "P(−1) = (−2)(−3)(11) = 66."] },
  { l: 0, q: "Se (−x − 14)/(x² + 3x − 4) ≡ A/(x − 1) + B/(x + 4), quanto vale A + B?", f: ["-1"],
    s: ["x² + 3x − 4 = (x − 1)(x + 4). Somando as frações: A(x + 4) + B(x − 1) = −x − 14 para todo x.", "x = 1: 5A = −15 ⇒ A = −3.", "x = −4: −5B = 4 − 14 = −10 ⇒ B = 2.", "A + B = −1."] },
  { l: 0, q: "Calcule k para que p(x) = kx² + kx + 1 satisfaça p(x) − x = p(x − 1).", f: ["1/2"],
    s: ["p(x − 1) = k(x − 1)² + k(x − 1) + 1 = kx² − 2kx + k + kx − k + 1 = kx² − kx + 1.", "p(x) − x = kx² + kx + 1 − x = kx² + (k − 1)x + 1.", "Igualando os coeficientes de x: k − 1 = −k ⇒ 2k = 1 ⇒ k = 1/2."] },
  { l: 0, q: "Determine A, B e C sabendo que (5 − 3x)/(x³ − 5x² + 6x) ≡ A/x + B/(x − 2) + C/(x − 3).", f: ["5/6", "1/2", "-4/3"], lab: ["A =", "B =", "C ="],
    s: ["Fatore o denominador: x³ − 5x² + 6x = x(x² − 5x + 6) = x(x − 2)(x − 3).", "Multiplicando tudo por ele: 5 − 3x = A(x − 2)(x − 3) + Bx(x − 3) + Cx(x − 2).", "x = 0: 5 = A·(−2)(−3) = 6A ⇒ A = 5/6.", "x = 2: 5 − 6 = B·2·(−1) ⇒ −1 = −2B ⇒ B = 1/2.", "x = 3: 5 − 9 = C·3·1 ⇒ C = −4/3."] },

  /* ================= Nível 2 · Lista 2 ================= */
  { l: 1, q: "Determine o resto da divisão de P(x) = x⁴ − 2x³ + x − 1 por x − 2.", f: ["1"],
    s: ["Teorema do resto: o resto da divisão por (x − a) é P(a). Aqui a = 2.", "P(2) = 16 − 16 + 2 − 1 = 1."] },
  { l: 1, q: "Calcule o resto da divisão de P(x) = 2x³ − x² + 5x − 3 por x − 4.", f: ["129"],
    s: ["Resto = P(4).", "P(4) = 2·64 − 16 + 20 − 3 = 128 − 16 + 20 − 3 = 129."] },
  { l: 1, q: "Calcule o resto da divisão de P(x) = 2x³ − 4x² + x − 1 por x − 1.", f: ["-2"],
    s: ["Resto = P(1).", "P(1) = 2 − 4 + 1 − 1 = −2."] },
  { l: 1, q: "Calcule o resto da divisão de P(x) = x⁴ + 2x² − x − 5 por x + 3.", f: ["97"],
    s: ["x + 3 = x − (−3), então o resto é P(−3).", "(−3)⁴ = 81; 2·(−3)² = 18; −(−3) = +3.", "P(−3) = 81 + 18 + 3 − 5 = 97.", "O gabarito da lista traz 98, mas a conta correta dá 97."] },
  { l: 1, q: "4x⁴ + 3x³ − 7x² + 2x − 2 é divisível por x − 1?", o: ["Sim, porque P(1) = 0", "Não, porque P(1) = −2", "Não, porque P(−1) ≠ 0", "Sim, porque P(−1) = 0"],
    ow: [null, "−2 é o termo independente, ou seja, P(0). O teste para x − 1 é P(1).", "P(−1) testa a divisão por x + 1, não por x − 1.", "P(−1) = 4 − 3 − 7 − 2 − 2 = −10, e o teste para x − 1 é P(1)."],
    s: ["D'Alembert: P(x) é divisível por (x − a) se e somente se P(a) = 0.", "P(1) = 4 + 3 − 7 + 2 − 2 = 0.", "Logo é divisível por x − 1."] },
  { l: 1, q: "P(x) = x² − 3x + 2 é divisível por x + 3?", o: ["Não, o resto é 20", "Sim, o resto é 0", "Não, o resto é 2", "Não, o resto é −20"],
    ow: [null, "As raízes de x² − 3x + 2 são 1 e 2; −3 não é raiz.", "2 é P(3). Mas x + 3 = x − (−3), então o teste é P(−3).", "Cuidado com os sinais: (−3)² = 9 e −3·(−3) = +9, então P(−3) = 9 + 9 + 2 = 20."],
    s: ["O resto da divisão por x + 3 é P(−3).", "P(−3) = (−3)² − 3(−3) + 2 = 9 + 9 + 2 = 20.", "Resto 20 ≠ 0: não é divisível. (x² − 3x + 2 = (x − 1)(x − 2).)"] },
  { l: 1, q: "Calcule a para que P(x) = x³ + (a − 1)x + 10 seja divisível por x − 5.", f: ["-26"],
    s: ["Divisível por x − 5 ⇔ P(5) = 0.", "P(5) = 125 + 5(a − 1) + 10 = 125 + 5a − 5 + 10 = 130 + 5a.", "130 + 5a = 0 ⇒ a = −26."] },
  { l: 1, q: "Determine a para que P(x) = 2x³ + 5x² − ax + 2 seja divisível por x − 2.", f: ["19"],
    s: ["Divisível por x − 2 ⇔ P(2) = 0.", "P(2) = 16 + 20 − 2a + 2 = 38 − 2a.", "38 − 2a = 0 ⇒ a = 19."] },
  { l: 1, q: "O resto da divisão de P(x) = x³ + ax² − x + a por x − 1 é 4. Calcule a.", f: ["2"],
    s: ["Resto = P(1) = 1 + a − 1 + a = 2a.", "2a = 4 ⇒ a = 2."] },
  { l: 1, q: "Calcule a para que o resto da divisão de P(x) = ax³ − 2x + 1 por x − 3 seja 4.", f: ["1/3"],
    s: ["Resto = P(3) = 27a − 6 + 1 = 27a − 5.", "27a − 5 = 4 ⇒ 27a = 9 ⇒ a = 1/3."] },
  { l: 1, q: "A divisão de P(x) por x² + 1 tem quociente x − 2 e resto 1. O polinômio P(x) é", o: ["x³ − 2x² + x − 1", "x³ − 2x² + x − 2", "x² + x + 1", "x³ − 2x² + x + 1"],
    ow: [null, "Esse é só D·Q; faltou somar o resto 1.", "O grau não bate: D tem grau 2 e Q grau 1, então P tem grau 3.", "(x² + 1)(x − 2) termina em −2; somando 1 dá −1, não +1."],
    s: ["P(x) = D(x)·Q(x) + R(x).", "(x² + 1)(x − 2) = x³ − 2x² + x − 2.", "Somando o resto 1: P(x) = x³ − 2x² + x − 1."] },
  { l: 1, q: "O resto da divisão de p(x) = x³ − 2x² + x − 1 por q(x) = x² − x + 1 é r(x). Quanto vale r(1)?", o: ["−1", "1", "0", "−2"],
    ow: [null, "r(x) = −x, então r(1) = −1: atenção ao sinal.", "q(x) não divide p(x): o resto é −x, não zero.", "Revise a última subtração: (−x² − 1) − (−x² + x − 1) = −x."],
    s: ["Método da chave: x³ ÷ x² = x, e x·(x² − x + 1) = x³ − x² + x.", "(x³ − 2x² + x − 1) − (x³ − x² + x) = −x² − 1.", "−x² ÷ x² = −1, e −1·(x² − x + 1) = −x² + x − 1.", "(−x² − 1) − (−x² + x − 1) = −x. O resto é r(x) = −x (grau menor que 2).", "r(1) = −1."] },
  { l: 1, q: "Dividindo p(x) por 2x − 1, obtém-se quociente x² − x e resto m. Se p(−1) = 0, quanto vale m?", f: ["6"],
    s: ["p(x) = (2x − 1)(x² − x) + m.", "p(−1) = (2·(−1) − 1)((−1)² − (−1)) + m = (−3)(2) + m = −6 + m.", "−6 + m = 0 ⇒ m = 6."] },
  { l: 1, q: "Qual é o resto da divisão de x⁵ − 2x⁴ + x² + 1 por 2x + 1?", f: ["35/32"],
    s: ["A raiz do divisor 2x + 1 é x = −1/2, e o resto é P(−1/2).", "(−1/2)⁵ = −1/32; −2·(−1/2)⁴ = −2/16 = −1/8; (−1/2)² = 1/4.", "P(−1/2) = −1/32 − 4/32 + 8/32 + 32/32 = 35/32 ≈ 1.09."] },
  { l: 1, q: "O resto da divisão de P(x) = xⁿ + aⁿ por Q(x) = x + a, sendo n par, é", o: ["2aⁿ", "0", "aⁿ", "−aⁿ"],
    ow: [null, "Daria 0 se n fosse ímpar, porque aí (−a)ⁿ = −aⁿ.", "Faltou somar os dois termos: (−a)ⁿ + aⁿ.", "Com n par, (−a)ⁿ é positivo e igual a aⁿ."],
    s: ["O resto da divisão por x + a é P(−a).", "P(−a) = (−a)ⁿ + aⁿ. Como n é par, (−a)ⁿ = aⁿ.", "Resto = aⁿ + aⁿ = 2aⁿ."] },
  { l: 1, q: "Use Briot-Ruffini para dividir x³ + 8 por x + 2. Digite os coeficientes do quociente e o resto.", f: ["1", "-2", "4", "0"], lab: ["coeficiente de x² =", "coeficiente de x =", "termo independente =", "resto ="],
    s: ["Complete os coeficientes com zeros: 1, 0, 0, 8. A raiz do divisor x + 2 é −2.", "Desce o 1.", "1·(−2) + 0 = −2.", "(−2)·(−2) + 0 = 4.", "4·(−2) + 8 = 0 → este é o resto.", "Quociente x² − 2x + 4, resto 0."] },
  { l: 1, q: "Na divisão de P(x) = x³ + x² − 10x + 8 por x − 1, obtém-se o quociente Q(x). Quais são as raízes de Q(x) = 0?", f: ["-4", "2"], set: true,
    s: ["Briot-Ruffini com a raiz 1 e coeficientes 1, 1, −10, 8.", "Desce 1; 1·1 + 1 = 2; 2·1 − 10 = −8; −8·1 + 8 = 0 (resto).", "Q(x) = x² + 2x − 8. Δ = 4 + 32 = 36.", "x = (−2 ± 6)/2 ⇒ x = 2 ou x = −4."] },
  { l: 1, q: "Determine o quociente e o resto da divisão de x³ + 2x² − 3x − 4 por 2x − 1.", f: ["1/2", "5/4", "-7/8", "-39/8"], lab: ["coeficiente de x² =", "coeficiente de x =", "termo independente =", "resto ="],
    s: ["2x − 1 = 2(x − 1/2). Faça Briot-Ruffini com a raiz 1/2 e depois divida o quociente por 2.", "Coeficientes 1, 2, −3, −4. Desce 1.", "1·(1/2) + 2 = 5/2.", "(5/2)·(1/2) − 3 = 5/4 − 3 = −7/4.", "(−7/4)·(1/2) − 4 = −7/8 − 4 = −39/8 → resto.", "Quociente de x − 1/2: x² + (5/2)x − 7/4. Dividindo por 2: (1/2)x² + (5/4)x − 7/8. O resto continua −39/8."] },
  { l: 1, q: "Divida P(x) = x⁴ − 3x³ + 4x² + x − 1 por D(x) = x² − 2x + 4. Escreva Q(x) = ax² + bx + c e R(x) = dx + e.", f: ["1", "-1", "-2", "1", "7"], lab: ["a =", "b =", "c =", "d =", "e ="],
    s: ["x⁴ ÷ x² = x². x²·D = x⁴ − 2x³ + 4x². Subtraindo: −x³ + 0x² + x − 1.", "−x³ ÷ x² = −x. −x·D = −x³ + 2x² − 4x. Subtraindo: −2x² + 5x − 1.", "−2x² ÷ x² = −2. −2·D = −2x² + 4x − 8. Subtraindo: x + 7.", "Q(x) = x² − x − 2 e R(x) = x + 7 (grau 1 < 2, a divisão para aqui)."] },
  { l: 1, q: "Se P(x) = x³ + ax² − bx + 8 é divisível por (x + 2)(x − 1), quanto valem a e b?", f: ["-3", "6"], lab: ["a =", "b ="],
    s: ["Divisível por (x + 2)(x − 1) ⇔ P(−2) = 0 e P(1) = 0.", "P(1) = 1 + a − b + 8 = 0 ⇒ a − b = −9.", "P(−2) = −8 + 4a + 2b + 8 = 0 ⇒ 4a + 2b = 0 ⇒ b = −2a.", "a + 2a = −9 ⇒ a = −3 e b = 6."] },
  { l: 1, q: "Calcule os valores reais de m para que o resto da divisão de P(x) = x³ + 3x² + 5x + m por x − m seja m³.", f: ["0", "-2"], set: true,
    s: ["Resto = P(m) = m³ + 3m² + 5m + m = m³ + 3m² + 6m.", "m³ + 3m² + 6m = m³ ⇒ 3m² + 6m = 0.", "3m(m + 2) = 0 ⇒ m = 0 ou m = −2."] },
  { l: 1, q: "Determine b e c para que P(x) = x⁴ + x² + bx + c seja divisível por x − 2 e deixe resto 4 na divisão por x + 2.", f: ["-1", "-18"], lab: ["b =", "c ="],
    s: ["P(2) = 16 + 4 + 2b + c = 0 ⇒ 2b + c = −20.", "P(−2) = 16 + 4 − 2b + c = 4 ⇒ −2b + c = −16.", "Somando: 2c = −36 ⇒ c = −18. Então 2b = −20 + 18 ⇒ b = −1."] },
  { l: 1, q: "Determine o polinômio do 2º grau P(x) = ax² + bx + c que deixa restos 4, 9 e 18 na divisão por x, x − 1 e x − 2.", f: ["2", "3", "4"], lab: ["a =", "b =", "c ="],
    s: ["Pelo teorema do resto: P(0) = 4, P(1) = 9 e P(2) = 18.", "P(0) = c = 4.", "P(1) = a + b + 4 = 9 ⇒ a + b = 5. P(2) = 4a + 2b + 4 = 18 ⇒ 2a + b = 7.", "Subtraindo: a = 2 e b = 3. P(x) = 2x² + 3x + 4."] },
  { l: 1, q: "Determine m e n de modo que P(x) = 2x⁴ − x³ + mx² − nx + 2 seja divisível por (x − 2)(x + 1).", f: ["-6", "1"], lab: ["m =", "n ="],
    s: ["P(2) = 32 − 8 + 4m − 2n + 2 = 26 + 4m − 2n = 0 ⇒ 2m − n = −13.", "P(−1) = 2 + 1 + m + n + 2 = 5 + m + n = 0 ⇒ m + n = −5.", "Somando: 3m = −18 ⇒ m = −6, e n = −5 − (−6) = 1."] },
  { l: 1, q: "O polinômio P(x) = x⁴ − 4x³ + mx² + 4x + n é divisível por (x − 1)(x − 2). Calcule 5m + 2n.", f: ["7"],
    s: ["P(1) = 1 − 4 + m + 4 + n = 0 ⇒ m + n = −1.", "P(2) = 16 − 32 + 4m + 8 + n = 0 ⇒ 4m + n = 8.", "Subtraindo: 3m = 9 ⇒ m = 3 e n = −4.", "5m + 2n = 15 − 8 = 7."] },
  { l: 1, q: "Dado P(x) = 4x⁴ − 5x² − 3bx + a, calcule a e b para que P(x) seja divisível por x² − 1.", f: ["1", "0"], lab: ["a =", "b ="],
    s: ["x² − 1 = (x − 1)(x + 1), então P(1) = 0 e P(−1) = 0.", "P(1) = 4 − 5 − 3b + a = 0 ⇒ a − 3b = 1.", "P(−1) = 4 − 5 + 3b + a = 0 ⇒ a + 3b = 1.", "Somando: 2a = 2 ⇒ a = 1, e então b = 0."] },
  { l: 1, q: "Determine o polinômio do 3º grau que se anula para x = 1 e que, dividido por x + 1, x − 2 e x + 2, deixa resto 6. Escreva P(x) = ax³ + bx² + cx + d.", f: ["1", "1", "-4", "2"], lab: ["a =", "b =", "c =", "d ="],
    s: ["Resto 6 nas três divisões ⇒ P(−1) = P(2) = P(−2) = 6. Então P(x) − 6 tem raízes −1, 2 e −2.", "P(x) − 6 = k(x + 1)(x − 2)(x + 2), ou seja, P(x) = k(x + 1)(x² − 4) + 6.", "P(1) = 0: k·2·(−3) + 6 = 0 ⇒ k = 1.", "P(x) = (x + 1)(x² − 4) + 6 = x³ + x² − 4x − 4 + 6 = x³ + x² − 4x + 2."] },
  { l: 1, q: "O polinômio P(x) = 2x³ − ax² + bx + 2 é divisível por 2x² + 5x − 2. Calcule a − b.", f: ["4"],
    s: ["O quociente tem grau 1 e começa com x (2x³ ÷ 2x² = x): P(x) = (2x² + 5x − 2)(x + k).", "Termo independente: −2·k = 2 ⇒ k = −1.", "(2x² + 5x − 2)(x − 1) = 2x³ − 2x² + 5x² − 5x − 2x + 2 = 2x³ + 3x² − 7x + 2.", "Comparando: −a = 3 ⇒ a = −3 e b = −7. Então a − b = −3 + 7 = 4.", "O gabarito da lista traz a = −7 e b = 7, mas a multiplicação acima mostra a = −3 e b = −7."] },
  { l: 1, q: "No polinômio P(x) de grau 3, o coeficiente de x³ é 2, e P(x) é divisível por x² − 5x + 6 e por x² − 4x + 4. O termo independente é", o: ["−24", "24", "−6", "0"],
    ow: [null, "O sinal: 2·(−2)²·(−3) = 2·4·(−3) = −24.", "−6 é o produto 2·(−3) sem o fator (−2)² = 4.", "0 só se 0 fosse raiz, e as raízes são 2 e 3."],
    s: ["x² − 5x + 6 = (x − 2)(x − 3) e x² − 4x + 4 = (x − 2)².", "Para ser divisível pelos dois, P precisa de (x − 2)² e de (x − 3). Com grau 3: P(x) = 2(x − 2)²(x − 3).", "Termo independente = P(0) = 2·(−2)²·(−3) = 2·4·(−3) = −24."] },

  /* ================= Nível 3 · Lista 3, primeira parte ================= */
  { l: 2, q: "Determine o número de raízes nulas do polinômio P(x) = −2x⁵ + 6x³ − 3x².", f: ["2"],
    s: ["O termo independente é 0, então zero é raiz.", "Coloque a menor potência em evidência: P(x) = x²(−2x³ + 6x − 3).", "O fator x² mostra que zero é raiz dupla: 2 raízes nulas (o menor expoente é 2)."] },
  { l: 2, q: "Qual é o grau de P(x) = 4x²(x² − 16)(x² + 9)³?", f: ["10"],
    s: ["O grau de um produto é a soma dos graus.", "x² tem grau 2; (x² − 16) tem grau 2; (x² + 9)³ tem grau 3·2 = 6.", "2 + 2 + 6 = 10."] },
  { l: 2, q: "Considerando (x − 2)²(x − 1)³(x² + 3x − 4) = 0, qual é a multiplicidade da raiz 1?", f: ["4"],
    s: ["Fatore x² + 3x − 4: raízes 1 e −4, então x² + 3x − 4 = (x − 1)(x + 4).", "A equação fica (x − 2)²(x − 1)³(x − 1)(x + 4) = (x − 2)²(x − 1)⁴(x + 4).", "O fator (x − 1) aparece 4 vezes: multiplicidade 4."] },
  { l: 2, q: "Qual é a multiplicidade da raiz −1 na equação x³ + x² − 3x − 3 = 0?", f: ["1"],
    s: ["Agrupe: x²(x + 1) − 3(x + 1) = (x + 1)(x² − 3).", "x² − 3 = 0 dá ±√3, que não é −1.", "(x + 1) aparece uma vez: −1 é raiz simples (multiplicidade 1)."] },
  { l: 2, q: "Resolva x³ − 7x² + 12x = 0.", f: ["0", "3", "4"], set: true,
    s: ["Coloque x em evidência: x(x² − 7x + 12) = 0.", "x = 0 ou x² − 7x + 12 = 0.", "x² − 7x + 12 = (x − 3)(x − 4) ⇒ x = 3 ou x = 4.", "S = {0, 3, 4}."] },
  { l: 2, q: "Resolva x³ − 4x² + 3x = 0.", f: ["0", "1", "3"], set: true,
    s: ["x(x² − 4x + 3) = 0.", "x² − 4x + 3 = (x − 1)(x − 3).", "S = {0, 1, 3}."] },
  { l: 2, q: "Resolva x³ + 3x² = x + 3.", f: ["-3", "1", "-1"], set: true,
    s: ["Passe tudo para um lado: x³ + 3x² − x − 3 = 0.", "Agrupe: x²(x + 3) − 1(x + 3) = (x + 3)(x² − 1).", "x + 3 = 0 ⇒ x = −3; x² − 1 = 0 ⇒ x = ±1.", "S = {−3, −1, 1}."] },
  { l: 2, q: "Resolva x³ + x² − 4x − 4 = 0.", f: ["-1", "2", "-2"], set: true,
    s: ["Agrupe: x²(x + 1) − 4(x + 1) = (x + 1)(x² − 4).", "x + 1 = 0 ⇒ x = −1; x² − 4 = 0 ⇒ x = ±2.", "S = {−1, −2, 2}."] },
  { l: 2, q: "Resolva x⁴ − 5x² + 4 = 0.", f: ["1", "-1", "2", "-2"], set: true,
    s: ["Equação biquadrada: troque y = x². Fica y² − 5y + 4 = 0.", "(y − 1)(y − 4) = 0 ⇒ y = 1 ou y = 4.", "x² = 1 ⇒ x = ±1; x² = 4 ⇒ x = ±2.", "S = {±1, ±2}."] },
  { l: 2, q: "Resolva x³ − 6x² + 10x = 0.", f: ["0", "3+i", "3-i"], set: true,
    s: ["x(x² − 6x + 10) = 0 ⇒ x = 0 ou x² − 6x + 10 = 0.", "Δ = 36 − 40 = −4, e √(−4) = 2i.", "x = (6 ± 2i)/2 = 3 ± i.", "S = {0, 3 + i, 3 − i}."] },
  { l: 2, q: "Resolva x³ + 2x² + 25x = −50.", f: ["-2", "5i", "-5i"], set: true,
    s: ["x³ + 2x² + 25x + 50 = 0.", "Agrupe: x²(x + 2) + 25(x + 2) = (x + 2)(x² + 25).", "x = −2 ou x² = −25 ⇒ x = ±5i.", "S = {−2, 5i, −5i}."] },
  { l: 2, q: "Determine a equação x³ + bx² + cx + d = 0 com S = {3, 5}, sendo 3 raiz de multiplicidade 2.", f: ["-11", "39", "-45"], lab: ["b =", "c =", "d ="],
    s: ["3 dupla e 5 simples: (x − 3)²(x − 5) = 0.", "(x − 3)² = x² − 6x + 9.", "(x² − 6x + 9)(x − 5) = x³ − 5x² − 6x² + 30x + 9x − 45 = x³ − 11x² + 39x − 45."] },
  { l: 2, q: "Determine as outras raízes de P(x) = x³ + 2x² − 5x − 6, sabendo que 2 é raiz.", f: ["-1", "-3"], set: true,
    s: ["Abaixe o grau com Briot-Ruffini usando a raiz 2 e os coeficientes 1, 2, −5, −6.", "Desce 1; 1·2 + 2 = 4; 4·2 − 5 = 3; 3·2 − 6 = 0 (resto zero, confirma a raiz).", "Quociente x² + 4x + 3 = (x + 1)(x + 3).", "Outras raízes: −1 e −3."] },
  { l: 2, q: "Sabendo que 2 é raiz da equação x³ + 2x² − 5x + c = 0, calcule c.", f: ["-6"],
    s: ["2 é raiz ⇒ P(2) = 0.", "8 + 8 − 10 + c = 0 ⇒ 6 + c = 0 ⇒ c = −6.", "Com c = −6 a equação é a mesma da questão anterior: raízes 2, −1 e −3."] },
  { l: 2, q: "Uma das raízes da equação 2x³ − 4x² − 2x + 4 = 0 é 1. Resolva a equação.", f: ["1", "-1", "2"], set: true,
    s: ["Briot-Ruffini com a raiz 1: coeficientes 2, −4, −2, 4 → 2, −2, −4, resto 0.", "Quociente 2x² − 2x − 4 = 2(x² − x − 2) = 2(x − 2)(x + 1).", "S = {1, −1, 2}."] },
  { l: 2, q: "Determine as raízes de P(x) = x⁴ − x³ − 2x² + 6x − 4, sabendo que 1 + i é uma delas. Digite as outras três.", f: ["1-i", "1", "-2"], set: true,
    s: ["Coeficientes reais ⇒ o conjugado 1 − i também é raiz.", "(x − (1 + i))(x − (1 − i)) = (x − 1)² − i² = x² − 2x + 2.", "Dividindo P(x) por x² − 2x + 2 obtém-se x² + x − 2.", "x² + x − 2 = (x + 2)(x − 1). Outras raízes: 1 − i, 1 e −2."] },
  { l: 2, q: "Resolva x³ − 2x² + 9x − 18 = 0, sabendo que uma raiz é da forma bi.", f: ["2", "3i", "-3i"], set: true,
    s: ["Agrupe: x²(x − 2) + 9(x − 2) = (x − 2)(x² + 9).", "x − 2 = 0 ⇒ x = 2. x² + 9 = 0 ⇒ x = ±3i (a raiz da forma bi é 3i).", "S = {2, 3i, −3i}."] },
  { l: 2, q: "Determine as raízes de x⁴ − x³ − 11x² = x + 12, sendo −i uma delas.", f: ["i", "-i", "4", "-3"], set: true,
    s: ["Escreva x⁴ − x³ − 11x² − x − 12 = 0.", "−i é raiz e os coeficientes são reais ⇒ i também é. (x − i)(x + i) = x² + 1.", "Dividindo por x² + 1: x⁴ − x³ − 11x² − x − 12 = (x² + 1)(x² − x − 12).", "x² − x − 12 = (x − 4)(x + 3). S = {i, −i, 4, −3}."] },
  { l: 2, q: "Uma das raízes da equação x⁴ − 9x³ + 30x² − 42x + 20 = 0 é 3 + i. Calcule as outras.", f: ["3-i", "1", "2"], set: true,
    s: ["Coeficientes reais ⇒ 3 − i também é raiz.", "(x − 3 − i)(x − 3 + i) = (x − 3)² − i² = x² − 6x + 10.", "Dividindo: x⁴ − 9x³ + 30x² − 42x + 20 = (x² − 6x + 10)(x² − 3x + 2).", "x² − 3x + 2 = (x − 1)(x − 2). Outras raízes: 3 − i, 1 e 2."] },
  { l: 2, q: "O polinômio P(x) tem coeficientes reais, é divisível por x² + 4 e P(1 − i) = 0. Qual é o menor grau que P(x) pode ter?", o: ["4", "2", "3", "5"],
    ow: [null, "x² + 4 sozinho já tem grau 2, e ainda faltam as raízes 1 ± i.", "As raízes complexas vêm em pares conjugados: não dá para ter grau ímpar só com elas.", "É possível com grau 4; não é preciso uma raiz a mais."],
    s: ["x² + 4 = 0 ⇒ x = ±2i: duas raízes.", "1 − i é raiz e os coeficientes são reais ⇒ 1 + i também é.", "No mínimo 4 raízes ⇒ grau mínimo 4: P(x) = (x² + 4)(x² − 2x + 2)."] },
  { l: 2, q: "Qual é o menor grau que pode ter uma equação algébrica de coeficientes reais com raízes 2, i e 1 + i?", o: ["5", "3", "4", "6"],
    ow: [null, "Esquece os conjugados: com coeficientes reais, −i e 1 − i também são raízes.", "Contou só um dos conjugados; são dois pares complexos mais o 2.", "Dá para ter grau 5; 6 teria uma raiz sobrando."],
    s: ["Coeficientes reais ⇒ raízes complexas vêm com o conjugado.", "i traz −i; 1 + i traz 1 − i; 2 é real e vem sozinho.", "Raízes: 2, i, −i, 1 + i, 1 − i ⇒ grau mínimo 5."] },
  { l: 2, q: "Entre os números abaixo, qual não pode ser raiz de P(x) = 3x⁴ + bx³ + cx² + dx − 4, com coeficientes inteiros?", o: ["3/4", "2/3", "4", "1"],
    ow: [null, "2/3: p = 2 divide 4 e q = 3 divide 3, então é candidata.", "4 = 4/1: p = 4 divide 4 e q = 1 divide 3, então é candidata.", "1 = 1/1: é candidata (1 divide 4 e 1 divide 3)."],
    s: ["Teorema das raízes racionais: se p/q (fração irredutível) é raiz, p divide a₀ = −4 e q divide aₙ = 3.", "p ∈ {±1, ±2, ±4} e q ∈ {1, 3}.", "Em 3/4, q = 4 não divide 3: não pode ser raiz."] },
  { l: 2, q: "Quais são as raízes inteiras do polinômio P(x) = x³ − x² − 4?", f: ["2"],
    s: ["Candidatas inteiras: divisores de −4: ±1, ±2, ±4.", "P(1) = −4; P(−1) = −6; P(2) = 8 − 4 − 4 = 0 ✓; P(−2) = −16; P(±4) ≠ 0.", "Dividindo por x − 2: x² + x + 2, com Δ = 1 − 8 < 0 (raízes não reais).", "Única raiz inteira: 2. Assim P(x) = (x − 2)(x² + x + 2)."] },
  { l: 2, q: "Determine as raízes do polinômio P(x) = 4x³ + 3x² − 25x + 6.", f: ["2", "1/4", "-3"], set: true,
    s: ["Candidatas p/q: p divide 6 e q divide 4.", "Testando x = 2: 32 + 12 − 50 + 6 = 0 ✓.", "Briot-Ruffini com 2: 4, 11, −3, resto 0. Quociente 4x² + 11x − 3.", "Δ = 121 + 48 = 169 ⇒ x = (−11 ± 13)/8 ⇒ x = 1/4 ou x = −3.", "S = {2, 1/4, −3}."] },
  { l: 2, q: "Determine as raízes do polinômio P(x) = 2x³ − x² − 2x + 1.", f: ["1/2", "1", "-1"], set: true,
    s: ["Agrupe: x²(2x − 1) − 1(2x − 1) = (2x − 1)(x² − 1).", "2x − 1 = 0 ⇒ x = 1/2; x² − 1 = 0 ⇒ x = ±1.", "S = {1/2, 1, −1}."] },
  { l: 2, q: "Resolva 2x³ − 7x² + 7x − 2 = 0.", f: ["1", "2", "1/2"], set: true,
    s: ["Soma dos coeficientes: 2 − 7 + 7 − 2 = 0 ⇒ x = 1 é raiz.", "Briot-Ruffini com 1: 2, −5, 2, resto 0. Quociente 2x² − 5x + 2.", "Δ = 25 − 16 = 9 ⇒ x = (5 ± 3)/4 ⇒ x = 2 ou x = 1/2.", "S = {1, 2, 1/2}."] },
  { l: 2, q: "Resolva x⁵ + 5x⁴ + 6x³ − 2x² − 7x − 3 = 0, sabendo que −1 é raiz tripla. Digite as outras duas raízes.", f: ["1", "-3"], set: true,
    s: ["Aplique Briot-Ruffini três vezes com a raiz −1.", "1ª: 1, 5, 6, −2, −7, −3 → 1, 4, 2, −4, −3, resto 0.", "2ª: 1, 4, 2, −4, −3 → 1, 3, −1, −3, resto 0.", "3ª: 1, 3, −1, −3 → 1, 2, −3, resto 0. Sobra x² + 2x − 3 = (x + 3)(x − 1).", "Outras raízes: 1 e −3."] },
  { l: 2, q: "O número 3 é raiz dupla de x⁴ − 7x³ + 13x² + 3x − 18 = 0. Determine as outras duas raízes.", f: ["-1", "2"], set: true,
    s: ["Briot-Ruffini com 3: 1, −7, 13, 3, −18 → 1, −4, 1, 6, resto 0.", "De novo com 3: 1, −4, 1, 6 → 1, −1, −2, resto 0.", "Sobra x² − x − 2 = (x − 2)(x + 1).", "Outras raízes: 2 e −1."] },
  { l: 2, q: "Os números 1 e −1 são raízes de multiplicidade 2 de P(x) = (x − 1)·q(x). Se P(x) tem grau 4 e coeficiente líder 1, então q(x) é", o: ["x³ + x² − x − 1", "x³ − 3x² + 3x − 1", "x³ + 3x² + 3x + 1", "x³ − 3x² + 3x + 1"],
    ow: [null, "Esse é (x − 1)³: daria 1 como raiz tripla e nenhum −1.", "Esse é (x + 1)³: daria −1 triplo em q, e P teria 1 só simples.", "Esse polinômio nem tem 1 ou −1 como raiz."],
    s: ["P(x) = (x − 1)²(x + 1)².", "Como P(x) = (x − 1)·q(x), q(x) = (x − 1)(x + 1)².", "(x + 1)² = x² + 2x + 1, e (x − 1)(x² + 2x + 1) = x³ + 2x² + x − x² − 2x − 1 = x³ + x² − x − 1."] },
  { l: 2, q: "Um polinômio p(x) de grau 3 é divisível por x + 2, deixa resto 3 na divisão por x − 1 e tem 0 como raiz de multiplicidade 2. p(x) é", o: ["x³ + 2x²", "2x³ + x²", "x³ + 2x", "3x³"],
    ow: [null, "2x³ + x² = x²(2x + 1): a raiz não nula é −1/2, não −2.", "x³ + 2x = x(x² + 2): zero é só raiz simples.", "3x³ tem zero como raiz tripla e não é divisível por x + 2."],
    s: ["0 raiz dupla e −2 raiz (divisível por x + 2) ⇒ p(x) = kx²(x + 2).", "Resto 3 na divisão por x − 1 ⇒ p(1) = k·1·3 = 3 ⇒ k = 1.", "p(x) = x²(x + 2) = x³ + 2x²."] },
  { l: 2, q: "Um polinômio de coeficientes reais tem termo independente nulo, é divisível por x² − 1 e tem 2 − i como raiz de multiplicidade 3. Seu grau n satisfaz", o: ["n ≥ 9", "n ≥ 6", "n ≥ 8", "n ≥ 5"],
    ow: [null, "Contou só 2 − i (3 vezes) e o 2 + i (3 vezes); faltaram 0, 1 e −1.", "Faltou uma das raízes: 0, 1 e −1 somam 3, e 2 ± i somam 6.", "Esqueceu que o conjugado 2 + i também tem multiplicidade 3."],
    s: ["Termo independente nulo ⇒ 0 é raiz (1 raiz).", "Divisível por x² − 1 ⇒ 1 e −1 são raízes (2 raízes).", "2 − i tripla e coeficientes reais ⇒ 2 + i também tripla (6 raízes).", "Total mínimo: 1 + 2 + 6 = 9 ⇒ n ≥ 9."] },

  /* ================= Nível 4 · Lista 3, segunda parte ================= */
  { l: 3, q: "Determine p de modo que a equação x³ − px² + 3x − 1 = 0 admita raiz tripla.", f: ["3"],
    s: ["Raiz tripla r: x³ − px² + 3x − 1 = (x − r)³.", "Girard: r·r·r = −(−1)/1 = 1 ⇒ r = 1.", "(x − 1)³ = x³ − 3x² + 3x − 1 ⇒ p = 3."] },
  { l: 3, q: "Os números 1 e 2 + i são raízes de x³ + ax² + bx − c = 0, com a, b e c reais. Calcule c.", f: ["5"],
    s: ["Coeficientes reais ⇒ 2 − i também é raiz. As raízes são 1, 2 + i e 2 − i.", "Girard: produto das raízes = −(termo independente)/1 = −(−c) = c.", "Produto: 1·(2 + i)(2 − i) = 1·(4 − i²) = 5 ⇒ c = 5."] },
  { l: 3, q: "Encontre a, b e c, sabendo que 2, 4 e −3 são raízes de x³ + ax² + bx + c = 0.", f: ["-3", "-10", "24"], lab: ["a =", "b =", "c ="],
    s: ["Girard (coeficiente líder 1): soma = −a; soma dos produtos dois a dois = b; produto = −c.", "Soma: 2 + 4 − 3 = 3 ⇒ a = −3.", "Produtos dois a dois: 2·4 + 2·(−3) + 4·(−3) = 8 − 6 − 12 = −10 ⇒ b = −10.", "Produto: 2·4·(−3) = −24 ⇒ c = 24."] },
  { l: 3, q: "A equação x³ + mx² + 2x + n = 0, com m e n reais, admite 1 + i como raiz. Calcule m e n.", f: ["-2", "0"], lab: ["m =", "n ="],
    s: ["Raízes: 1 + i, 1 − i (conjugada) e uma real r.", "Produtos dois a dois = 2: (1 + i)(1 − i) + r(1 + i) + r(1 − i) = 2 + 2r = 2 ⇒ r = 0.", "Soma = −m: (1 + i) + (1 − i) + 0 = 2 ⇒ m = −2.", "Produto = −n: 2·0 = 0 ⇒ n = 0."] },
  { l: 3, q: "Sabendo que 1 é raiz dupla de x³ + ax² − 2x + b = 0, determine a + b.", f: ["1"],
    s: ["Briot-Ruffini com 1: coeficientes 1, a, −2, b → 1, a + 1, a − 1, resto a + b − 1.", "1ª condição: a + b − 1 = 0 ⇒ a + b = 1.", "(De novo com 1: 1, a + 2, resto 2a + 1 = 0 ⇒ a = −1/2 e b = 3/2, o que confirma a + b = 1.)"] },
  { l: 3, q: "O número 2 é raiz dupla da equação ax³ + bx + 16 = 0. Calcule a e b.", f: ["1", "-12"], lab: ["a =", "b ="],
    s: ["Coeficientes a, 0, b, 16. Briot-Ruffini com 2: a, 2a, 4a + b, resto 8a + 2b + 16.", "De novo com 2 (sobre a, 2a, 4a + b): a, 4a, resto 12a + b.", "Os dois restos são zero: 8a + 2b + 16 = 0 e 12a + b = 0 ⇒ b = −12a.", "8a − 24a + 16 = 0 ⇒ a = 1 e b = −12."] },
  { l: 3, q: "Calcule m e n de modo que 2 seja raiz dupla da equação x³ + mx² − 8x + n = 0.", f: ["-1", "12"], lab: ["m =", "n ="],
    s: ["Raízes: 2, 2 e r.", "Girard, produtos dois a dois = −8: 2·2 + 2r + 2r = −8 ⇒ 4r = −12 ⇒ r = −3.", "Soma = −m: 2 + 2 − 3 = 1 ⇒ m = −1.", "Produto = −n: 2·2·(−3) = −12 ⇒ n = 12."] },
  { l: 3, q: "Resolva √(x + √(x − 1)) = √7.", f: ["5"],
    s: ["Elevando ao quadrado: x + √(x − 1) = 7 ⇒ √(x − 1) = 7 − x (exige 7 − x ≥ 0).", "De novo ao quadrado: x − 1 = 49 − 14x + x² ⇒ x² − 15x + 50 = 0.", "x = 5 ou x = 10. Teste: em x = 10, 7 − x = −3 < 0, não serve.", "x = 5: √(5 + 2) = √7 ✓. S = {5}."] },
  { l: 3, q: "Resolva x + √(3x − 11) = 7.", f: ["5"],
    s: ["Isole a raiz: √(3x − 11) = 7 − x (exige x ≤ 7).", "Ao quadrado: 3x − 11 = 49 − 14x + x² ⇒ x² − 17x + 60 = 0.", "x = 5 ou x = 12. x = 12 não serve (7 − 12 < 0).", "x = 5: 5 + √4 = 7 ✓. S = {5}."] },
  { l: 3, q: "Resolva x³ − 3x² − 4x + 12 = 0, sabendo que duas de suas raízes são simétricas.", f: ["2", "-2", "3"], set: true,
    s: ["Raízes r, −r e s. Girard: r + (−r) + s = 3 ⇒ s = 3.", "Briot-Ruffini com 3: 1, −3, −4, 12 → 1, 0, −4, resto 0. Quociente x² − 4.", "x² − 4 = 0 ⇒ x = ±2. S = {−2, 2, 3}."] },
  { l: 3, q: "Resolva x³ − 3x² − 6x + 8 = 0, sabendo que suas raízes estão em PA.", f: ["-2", "1", "4"], set: true,
    s: ["Raízes em PA: a − r, a, a + r. Soma 3a = 3 ⇒ a = 1 é raiz.", "Briot-Ruffini com 1: 1, −3, −6, 8 → 1, −2, −8, resto 0.", "x² − 2x − 8 = (x − 4)(x + 2).", "S = {−2, 1, 4} (PA de razão 3)."] },
  { l: 3, q: "Resolva x³ − 9x² + 23x − 15 = 0, sabendo que suas raízes estão em PA.", f: ["1", "3", "5"], set: true,
    s: ["Raízes a − r, a, a + r. Soma 3a = 9 ⇒ a = 3.", "Briot-Ruffini com 3: 1, −9, 23, −15 → 1, −6, 5, resto 0.", "x² − 6x + 5 = (x − 1)(x − 5).", "S = {1, 3, 5}."] },
  { l: 3, q: "Resolva x³ − 9x² + 24x − 20 = 0, sabendo que duas de suas raízes são iguais.", f: ["2", "5"], lab: ["raiz dupla =", "raiz simples ="],
    s: ["Raízes r, r e s. Girard: 2r + s = 9; r² + 2rs = 24; r²s = 20.", "De 2r + s = 9: s = 9 − 2r. Em r² + 2r(9 − 2r) = 24: −3r² + 18r − 24 = 0 ⇒ r² − 6r + 8 = 0 ⇒ r = 2 ou r = 4.", "r = 2 ⇒ s = 5 e r²s = 20 ✓. (r = 4 ⇒ s = 1 e r²s = 16 ✗.)", "S = {2, 5}, com 2 raiz dupla."] },
  { l: 3, q: "Resolva x³ − 10x² + 31x − 30 = 0, sabendo que uma das raízes é igual à diferença das outras duas.", f: ["2", "3", "5"], set: true,
    s: ["Raízes a, b, c com a = b − c, ou seja, a + c = b.", "Girard: a + b + c = 10 ⇒ b + b = 10 ⇒ b = 5.", "Briot-Ruffini com 5: 1, −10, 31, −30 → 1, −5, 6, resto 0.", "x² − 5x + 6 = (x − 2)(x − 3). S = {2, 3, 5} (e 2 = 5 − 3)."] },
  { l: 3, q: "Sendo a, b e c as raízes de x³ − 2x² + 3x − 4 = 0, calcule 1/a + 1/b + 1/c.", f: ["3/4"],
    s: ["Girard: a + b + c = 2; ab + ac + bc = 3; abc = 4.", "1/a + 1/b + 1/c = (bc + ac + ab)/(abc).", "= 3/4 = 0.75."] },
  { l: 3, q: "Sendo a, b e c as raízes de x³ − 4x² + 5x + 3 = 0, calcule a/(bc) + b/(ac) + c/(ab).", f: ["-2"],
    s: ["Girard: a + b + c = 4; ab + ac + bc = 5; abc = −3.", "Com denominador comum abc: a/(bc) + b/(ac) + c/(ab) = (a² + b² + c²)/(abc).", "a² + b² + c² = (a + b + c)² − 2(ab + ac + bc) = 16 − 10 = 6.", "6/(−3) = −2."] },
  { l: 3, q: "Sendo a, b e c as raízes de 2x³ − 30x² + 15x − 3 = 0, calcule log[1/(ab) + 1/(bc) + 1/(ac)].", f: ["1"],
    s: ["Girard (divida por 2): a + b + c = 30/2 = 15; abc = 3/2.", "1/(ab) + 1/(bc) + 1/(ac) = (c + a + b)/(abc) = 15 ÷ 3/2 = 10.", "log 10 = 1."] },
  { l: 3, q: "Sendo a, b e c as raízes de 2x³ − 3x² + 5x + 1 = 0, calcule E = a²b² + a²c² + b²c².", f: ["31/4"],
    s: ["Girard: a + b + c = 3/2; ab + ac + bc = 5/2; abc = −1/2.", "(ab + ac + bc)² = a²b² + a²c² + b²c² + 2abc(a + b + c).", "E = (5/2)² − 2·(−1/2)·(3/2) = 25/4 + 3/2 = 25/4 + 6/4 = 31/4 = 7.75."] },
  { l: 3, q: "Resolva 64x³ − 56x² + 14x − 1 = 0, sabendo que suas raízes estão em PG.", f: ["1/8", "1/4", "1/2"], set: true,
    s: ["Raízes em PG: a/q, a, aq. Produto = a³ = −(−1)/64 = 1/64 ⇒ a = 1/4.", "Briot-Ruffini com 1/4: 64, −56, 14, −1 → 64, −40, 4, resto 0.", "64x² − 40x + 4 = 0 ⇒ 16x² − 10x + 1 = 0 ⇒ x = (10 ± 6)/32.", "x = 1/2 ou x = 1/8. S = {1/8, 1/4, 1/2} (razão 2)."] },
  { l: 3, q: "As raízes da equação x³ − 6x² + kx + 64 = 0 estão em PG. Calcule k.", f: ["-24"],
    s: ["Raízes a/q, a, aq: produto a³ = −64 ⇒ a = −4 é raiz.", "P(−4) = −64 − 6·16 − 4k + 64 = −96 − 4k = 0.", "k = −24."] },
  { l: 3, q: "As raízes de x² + bx + 12 = 0 são, cada uma, 7 unidades maiores que as raízes de x² + βx + 12 = 0. Calcule β.", f: ["7"],
    s: ["Sejam r e s as raízes de x² + βx + 12: r + s = −β e rs = 12.", "As raízes da outra são r + 7 e s + 7, com produto 12: (r + 7)(s + 7) = rs + 7(r + s) + 49 = 12.", "12 + 7(r + s) + 49 = 12 ⇒ r + s = −7.", "β = −(r + s) = 7."] },
  { l: 3, q: "Dado f = | x  x  x ; x + 1  −2  x − 1 ; x  0  1 | (determinante 3×3, linhas separadas por ;), determine as raízes de f.", f: ["0", "√3", "-√3"], set: true,
    s: ["Pela 1ª linha: f = x·(−2·1 − (x − 1)·0) − x·((x + 1)·1 − (x − 1)·x) + x·((x + 1)·0 − (−2)·x).", "= −2x − x(x + 1 − x² + x) + 2x² = −2x − x(−x² + 2x + 1) + 2x².", "= −2x + x³ − 2x² − x + 2x² = x³ − 3x.", "x(x² − 3) = 0 ⇒ x = 0 ou x = ±√3."] },
  { l: 3, q: "Sabendo que −2 é raiz de f(x) = | x  −1  1 ; 1  x  0 ; 0  k  x |, com k real, determine k.", f: ["10"],
    s: ["Pela 1ª linha: f(x) = x·(x·x − 0·k) − (−1)·(1·x − 0·0) + 1·(1·k − x·0).", "f(x) = x³ + x + k.", "f(−2) = −8 − 2 + k = 0 ⇒ k = 10."] },
  { l: 3, q: "Com k = 10, f(x) = x³ + x + 10 tem −2 como raiz. Determine as demais raízes.", f: ["1+2i", "1-2i"], set: true,

const MQ = MAT_RAW.map((r, id) => ({ id, ...r }));

/* ---------- leitor de respostas ----------
 * Aceita ponto ou vírgula como separador decimal, frações (3/4), raízes (2√7, √2/2),
 * números complexos (2-3i, -i, 1/2i) e um "x =" no começo. Devolve { re, im } ou null. */
function matLerReal(t, vazioVale1) {
  if (t === "") return vazioVale1 ? 1 : null;
  const partes = t.split("/");
  if (partes.length > 2) return null;
  const vals = partes.map((p) => {
    const m = /^(\d*\.?\d*)(?:√(\d*\.?\d+))?$/.exec(p);
    if (!m || (!m[1] && m[2] == null)) return null;
    if (m[1] && !/\d/.test(m[1])) return null;
    const coef = m[1] ? Number(m[1]) : 1;
    return m[2] != null ? coef * Math.sqrt(Number(m[2])) : coef;
  });
  if (vals.includes(null)) return null;
  if (vals.length === 2) return vals[1] === 0 ? null : vals[0] / vals[1];
  return vals[0];
}
function matLer(bruto) {
  let s = String(bruto == null ? "" : bruto).toLowerCase()
    .replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".")
    .replace(/[°º]|graus?/g, "").replace(/sqrt|raiz/g, "√").replace(/[*·×]/g, "")
    .replace(/√\((\d*\.?\d+)\)/g, "√$1");
  s = s.replace(/^(?:\|z\||[a-zθρ][a-z0-9₀-₉]*)=/, "");
  if (!s) return null;
  const termos = s.match(/[+-]?[^+-]+/g);
  if (!termos || termos.join("") !== s) return null;
  let re = 0, im = 0;
  for (let t of termos) {
    let sinal = 1;
    if (t[0] === "+" || t[0] === "-") { if (t[0] === "-") sinal = -1; t = t.slice(1); }
    const nI = (t.match(/i/g) || []).length;
    if (nI > 1) return null;
    t = t.replace("i", "");
    const v = matLerReal(t, nI === 1);
    if (v == null || !Number.isFinite(v)) return null;
    if (nI) im += sinal * v; else re += sinal * v;
  }
  return { re, im };
}
const matPerto = (a, b) => Math.abs(a - b) <= 0.011 + 0.001 * Math.abs(b);
const matIgual = (a, b) => matPerto(a.re, b.re) && matPerto(a.im, b.im);
/* compara as respostas do jogador com as esperadas; em "set" a ordem não importa */
function matConfere(q, vals) {
  const dados = vals.map(matLer), certos = q.f.map(matLer);
  if (!q.set) return certos.every((c, i) => matIgual(dados[i], c));
  const usado = new Array(certos.length).fill(false);
  const tenta = (i) => {
    if (i === dados.length) return true;
    for (let j = 0; j < certos.length; j++) {
      if (!usado[j] && matIgual(dados[i], certos[j])) { usado[j] = true; if (tenta(i + 1)) return true; usado[j] = false; }
    }
    return false;
  };
  return tenta(0);
}

/* ---------- formatação ---------- */
const mfmt = (s) => esc(s).replace(/\^\{([^}]+)\}/g, "<sup>$1</sup>");
const matMostra = (s) => esc(String(s).replace(/(.)([+-])/g, "$1 $2 ").replace(/-/g, "−"));
const matSup = (n) => String(n).replace(/[0-9-]/g, (c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(c)] || "⁻");
function matNum(x) {
  if (!Number.isFinite(x)) return "∞";
  if (x >= 1e6) { const [m, e] = x.toExponential(2).split("e"); return `${m.replace(/\.?0+$/, "")} × 10${matSup(+e)}`; }
  const [int, dec] = String(Math.round(x * 100) / 100).split(".");
  const g = int.length > 4 ? int.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : int;
  return dec ? `${g}.${dec}` : g;
}
const matExpoTxt = (k) => String(Math.round(matExpo(k) * 1000) / 1000);
const matFormula = (k) => `${matForca(k).toFixed(1).replace(/\.0$/, "")}<sup>${matExpoTxt(k)}</sup>`;

/* ---------- recordes da DLC (por conta, neste aparelho) ---------- */
const MAT_KEY = "masmorra-dlc-polinomios";
function matRecordes() {
  try { const d = JSON.parse(localStorage.getItem(MAT_KEY)); return (d && d[USER.name.toLowerCase()]) || {}; } catch (e) { return {}; }
}
function matSalvaRecorde(lvl, r) {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(MAT_KEY)) || {}; } catch (e) { d = {}; }
  const k = USER.name.toLowerCase();
  const meu = d[k] || {}, ant = meu[lvl] || { best: 0, ko: false, combo: 0 };
  const novo = r.score > ant.best;
  meu[lvl] = { best: Math.max(ant.best, r.score), ko: ant.ko || r.ko, combo: Math.max(ant.combo, r.combo) };
  d[k] = meu;
  try { localStorage.setItem(MAT_KEY, JSON.stringify(d)); } catch (e) { /* sem armazenamento: o recorde só vale nesta sessão */ }
  return novo;
}

/* ---------- regras ---------- */
function matComecar(lvl) {
  const ids = MQ.filter((q) => q.l === lvl).map((q) => q.id); /* ordem fixa: da mais fácil para a mais difícil */
  S = { screen: "mat-ring", m: { lvl, hp: MAT_HP, k: 0, combo: 0, score: 0, hits: 0, tries: 0, log: [], ko: false, continuar: false, deck: ids, total: ids.length, cur: null } };
  matSacar();
  render();
}
function matSacar() {
  const m = S.m, id = m.deck.shift();
  m.cur = { id, n: m.total - m.deck.length, vals: [], err: "", done: false, order: MQ[id].o ? shuffle(MQ[id].o.map((_, i) => i)) : null };
  fx.modal = true;
}
async function matResponder(escolha) {
  const m = S.m, c = m.cur, q = MQ[c.id];
  if (!c || c.done || busy) return;
  let ok;
  if (q.o) {
    c.chosen = escolha;
    ok = c.order[escolha] === 0;
  } else {
    c.vals = escolha;
    if (escolha.some((v) => !String(v).trim())) { c.err = q.f.length > 1 ? "Preencha todos os campos." : "Digite uma resposta."; c.errAt = escolha.findIndex((v) => !String(v).trim()); render(); return; }
    const ruim = escolha.findIndex((v) => !matLer(v));
    if (ruim >= 0) { c.err = `Não entendi “${escolha[ruim]}”. Escreva números como 1.5, 3/4, -2, 2√7 ou 1+2i.`; c.errAt = ruim; render(); return; }
    ok = matConfere(q, escolha);
  }
  c.err = ""; c.done = true; c.ok = ok;
  m.tries++;
  const antes = m.hp, jaCaiu = m.ko;
  c.hpAntes = antes;
  if (ok) {
    m.k++; m.hits++;
    c.k = m.k;
    c.dmg = jaCaiu ? 0 : matGolpe(m.k);
    m.hp = Math.max(0, m.hp - c.dmg);
    c.pts = 10 * m.k * (m.lvl + 1) + Math.round(Math.min(c.dmg, antes));
    if (!jaCaiu && m.hp <= 0) { m.ko = true; c.bonus = 250 * (m.lvl + 1); c.pts += c.bonus; }
    m.score += c.pts;
    m.combo = Math.max(m.combo, m.k);
  } else {
    c.lost = m.k;
    m.k = 0;
  }
  m.log.push({ id: c.id, ok, given: q.o ? q.o[c.order[escolha]] : escolha.slice() });
  busy = true;
  render();
  try { await (jaCaiu ? wait(150) : ok ? matSoco(c, antes) : matErro(c)); } finally { busy = false; }
  $app.querySelectorAll("[data-act='mat-next'], [data-act='mat-cont']").forEach((b) => { b.disabled = false; });
  const nb = document.getElementById("matNext");
  if (nb) nb.focus({ preventScroll: true });
}
function matProxima() {
  const m = S.m;
  if (busy || !m.cur || !m.cur.done) return;
  if (!m.deck.length || (m.ko && !m.continuar)) {
    m.newBest = matSalvaRecorde(m.lvl, { score: m.score, ko: m.ko, combo: m.combo });
    S.screen = "mat-end";
  } else matSacar();
  render();
}
function matContinuar() {
  if (busy || !S.m.cur || !S.m.cur.done) return;
  S.m.continuar = true;
  matProxima();
}

    if (acum >= MAT_HP) koEm = k;
    if ([1, 2, 5, 10, 15, 18, 19].includes(k) || koEm) {
      linhas.push(`<tr><td class="num">${k}º</td><td class="num">${matFormula(k)}</td><td class="num">${matNum(d)}</td><td class="num">${koEm ? `${matNum(acum)} <b>nocaute</b>` : matNum(acum)}</td></tr>`);
    }
  }
  return `
  <section class="title">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> Masmorra do Deploy</span>
    <h1>Ringue da <span>Matemática</span></h1>
    <p class="lead">Polinômios em quatro níveis, baseados nas Listas 1, 2 e 3. Um boneco de palha com ${MAT_HP} de vida, pendurado como saco de pancadas: cada resposta certa é um soco. Não tem relógio, e toda pergunta, certa ou errada, mostra a resolução completa.</p>
  </section>
  <section class="mat-rules">
    <div class="panel">
      <h3>Sequência é tudo</h3>
      <p class="muted">Todo golpe começa em 1. O expoente começa em 1.001 e, a cada acerto seguido, soma 1/10 dele mesmo. A força do soco sobe 0.1 por golpe. Errar devolve você ao golpe 1.</p>
      <table class="golpes"><thead><tr><th>Golpe</th><th>Conta</th><th>Dano</th><th>Total</th></tr></thead><tbody>${linhas.join("")}</tbody></table>
      <p class="muted">Com ${koEm} acertos seguidos o boneco cai. Sequências menores também tiram vida, só que bem menos.</p>
    </div>
    <div class="panel">
      <h3>Como responder</h3>
      <p class="muted">As perguntas seguem a ordem da lista, da mais fácil para a mais difícil. Algumas são de marcar; a maioria pede a conta e a resposta digitada. Use <b>ponto</b> no lugar da vírgula decimal.</p>
      <ul class="exemplos">
        <li><code>0.5</code> ou <code>1/2</code>, <code>-10/3</code></li>
        <li><code>2√3</code>, <code>-1+√3</code></li>
        <li><code>3-i</code>, <code>2i</code>, <code>-1/2+√3/2i</code></li>
      </ul>
      <p class="muted">Pontos por acerto: 10 × golpe × nível, mais o dano causado. O nocaute dá bônus. Depois do nocaute você pode continuar estudando as perguntas que faltam.</p>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:24px">Escolha o nível</h2>
    <div class="mat-levels">
      ${MAT_NIVEIS.map((n, i) => {
        const r = rec[i], qt = MQ.filter((q) => q.l === i).length;
        return `
        <button class="card mat-card" style="--dom:${n.cor}" data-act="mat-go" data-v="${i}">
          <span class="band"><span>${esc(n.fonte)}</span><span>${qt} perguntas</span></span>
          <span class="skill">${n.nome}</span>
          <span class="desc"><b>${esc(n.tema)}.</b> ${esc(n.txt)}</span>
          <span class="tags">${r ? `<span class="tag">${r.ko ? "Nocaute ✓" : "Sem nocaute"}</span><span class="tag">Recorde ${r.best}</span><span class="tag">Maior sequência ${r.combo}</span>` : `<span class="tag">Ainda não jogado</span>`}</span>
        </button>`;
      }).join("")}
    </div>
  </section>
  <div class="row"><button class="btn ghost" data-act="home">Voltar à masmorra</button></div>`;
}

function vMatIntro() {
  const i = S.lvl, n = MAT_NIVEIS[i], qt = MQ.filter((q) => q.l === i).length;
  return `
  <section class="title">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> ${esc(n.fonte)}</span>
    <h1>${n.nome}: <span>${esc(n.tema)}</span></h1>
    <p class="lead">${esc(n.txt)} São ${qt} perguntas, da mais fácil para a mais difícil.</p>
  </section>
  <section class="panel resumo" style="--dom:${n.cor}">
    <h2>Resumo da matéria</h2>
    <ul>${n.resumo.map((t) => `<li>${mfmt(t)}</li>`).join("")}</ul>
  </section>
  <div class="row">
    <button class="btn" data-act="mat-start" data-v="${i}">Começar o ${n.nome}</button>
    <button class="btn ghost" data-act="mat-home">Voltar</button>
  </div>`;
}

function vMatCombo(m) {
  const prox = m.k + 1;
  if (m.ko) return `
  <div class="combo hot">
    <div><span class="eyebrow">Sequência</span><b class="num">×${m.k}</b></div>
    <div><span class="eyebrow">Boneco</span><b class="num">Nocaute</b><span class="muted">${m.continuar ? "Modo estudo: sem dano" : ""}</span></div>
  </div>`;
  return `
  <div class="combo${m.k ? " hot" : ""}">
    <div><span class="eyebrow">Sequência</span><b class="num">×${m.k}</b></div>
    <div><span class="eyebrow">Próximo golpe</span><b class="num">${matFormula(prox)}</b><span class="muted num">= ${matNum(matGolpe(prox))} de dano</span></div>
  </div>`;
}

function vMatRing() {
  const m = S.m, n = MAT_NIVEIS[m.lvl], c = m.cur, q = MQ[c.id];
  const letters = "ABCD";
  const hpVis = c.done && busy && c.hpAntes != null ? c.hpAntes : m.hp;
  const corpo = q.o
    ? `<div class="opts">${c.order.map((oi, k) => {
        let cls = "opt";
        if (c.done && oi === 0) cls += " right";
        if (c.done && k === c.chosen && oi !== 0) cls += " wrong";
        return `<button class="${cls}" data-act="mat-mc" data-v="${k}" ${c.done ? "disabled" : ""}><span class="l">${letters[k]}</span><span>${mfmt(q.o[oi])}</span></button>`;
      }).join("")}</div>`
    : `<form class="mat-form" id="matForm" autocomplete="off" novalidate>
        <div class="ans-grid">
          ${q.f.map((_, i) => {
            const rot = q.lab ? q.lab[i] : q.f.length > 1 ? `${i + 1}ª raiz` : "Resposta";
            return `<label class="ans${c.errAt === i && c.err ? " bad" : ""}"><span>${esc(rot)}</span>
              <input name="r${i}" inputmode="text" spellcheck="false" autocapitalize="none" enterkeyhint="${i === q.f.length - 1 ? "done" : "next"}" value="${esc(c.vals[i] || "")}" ${c.done ? "disabled" : ""} placeholder="${i === 0 ? "ex.: 1.5 · 3/4 · 2√3" : ""}"></label>`;
          }).join("")}
        </div>
        ${q.set ? `<p class="set-note">Em qualquer ordem.</p>` : ""}
        ${c.done ? "" : `
        <div class="keys" aria-label="Símbolos">
          ${["i", "√", "/", "−", "."].map((s) => `<button type="button" class="key" data-act="mat-key" data-v="${s === "−" ? "-" : s}">${s}</button>`).join("")}
        </div>
        <p class="err" role="alert">${esc(c.err || "")}</p>
        <button class="btn punch" type="submit">Socar</button>`}
      </form>`;
  const ultimo = m.log[m.log.length - 1];
  const fim = !m.deck.length, acabouDeCair = m.ko && !m.continuar;
  const titulo = c.ok
    ? (c.dmg ? `Certo! Golpe ${c.k}: ${matNum(c.dmg)} de dano · +${c.pts} pontos` : `Certo! Sequência ×${c.k} · +${c.pts} pontos`)
    : c.lost ? `Errou · a sequência de ${c.lost} acabou` : "Errou";
  return `
  <header class="hud">
    <div class="lvl"><span class="eyebrow"><span class="dlc-tag">DLC</span> ${esc(n.fonte)} · ${esc(n.tema)}</span><h2>${n.nome}</h2></div>
    <div class="wallet"><span><b>${m.score}</b> pontos</span><span>Acertos ${m.hits}/${m.tries}</span><span>Maior sequência ${m.combo}</span></div>
  </header>
  <section class="ring" style="--dom:${n.cor}">
    <div class="panel ring-side">
      <div class="ringbox"><div class="bag${m.ko && !(busy && c.bonus) ? " down" : ""}">${MAT_SACO}</div></div>
      <div class="ring-info">
        <div class="row between"><span class="eyebrow">Boneco de palha</span><span class="mat-hpnum hpnum">${matNum(hpVis)} / ${MAT_HP}</span></div>
        <div class="bar mat-hp" role="progressbar" aria-label="Vida do boneco" aria-valuemin="0" aria-valuemax="${MAT_HP}" aria-valuenow="${Math.round(m.hp)}"><i style="width:${(hpVis / MAT_HP) * 100}%"></i></div>
        ${vMatCombo(m)}
      </div>
    </div>
    <div class="qbox mat-q${fx.modal ? " enter" : ""}" style="--dom:${n.cor}">
      <div class="band"><span>Pergunta ${c.n} de ${m.total}</span><span>${q.o ? "Marque" : "Calcule e digite"}</span></div>
      <div class="qbody">
        <h2 id="mqt">${mfmt(q.q)}</h2>
        ${corpo}
        ${c.done ? `
        <div class="feedback ${c.ok ? "ok" : "bad"}">
          <strong>${titulo}</strong>
          ${c.ok && c.bonus ? `<p><b>Nocaute!</b> Bônus de ${c.bonus} pontos.</p>` : ""}
          ${matEstudo(q, c.ok, ultimo.given)}
        </div>
        <div class="row mat-acoes">
          ${acabouDeCair && !fim ? `<button class="btn ghost" data-act="mat-cont" ${busy ? "disabled" : ""}>Continuar estudando (${m.deck.length} restantes)</button>` : ""}
          <button class="btn" data-act="mat-next" id="matNext" ${busy ? "disabled" : ""}>${fim || acabouDeCair ? "Ver resultado" : "Próxima pergunta"}</button>
        </div>` : ""}
      </div>
    </div>
  </section>
  <div class="row"><button class="btn ghost small" data-act="mat-home">Sair do ringue</button></div>`;
}

function vMatEnd() {
  const m = S.m, n = MAT_NIVEIS[m.lvl], rec = matRecordes()[m.lvl] || {};
  const pct = m.tries ? Math.round((m.hits / m.tries) * 100) : 0;
  const erros = m.log.filter((x) => !x.ok).length;
  return `
  <section class="title end">
    <span class="eyebrow"><span class="dlc-tag">DLC</span> ${n.nome} · ${esc(n.tema)}</span>
    <h1>${m.ko ? "Nocaute!" : "O boneco aguentou"}</h1>
    <p class="lead">${m.ko
      ? `O boneco de palha caiu. Você respondeu ${m.tries} de ${m.total} perguntas, com maior sequência de ${m.combo} acertos.`
      : `As perguntas do nível acabaram com o boneco em ${matNum(m.hp)} de vida. Sequências longas batem muito mais forte: tente de novo.`}</p>
    <p class="wallet"><span>Pontuação <b>${m.score}</b></span><span>${m.newBest ? "Novo recorde neste nível!" : `Recorde do nível: ${rec.best || m.score}`}</span></p>
    <div class="row">
      <button class="btn" data-act="mat-start" data-v="${m.lvl}">Tentar de novo</button>
      ${m.lvl < MAT_NIVEIS.length - 1 ? `<button class="btn ghost" data-act="mat-go" data-v="${m.lvl + 1}">Ir para o ${MAT_NIVEIS[m.lvl + 1].nome}</button>` : ""}
      <button class="btn ghost" data-act="mat-home">Outros níveis</button>
    </div>
  </section>
  <section class="stats">
    <div class="panel stat"><span class="eyebrow">Acertos</span><span class="big">${m.hits}/${m.tries}</span><div class="bar"><i style="width:${pct}%;background:var(--ok)"></i></div><span class="hpnum">${pct}% de acerto</span></div>
    <div class="panel stat"><span class="eyebrow">Maior sequência</span><span class="big">×${m.combo}</span><span class="hpnum">Golpe mais forte: ${matNum(m.combo ? matGolpe(m.combo) : 0)}</span></div>
    <div class="panel stat"><span class="eyebrow">Vida do boneco</span><span class="big">${matNum(m.hp)}</span><div class="bar"><i style="width:${(m.hp / MAT_HP) * 100}%"></i></div><span class="hpnum">de ${MAT_HP}</span></div>
  </section>
  <section class="review">
    <h2 style="font-size:24px">Revisão completa</h2>
    <p class="muted">Todas as ${m.tries} perguntas respondidas, na ordem do nível, com a resolução passo a passo. ${erros ? `${erros === 1 ? "O erro aparece aberto" : `Os ${erros} erros aparecem abertos`}; toque num acerto para revisar também.` : "Você não errou nenhuma: toque em qualquer pergunta para revisar a resolução."}</p>
    ${m.log.map((x, i) => {
      const q = MQ[x.id];
      return `<details class="panel rev ${x.ok ? "rev-ok" : "rev-bad"}" ${x.ok ? "" : "open"}>
        <summary><span class="marca">${x.ok ? "✓" : "✗"}</span><span><span class="eyebrow">Pergunta ${i + 1} · ${x.ok ? "acertou" : "errou"}</span>${mfmt(q.q)}</span></summary>
        <div class="rev-corpo">${matEstudo(q, x.ok, x.given)}</div>
      </details>`;
    }).join("")}
    ${m.deck.length ? `
    <h3 style="font-size:20px;margin-top:8px">Perguntas que ficaram sem resposta (${m.deck.length})</h3>
    <p class="muted">O nocaute encerrou o nível antes delas. A resolução também está aqui para você estudar.</p>
    ${m.deck.map((id, i) => {
      const q = MQ[id];
      return `<details class="panel rev">
        <summary><span class="marca">·</span><span><span class="eyebrow">Pergunta ${m.tries + i + 1} · não respondida</span>${mfmt(q.q)}</span></summary>
        <div class="rev-corpo"><p class="linha-resp">Resposta: <b class="certo">${matCerta(q)}</b></p>${q.o ? matAlternativas(q, null) : ""}${matPassos(q)}</div>
      </details>`;
    }).join("")}` : ""}
  </section>`;
}

function matTecla(sim) {
  const form = document.getElementById("matForm");
  if (!form) return;
  const alvo = (matUltimoCampo && form.contains(matUltimoCampo)) ? matUltimoCampo : form.querySelector("input");
  if (!alvo) return;
  const a = alvo.selectionStart ?? alvo.value.length, b = alvo.selectionEnd ?? alvo.value.length;
  alvo.value = alvo.value.slice(0, a) + sim + alvo.value.slice(b);
  alvo.focus();
  alvo.setSelectionRange(a + sim.length, a + sim.length);
}
let matUltimoCampo = null;
document.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches("#matForm input")) matUltimoCampo = e.target; });

/* ================= render ================= */
function render() {
  if (!USER && S.screen !== "login") S = { screen: "login" };
  const views = { login: vLogin, start: vStart, intro: vIntro, battle: vBattle, clear: vClear, shop: vShop, end: vEnd, "mat-home": vMatHome, "mat-intro": vMatIntro, "mat-ring": vMatRing, "mat-end": vMatEnd };
  const prevScreen = $app.dataset.screen;
  $app.innerHTML = (views[S.screen] || vStart)();
  $app.dataset.screen = S.screen;
  $modal.innerHTML = S.screen === "battle" && S.cur ? vQuestion() : "";
  drawSprites($app);
  fx = { cards: new Set(), modal: false };
  if (S.screen !== "shop") toast = "";
  if (prevScreen !== S.screen) window.scrollTo(0, 0);
  const focus = $modal.querySelector("#nextBtn") || $modal.querySelector(".opt:not(:disabled)");
  if (focus) focus.focus({ preventScroll: true });
  if (S.screen === "login" && !authUI.busy) {
    const u = $app.querySelector("#f-user"), pw = $app.querySelector("#f-pass");
    (u && !u.value ? u : pw)?.focus({ preventScroll: true });
  }
  if (S.screen === "end" && !S.saved) saveGame();
  if (S.screen === "mat-ring" && S.m.cur) {
    const c = S.m.cur;
    const alvo = c.done ? $app.querySelector("#matNext:not(:disabled)")
      : $app.querySelector(c.err && c.errAt != null ? `#matForm input[name="r${c.errAt}"]` : "#matForm input") || $app.querySelector(".mat-q .opt");
    if (alvo) alvo.focus({ preventScroll: true });
    fx.modal = false;
  }
}

/* relógio das perguntas */
setInterval(() => {
  const c = S.cur;
  if (S.screen !== "battle" || !c || c.chosen != null || !c.deadline) return;
  const rem = timeLeft(c);
  const bar = document.querySelector("#tbar"), num = document.querySelector("#tnum");
  if (bar) { bar.firstElementChild.style.width = (rem / (lvl().tempo * 1000)) * 100 + "%"; bar.classList.toggle("low", rem < 10000); }
  if (num) num.textContent = Math.ceil(rem / 1000);
  if (rem <= 0) answer(-1);
}, 200);

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "cls": newGame(v); break;
    case "enter": enterChapter(); break;
    case "play": play(+v); break;
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "so": useSO(); break;
    case "pato": usePato(); break;
    case "hotfix": useHotfix(); break;
    case "shop": S.screen = "shop"; render(); break;
    case "buy": buy(v); break;
    case "promote": promote(); break;
    case "again": newGame(S.cls); break;
    case "home": S = { screen: "start" }; render(); break;
    case "logout": logout(); break;
    case "mat-home": S = { screen: "mat-home" }; render(); break;
    case "mat-go": S = { screen: "mat-intro", lvl: +v }; render(); break;
    case "mat-start": matComecar(+v); break;
    case "mat-cont": matContinuar(); break;
    case "mat-mc": matResponder(+v); break;
    case "mat-next": matProxima(); break;
    case "mat-key": matTecla(v); break;
    case "tab": {
      const u = $app.querySelector("#f-user");
      if (u) authUI.name = u.value;
      authUI.tab = v; authUI.error = ""; render(); break;
    }
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "authForm") { e.preventDefault(); submitAuth(e.target); }
  if (e.target.id === "matForm") { e.preventDefault(); matResponder([...e.target.querySelectorAll("input")].map((x) => x.value)); }
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || busy || S.screen === "login") return;
  const k = e.key.toLowerCase();
  if (S.screen === "mat-ring") {
    const c = S.m.cur;
    if (c && !c.done && MQ[c.id].o && !e.target.matches("input")) {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0) { e.preventDefault(); matResponder(idx); }
    }
    return;
  }
  if (S.screen === "battle" && S.cur) {
    if (S.cur.chosen == null) {
      const idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
      if (idx >= 0) { e.preventDefault(); answer(idx); }
    } else if (k === "enter" || k === " ") { e.preventDefault(); next(); }
  } else if (S.screen === "battle") {
    const idx = "123".indexOf(k);
    if (idx >= 0) { e.preventDefault(); play(idx); }
  }
});

/* ================= boot ================= */
async function start(data) {
  try { USER = (await Auth.current()).user || null; } catch (e) { USER = null; }
  if (USER) await refreshRanking();
  if (USER && data && data.state && data.state.screen && data.state.screen !== "login") {
    S = data.state;
    if (S.pending) resolvePending();
    if (S.cur && S.cur.deadline && S.cur.chosen == null) S.cur.deadline = Date.now() + lvl().tempo * 1000;
  } else {
    S = { screen: USER ? "start" : "login" };
  }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ state: S })); } catch (e) { /* fora do viewer */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
