<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masmorra do Deploy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sala de servidores à noite; cartas de mesa em papel com faixa colorida por área; HUD em painéis de rack. */
:root {
  color-scheme: dark;
  --bg: #0e131b;
  --bg-grid: #151c27;
  --panel: #171f2b;
  --panel-2: #1d2735;
  --line: #2a3648;
  --fg: #eef1f5;
  --muted: #a3afc0;
  --paper: #f1e9d6;
  --paper-2: #f9f4e8;
  --paper-ink: #221d13;
  --paper-muted: #675c48;
  --paper-edge: #b3a68a;
  --infra: #5ab6c8;
  --dev: #ef7d63;
  --redes: #e8b84a;
  --gold: #f0c75e;
  --ok: #6fcb8f;
  --bad: #e65a66;
  --shield: #8fb8ff;
  --led-off: #2b3340;
  --f-display: "Rubik", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--fg);
  font: 400 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .9em; background: rgba(127,140,160,.18); padding: 1px 6px; border-radius: 5px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.muted { color: var(--muted); }
.btn {
  border: 0; border-radius: 10px; padding: 12px 22px;
  background: var(--paper); color: var(--paper-ink);
  font-family: var(--f-display); font-size: 17px; font-weight: 700;
  box-shadow: 0 4px 0 var(--paper-edge);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-edge); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

/* domínios */
.d-infra { --dom: var(--infra); }
.d-dev { --dom: var(--dev); }
.d-redes { --dom: var(--redes); }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--f-display); font-size: 13px; font-weight: 600;
  padding: 3px 11px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--dom, var(--line)); color: var(--dom, var(--muted));
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--dom, var(--muted)); }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* título */
.title { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.title h1 { font-size: clamp(42px, 9vw, 78px); font-weight: 800; letter-spacing: -.025em; line-height: 1.02; }
.title h1 span { color: var(--gold); }
.title .lead { color: var(--muted); max-width: 62ch; font-size: 17px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rules .panel { display: flex; flex-direction: column; gap: 6px; }
.rules h3 { font-size: 18px; }
.rules p { color: var(--muted); font-size: 15px; }

/* cartas */
.hand, .classes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card {
  position: relative; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 200px; padding: 0 0 14px;
  background: var(--paper); color: var(--paper-ink);
  border: 0; border-radius: 14px; overflow: hidden;
  box-shadow: 0 6px 0 var(--paper-edge), 0 14px 30px rgba(0,0,0,.35);
  transition: transform .15s ease, box-shadow .15s ease;
}
.card.deal, .classes .card { animation: deal .4s cubic-bezier(.2,.8,.3,1.2) both; }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(-.6deg); }
.card .band {
  background: var(--dom); color: #17130b;
  font-family: var(--f-display); font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 8px 14px; display: flex; justify-content: space-between; gap: 8px;
}
.card .skill { font-family: var(--f-display); font-size: clamp(17px, 2.4vw, 22px); font-weight: 700; padding: 0 14px; line-height: 1.2; overflow-wrap: anywhere; }
.card .desc { padding: 0 14px; font-size: 14px; color: var(--paper-muted); line-height: 1.45; }
.card .power { margin-top: auto; padding: 0 14px; display: flex; align-items: baseline; gap: 6px; font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--paper-muted); }
.card .power b { font-size: 38px; font-weight: 800; color: var(--paper-ink); line-height: 1; }
.card .tags { padding: 0 14px; display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; }
.card .tag { font-family: var(--f-display); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: #17130b; color: var(--paper); }
.card .tag.weak { background: var(--bad); color: #fff; }
.card .key { position: absolute; right: 12px; bottom: 12px; font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--paper-muted); border: 1px solid #c9bda3; border-radius: 5px; padding: 0 6px; }
@keyframes deal { from { transform: translateY(30px) rotate(4deg) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

/* HUD */
.hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud .lvl { display: flex; flex-direction: column; gap: 2px; }
.hud h2 { font-size: 28px; }
.wallet { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.wallet span { color: var(--muted); font-size: 14px; }
.wallet b { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }

.arena { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
.boss { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; position: relative; }
.boss canvas, .sprite { width: 128px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.boss .info { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.boss h3 { font-size: 23px; }
.boss .quote { color: var(--muted); font-style: italic; font-size: 15px; }
.bar { height: 14px; background: var(--led-off); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--bad); transition: width .5s cubic-bezier(.3,.7,.2,1); }
.hpnum { font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player { display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.leds { display: flex; gap: 6px; flex-wrap: wrap; }
.led { width: 28px; height: 13px; border-radius: 3px; background: var(--led-off); border: 1px solid var(--line); transition: background .3s; }
.led.on { background: var(--ok); box-shadow: 0 0 8px rgba(111,203,143,.55); border-color: transparent; }
.led.dying { animation: ledOut .6s steps(2) 3; }
@keyframes ledOut { 50% { background: var(--bad); box-shadow: 0 0 10px var(--bad); } }
.inv { display: flex; gap: 8px; flex-wrap: wrap; }
.item { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 7px 11px; font-size: 14px; text-align: left; line-height: 1.35; }
.item b { font-family: var(--f-display); font-weight: 700; display: block; font-size: 14px; color: var(--gold); }
.item:disabled { opacity: .45; cursor: not-allowed; }
.item.passive { cursor: default; border-color: var(--shield); }
.item.passive b { color: var(--shield); }
.log { font-size: 15px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; min-height: 2.8em; }
.log b { color: var(--fg); }
.hint { color: var(--muted); font-size: 14px; text-align: center; }

/* animações de ataque */
.bolt { position: fixed; z-index: 30; width: 30px; height: 30px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff 0 22%, var(--dom) 55%, transparent 72%);
  box-shadow: 0 0 18px 6px var(--dom), 0 0 40px 10px var(--dom); }
.bolt.big { width: 46px; height: 46px; }
.burst { position: absolute; width: 20px; height: 20px; border-radius: 50%; pointer-events: none; border: 4px solid var(--dom, var(--gold)); transform: translate(-50%, -50%); }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 2px; background: var(--dom, var(--gold)); pointer-events: none; }
.float { position: absolute; z-index: 5; font-family: var(--f-display); font-size: 40px; font-weight: 800; color: var(--gold); pointer-events: none; text-shadow: 0 3px 0 #000, 0 0 16px rgba(0,0,0,.6); transform: translate(-50%, -50%); white-space: nowrap; }
.float.crit { color: var(--bad); font-size: 46px; }
.float small { display: block; font-size: 14px; letter-spacing: .08em; text-align: center; }
.float.hurt { color: var(--bad); }
.float.block { color: var(--shield); font-size: 26px; }
.claw { position: absolute; inset: 0; pointer-events: none; }
.claw i { position: absolute; left: 10%; width: 80%; height: 5px; border-radius: 3px; background: var(--bad); box-shadow: 0 0 12px var(--bad); transform-origin: left center; }
.hitflash { filter: brightness(2.6) saturate(.4); }
.panel.hurtflash { background: #4a1d24; transition: background .1s; }

/* pergunta */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(6,9,14,.8);
  display: grid; place-items: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.qbox {
  width: min(700px, 100%);
  background: var(--paper); color: var(--paper-ink);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 8px 0 var(--paper-edge), 0 30px 80px rgba(0,0,0,.5);
}
.qbox.enter { animation: deal .3s cubic-bezier(.2,.8,.3,1.1) both; }
.qbox .band { background: var(--dom); color: #17130b; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: .03em; padding: 10px 20px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.timer { height: 6px; background: rgba(34,29,19,.15); }
.timer i { display: block; height: 100%; background: var(--paper-ink); transition: width .2s linear; }
.timer.low i { background: var(--bad); }
.qbody { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.qbody h2 { font-family: var(--f-body); font-weight: 600; font-size: clamp(18px, 2.4vw, 21px); line-height: 1.45; letter-spacing: 0; }
.qbody code { background: rgba(34,29,19,.1); }
.opts { display: grid; gap: 9px; }
.opt {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start;
  text-align: left; padding: 12px 14px; border-radius: 10px; line-height: 1.45;
  background: var(--paper-2); border: 1px solid #d6caaf; color: var(--paper-ink); font-size: 16px;
}
.opt:hover:not(:disabled) { border-color: var(--paper-ink); }
.opt .l { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: var(--paper-ink); color: var(--paper); border-radius: 6px; text-align: center; padding: 1px 0; }
.opt.right { background: #d9f0df; border-color: #3e9a5e; }
.opt.right .l { background: #2f7d4a; }
.opt.wrong { background: #f7d9d9; border-color: #b8404a; }
.opt.wrong .l { background: #b8404a; }
.opt.elim { opacity: .3; text-decoration: line-through; }
.opt:disabled { cursor: default; }
.qtools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qtools .row { gap: 8px; }
.tool { border: 1px dashed var(--paper-muted); background: transparent; color: var(--paper-ink); border-radius: 9px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.tool:disabled { opacity: .4; cursor: not-allowed; }
.qtools small { color: var(--paper-muted); font-size: 13px; }
.feedback { border-radius: 10px; padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
.feedback strong { font-family: var(--f-display); font-size: 20px; }
.feedback.ok { background: #d9f0df; }
.feedback.bad { background: #f7d9d9; }
.qbox .btn { background: var(--paper-ink); color: var(--paper); box-shadow: 0 4px 0 #000; align-self: flex-end; }

/* jornada */
.path { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
.step .eyebrow { font-size: 12px; }
.step b { font-family: var(--f-display); font-size: 18px; }
.step.done { border-color: var(--ok); }
.step.done b::after { content: " ✓"; color: var(--ok); }
.step.now { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.step.locked { opacity: .5; }
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
.intro .sprite { width: 168px; height: 168px; }
.intro h2 { font-size: clamp(28px, 5vw, 40px); }
.intro .txt { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* loja */
.shop-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.shop-head h1 { font-size: clamp(32px, 6vw, 48px); font-weight: 800; }
.shop-status { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; }
.shop .card { min-height: 0; cursor: default; }
.shop .card:hover { transform: none; }
.shop .card .band { background: var(--dom, #c9bda3); }
.shop .buy { margin: 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.shop .buy button { border: 0; border-radius: 8px; padding: 8px 14px; background: var(--paper-ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.shop .buy button:disabled { opacity: .35; cursor: not-allowed; }
.shop .owned { font-size: 13px; color: var(--paper-muted); }
.price { white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--paper-ink); }
.price small { font-size: 13px; font-weight: 600; color: var(--paper-muted); }
.k-rec { --dom: #9ed3a9; }
.k-sup { --dom: #c9bda3; }
.k-atk { --dom: #f0a07a; }
.k-up { --dom: var(--gold); }
.toast { min-height: 1.6em; color: var(--ok); font-weight: 500; }

/* fim */
.end h1 { font-size: clamp(36px, 7vw, 60px); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat .chip { align-self: flex-start; }
.stat .big { font-family: var(--f-display); font-weight: 700; font-size: 32px; font-variant-numeric: tabular-nums; }
.stat .bar i { background: var(--dom); }
.review { display: flex; flex-direction: column; gap: 10px; }
.miss { display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--dom); }
.miss p { font-size: 15px; }
.miss .you { color: var(--bad); }
.miss .ans { color: var(--ok); }
.miss .exp { color: var(--muted); }

/* login */
.auth { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-top: 12px; }
.auth .title { padding-top: 0; }
.form { display: flex; flex-direction: column; gap: 14px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 9px; font-family: var(--f-display); font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.field input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; width: 100%; }
.field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
.field small { color: var(--muted); font-size: 13px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 15px; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); margin: 0; }
.err { color: var(--bad); font-size: 15px; min-height: 1.5em; }
.form .btn { width: 100%; }
.note { color: var(--muted); font-size: 14px; }

/* perfil */
.profile { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.profile .panel { display: flex; flex-direction: column; gap: 12px; }
.me { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.me h3 { font-size: 24px; overflow-wrap: anywhere; }
.kpis { display: flex; gap: 26px; flex-wrap: wrap; }
.kpis div { display: flex; flex-direction: column; }
.kpis b { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
.kpis span { color: var(--muted); font-size: 13px; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rank li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 15px; }
.rank .pos { font-family: var(--f-display); font-weight: 700; color: var(--muted); }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .pts { font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.rank li.mine { color: var(--gold); }
.btn.small { padding: 7px 14px; font-size: 14px; }

/* downloads */
.downloads { display: flex; flex-direction: column; gap: 12px; }
.dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.dl { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; transition: border-color .15s, transform .15s; }
.dl:hover { border-color: var(--gold); transform: translateY(-2px); }
.dl:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.dl .os { font-family: var(--f-display); font-weight: 800; font-size: 15px; width: 54px; height: 54px; display: grid; place-items: center; border-radius: 10px; background: var(--paper); color: var(--paper-ink); flex: none; }
.dl .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.dl b { font-family: var(--f-display); font-size: 17px; }
.dl p { color: var(--muted); font-size: 14px; }
.dl code { font-size: 12px; overflow-wrap: anywhere; }
.downloads a.link { color: var(--gold); }

@media (max-width: 720px) {
  .auth, .profile { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .arena { grid-template-columns: 1fr; }
  .hand, .classes { gap: 8px; }
  .card { min-height: 176px; }
  .hand .card .desc, .classes .card .desc { display: none; }
  .hand .card .band, .classes .card .band { padding: 7px 9px; font-size: 11px; letter-spacing: .02em; }
  .hand .card .skill, .hand .card .power, .hand .card .tags,
  .classes .card .skill, .classes .card .power { padding: 0 9px; }
  .card .key { display: none; }
  .boss canvas { width: 92px; height: 92px; }
  .path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { grid-template-columns: 1fr; }
  .intro .sprite { width: 112px; height: 112px; }
  .stats { grid-template-columns: 1fr; }
}

  [1,"dev","Qual o risco de montar uma query SQL concatenando direto o texto digitado pelo usuário?",["SQL Injection; a correção é usar queries parametrizadas","Lentidão; a correção é guardar as consultas em cache","XSS; a correção é servir a aplicação só por HTTPS","Deadlock; a correção é abrir uma transação por consulta"],"Com concatenação, o usuário pode injetar comandos SQL. Parâmetros (prepared statements) separam dados de código."],
  [1,"infra","Qual a diferença entre imagem e container no Docker?",["A imagem é o modelo imutável; o container é uma instância em execução dela","O container é o modelo imutável; a imagem é uma instância em execução dele","A imagem roda em produção; o container é usado apenas em desenvolvimento","A imagem é uma máquina virtual completa; o container é só o sistema de arquivos"],"A imagem é feita de camadas somente leitura. O container acrescenta uma camada gravável e um processo em execução."],
  [1,"infra","Em qual diretório ficam normalmente os logs do sistema no Linux?",["/var/log","/etc","/usr/bin","/proc"],"/var/log guarda logs (syslog, auth.log, nginx…). /etc guarda configurações, /usr/bin binários e /proc é um sistema de arquivos virtual do kernel."],
  [1,"infra","Qual nível de RAID espelha os mesmos dados em dois discos?",["RAID 1","RAID 0","RAID 5","RAID 6"],"RAID 1 é espelhamento. RAID 0 divide os dados sem redundância; RAID 5 e 6 usam paridade distribuída."],
  [1,"infra","No cron, o que significa a expressão `0 3 * * *`?",["Todo dia às 03:00","A cada 3 minutos","A cada 3 horas","No dia 3 de cada mês"],"Os campos são minuto, hora, dia do mês, mês e dia da semana. Minuto 0, hora 3, todo o resto livre."],
  [1,"infra","Qual comando faz um serviço subir automaticamente no boot com systemd?",["`systemctl enable nginx`","`systemctl start nginx`","`systemctl reload nginx`","`systemctl status nginx`"],"`enable` registra o serviço para subir no boot. `start` só inicia agora. `systemctl enable --now` faz as duas coisas."],
  [1,"infra","O que acontece com os dados gravados dentro de um container Docker, fora de um volume, quando ele é removido?",["Somem junto com o container; volumes existem para persistir dados","São gravados na imagem de origem e aparecem no próximo container","Vão para um volume anônimo do host e são reaproveitados depois","Ficam no cache do Docker até a próxima execução de `docker run`"],"A camada gravável morre com o container. Para persistir, use volumes ou bind mounts."],
  [1,"infra","Um servidor com 4 núcleos mostra load average 8. O que isso indica?",["Há mais processos querendo CPU (ou presos em I/O) do que núcleos disponíveis","A CPU está com 8% de uso médio, o que indica servidor quase ocioso","Há 8 GB de memória em uso, o dobro do recomendado para 4 núcleos","Há 8 processos zumbis aguardando o processo pai ler o código de saída"],"Load average conta processos executando ou esperando. No Linux inclui processos bloqueados em I/O. Acima do número de núcleos, há fila."],
  [1,"infra","Qual comando mostra as últimas linhas de um log e continua acompanhando novas entradas?",["`tail -f`","`head -n 50`","`cat -n`","`wc -l`"],"`tail -f` segue o arquivo em tempo real. Para logs do systemd, o equivalente é `journalctl -f`."],
  [1,"redes","Quantos endereços de host utilizáveis tem uma rede /24?",["254","256","255","128"],"Um /24 tem 256 endereços. Tirando o endereço de rede e o de broadcast, sobram 254 para hosts."],
  [1,"redes","O que caracteriza o UDP em comparação ao TCP?",["Não garante entrega nem ordem, mas tem menos overhead","Usa o handshake de três vias antes de enviar dados","Retransmite pacotes perdidos, mas não garante a ordem","Garante a ordem dos pacotes, mas não a entrega deles"],"UDP não tem conexão nem retransmissão. Por isso é usado em DNS, VoIP, jogos e streaming."],
  [1,"redes","Em qual camada do modelo OSI atua um roteador?",["Camada 3 (Rede)","Camada 2 (Enlace)","Camada 4 (Transporte)","Camada 7 (Aplicação)"],"Roteadores encaminham pacotes por endereço IP, na camada 3. Switches comuns trabalham na camada 2, com endereços MAC."],
  [1,"redes","Para que serve o NAT em um roteador doméstico?",["Permitir que vários IPs privados saiam para a internet com um IP público","Resolver os nomes de domínio para os dispositivos da rede interna","Criptografar o tráfego do Wi-Fi entre os dispositivos e o roteador","Distribuir automaticamente IP, máscara e gateway para os dispositivos"],"O NAT (na prática, PAT) reescreve IP e porta de origem, compartilhando um único IP público entre vários dispositivos."],
  [1,"redes","O que uma VLAN permite fazer?",["Segmentar logicamente a rede no mesmo switch físico","Somar a banda de várias portas num único link lógico","Ligar duas redes diferentes sem precisar de roteador","Criar um túnel criptografado entre duas filiais"],"VLANs (802.1Q) separam domínios de broadcast. Para trafegar entre VLANs é preciso roteamento."],
  [1,"redes","Qual máscara decimal corresponde a um prefixo /26?",["255.255.255.192","255.255.255.224","255.255.255.128","255.255.255.240"],"/26 usa 2 bits do último octeto: 128 + 64 = 192. São 64 endereços por sub-rede, 62 utilizáveis."],
  [1,"redes","Para que serve o protocolo ARP?",["Descobrir o endereço MAC a partir de um IP na rede local","Descobrir o endereço IP a partir de um nome de domínio","Atribuir endereços IP automaticamente aos dispositivos","Escolher a melhor rota entre redes de destinos diferentes"],"Antes de enviar um quadro na LAN, o host pergunta “quem tem o IP X?” e guarda o MAC na tabela ARP."],
  [1,"redes","Qual registro DNS aponta um nome para um endereço IPv6?",["AAAA","A","CNAME","MX"],"A aponta para IPv4, AAAA para IPv6. CNAME é um apelido para outro nome e MX indica servidores de e-mail."],

  /* ================= SÊNIOR ================= */
  [2,"dev","A thread A segura o lock X e espera o Y; a thread B segura o Y e espera o X. Como se chama essa situação?",["Deadlock","Livelock","Race condition","Starvation"],"Deadlock é espera circular por recursos. No livelock as threads continuam ativas sem progredir; starvation é uma thread nunca ser atendida. Adquirir locks sempre na mesma ordem evita o problema."],
  [2,"dev","Existe um índice em `(sobrenome, nome)`. Por que ele pode NÃO ajudar em `WHERE nome = 'Ana'`?",["Índices compostos seguem a ordem das colunas: vale o prefixo mais à esquerda","Índices B-tree não conseguem ordenar colunas de texto com acentuação","O otimizador só usa índices compostos quando a query tem ORDER BY","Comparações de igualdade em texto exigem um índice do tipo hash separado"],"O índice está ordenado primeiro por sobrenome. Sem filtrar por sobrenome, o banco não aproveita a ordenação. Alguns bancos fazem skip scan, mas raramente compensa."],
  [2,"dev","Qual estratégia de cache grava no cache e no banco na mesma operação de escrita?",["Write-through","Write-back (write-behind)","Cache-aside","Read-through"],"Write-through mantém cache e banco sincronizados, ao custo de latência na escrita. Write-back grava no banco depois, com risco de perda. Read-through e cache-aside tratam da leitura."],
  [2,"dev","Pelo teorema CAP, durante uma partição de rede um sistema distribuído precisa escolher entre:",["Consistência e disponibilidade","Consistência e tolerância a partição","Latência e durabilidade","Disponibilidade e durabilidade"],"A partição é o cenário dado, não uma escolha. Com a rede partida, ou o sistema recusa requisições para manter consistência (CP) ou responde com dados possivelmente velhos (AP)."],
  [2,"dev","Por que usar uma chave de idempotência numa API de pagamentos?",["Para que retentativas da mesma requisição não gerem cobranças duplicadas","Para garantir que os webhooks de confirmação cheguem na ordem em que foram gerados","Para permitir que a CDN guarde em cache a resposta de cada transação","Para aplicar limite de requisições por cliente sem consultar o banco de dados"],"O cliente reenvia a mesma chave em cada tentativa. O servidor reconhece a repetição e devolve o resultado original em vez de cobrar de novo."],
  [2,"dev","No nível de isolamento READ COMMITTED, qual anomalia ainda pode acontecer?",["Leitura não repetível: a mesma consulta volta com valores diferentes","Leitura suja: a transação enxerga dados de outra que ainda não confirmou","Nenhuma: READ COMMITTED é o nível mais alto definido pelo padrão SQL","Perda de uma transação que já recebeu confirmação de commit do banco"],"READ COMMITTED impede dirty reads, mas outra transação pode confirmar mudanças entre duas leituras suas. REPEATABLE READ e SERIALIZABLE protegem disso."],
  [2,"dev","Um serviço chama outro que ficou lento e as threads se esgotam em cascata. Qual padrão evita isso?",["Circuit breaker com timeouts curtos","Aumentar o timeout para 60 segundos","Retry imediato e sem limite","Sessões fixas no balanceador (sticky sessions)"],"O circuit breaker para de chamar o serviço doente e falha rápido. Combine com timeouts, bulkheads e retries com backoff e jitter."],
  [2,"dev","Por que um JWT puro é ruim para sessões que precisam ser revogadas na hora?",["É validado sem consultar o servidor até expirar; revogar exige lista de bloqueio ou tokens curtos","Não pode ser assinado com chave assimétrica, só com segredo compartilhado entre os serviços","É sempre criptografado, e decifrá-lo a cada requisição torna a revogação lenta demais","Só pode ser transportado em cookies, que o navegador mantém até o fim da sessão"],"A vantagem do JWT é dispensar consulta ao servidor, e isso dificulta revogar. A saída comum é access token curto mais refresh token revogável."],
  [2,"infra","No Kubernetes, qual objeto mantém um número desejado de réplicas de pods stateless e faz rolling updates?",["Deployment","DaemonSet","StatefulSet","Service"],"O Deployment gerencia ReplicaSets e atualizações graduais. O StatefulSet é para cargas com identidade e disco estáveis, o DaemonSet roda um pod por nó e o Service expõe pods na rede."],
  [2,"infra","Duas pessoas rodam `terraform apply` no mesmo ambiente ao mesmo tempo. O que evita corromper o state?",["Backend remoto com lock de state","Rodar `terraform fmt` antes","Versionar o `.tfstate` no Git","Usar um workspace para cada pessoa"],"Um backend remoto com lock (S3 com DynamoDB, Terraform Cloud, GCS) bloqueia execuções simultâneas. State no Git não tem lock e pode expor segredos."],
  [2,"infra","Quais são os três pilares clássicos da observabilidade?",["Logs, métricas e traces","Logs, alertas e dashboards","Métricas, eventos e SLAs","Traces, healthchecks e uptime"],"Métricas mostram que algo está errado, traces mostram onde e logs explicam o porquê. Alertas e dashboards são construídos em cima deles."],
  [2,"infra","Uma disponibilidade de 99,9% permite aproximadamente quanto tempo fora do ar por mês?",["Cerca de 43 minutos","Cerca de 4 minutos","Cerca de 7 horas","Cerca de 9 horas"],"Um mês de 30 dias tem 43.200 minutos; 0,1% disso dá 43,2 minutos. Com 99,99%, são cerca de 4 minutos."],
  [2,"infra","O que caracteriza um deploy blue-green?",["Dois ambientes idênticos; o tráfego troca de uma vez para a versão nova, com rollback rápido","A versão nova recebe uma porcentagem crescente de usuários enquanto as métricas são observadas","Os servidores são atualizados um de cada vez, mantendo parte da frota com a versão antiga","A funcionalidade é ativada por uma flag em tempo de execução, sem precisar de um novo deploy"],"No blue-green, o rollback é só voltar o tráfego para o ambiente antigo. Porcentagem crescente é canary; um por um é rolling update; flag é feature toggle."],
  [2,"infra","Um pod está em CrashLoopBackOff. Qual comando ajuda mais a descobrir o motivo?",["`kubectl logs <pod> --previous`","`kubectl get endpoints <service>`","`kubectl rollout restart deploy/<app>`","`kubectl top pod <pod> --containers`"],"`--previous` mostra a saída do container que acabou de morrer. `kubectl describe pod` também ajuda, com eventos e o código de saída."],
  [2,"infra","No Kubernetes, qual a diferença entre liveness probe e readiness probe?",["Liveness reinicia o container travado; readiness tira o pod do balanceamento até ele ficar pronto","Readiness reinicia o container travado; liveness tira o pod do balanceamento até ele ficar pronto","As duas reiniciam o container, mas a readiness espera o initialDelaySeconds antes de checar","Readiness só é avaliada durante o rollout; depois disso apenas a liveness continua rodando"],"Uma liveness mal configurada (checando dependências externas, por exemplo) pode gerar reinícios em cascata."],
  [2,"infra","Um container terminou com status OOMKilled. O que isso indica?",["Passou do limite de memória e o kernel matou o processo","Passou do limite de CPU e o kubelet encerrou o container","O disco efêmero do nó encheu e o pod foi despejado","A liveness probe falhou três vezes seguidas e ele reiniciou"],"Exceder o limite de CPU causa throttling, não morte. Exceder o de memória aciona o OOM killer."],
  [2,"redes","Qual a diferença entre um balanceador de carga L4 e um L7?",["O L4 decide por IP e porta; o L7 pode decidir pelo conteúdo HTTP (path, headers)","O L4 faz terminação TLS e lê cookies; o L7 apenas repassa a conexão TCP adiante","O L7 trabalha só com UDP e QUIC; o L4 é usado para qualquer tráfego baseado em TCP","O L4 mantém afinidade por cookie de sessão; o L7 distribui sempre em round-robin"],"O L7 entende a aplicação: roteia por `/api`, por host, lê cookies e faz terminação TLS. O L4 só olha a conexão de transporte."],
  [2,"redes","No TLS, qual o papel do certificado do servidor?",["Autenticar a identidade do servidor por meio de uma cadeia de confiança","Cifrar todo o tráfego da sessão usando a chave privada do servidor","Gerar a chave simétrica de sessão que será usada pelos dois lados","Negociar a versão do HTTP e os algoritmos aceitos pelo navegador"],"O certificado prova que a chave pública pertence ao domínio. A chave de sessão vem de uma troca separada, como o ECDHE no TLS 1.3."],
  [2,"redes","Qual protocolo de roteamento é usado entre sistemas autônomos (AS) na internet?",["BGP","OSPF","IS-IS","EIGRP"],"BGP é o protocolo entre AS. OSPF, IS-IS e EIGRP são protocolos de roteamento interno, usados dentro de um AS."],
  [2,"redes","Na VPN, o ping funciona, mas transferências grandes travam. Qual a causa mais provável?",["MTU e fragmentação, com ICMP bloqueado quebrando o Path MTU Discovery","Latência alta no túnel, que estoura o timeout das transferências longas","Cifra da VPN incompatível com pacotes maiores que o tamanho do bloco","TTL baixo demais, que faz os pacotes grandes expirarem antes do destino"],"O túnel acrescenta cabeçalhos e reduz a MTU útil. Pacotes grandes com DF são descartados. Ajustar MTU ou fazer MSS clamping resolve."],
  [2,"redes","O que um firewall stateful faz que um filtro de pacotes stateless não faz?",["Acompanha o estado das conexões e libera as respostas de conexões já estabelecidas","Filtra os pacotes por IP e porta de origem e destino, nas duas direções do tráfego","Inspeciona o payload procurando assinaturas de ataques conhecidos e bloqueia na hora","Traduz os endereços privados para o IP público na saída, escondendo a rede interna"],"Com a tabela de conexões, basta liberar a saída e as respostas voltam sozinhas. Procurar assinaturas é papel de um IPS."],
  [2,"redes","Um servidor que faz muitas chamadas de saída acumula milhares de conexões em TIME_WAIT. O que isso significa?",["Conexões que ele mesmo encerrou aguardam um tempo antes de liberar a porta","Conexões que ainda aguardam o ACK final do handshake de três vias","Conexões que o servidor remoto fechou e que a aplicação ainda não leu","Sinal de um SYN flood em andamento contra as portas de saída do servidor"],"Quem fecha a conexão ativamente fica em TIME_WAIT por 2×MSL. Reaproveitar conexões (keep-alive, pool) reduz o acúmulo e o risco de esgotar portas."],
  [2,"redes","Quantos endereços de host utilizáveis existem em uma rede /22?",["1022","1024","510","2046"],"/22 deixa 10 bits para hosts: 2¹⁰ = 1024 endereços, menos rede e broadcast, dá 1022."],
  [2,"redes","Você alterou um registro DNS, mas alguns usuários ainda caem no IP antigo horas depois. Qual a explicação mais provável?",["Resolvedores ainda servem a resposta em cache até expirar o TTL antigo","A propagação de DNS exige que os servidores raiz sejam atualizados antes","O DHCP dos usuários ainda entrega o servidor DNS da configuração antiga","O registro AAAA antigo tem prioridade sobre o novo registro A alterado"],"Cada resolvedor guarda a resposta pelo TTL que recebeu. Antes de uma migração, reduza o TTL com antecedência."],

  /* ================= TECH LEAD ================= */
  [3,"dev","Quando faz mais sentido começar com um monólito modular em vez de microsserviços?",["Time pequeno e domínio ainda pouco conhecido","Domínio estável e dezenas de times que precisam de deploy independente","Partes do sistema com necessidades de escala muito diferentes","Quando a empresa quer usar várias linguagens"],"Microsserviços cobram caro em operação e coordenação. Com módulos bem separados, dá para extrair serviços depois, quando as fronteiras estiverem claras."],
  [3,"dev","PRs ficam dias parados esperando revisão. Qual mudança ataca melhor a causa?",["PRs menores, revisão tratada como prioridade do time e limite de trabalho em andamento","Exigir três aprovações por PR para garantir que todo código seja visto por mais gente","Concentrar toda revisão no tech lead, que conhece o sistema inteiro e decide mais rápido","Permitir merge sem revisão quando os testes passam, revisando depois em lote na sexta"],"PRs pequenos são revisados mais rápido e melhor. Limitar o WIP faz o time terminar antes de começar coisas novas."],
  [3,"dev","Qual a forma sustentável de lidar com débito técnico?",["Torná-lo visível, priorizar pelo impacto e reservar capacidade contínua","Parar as features por um trimestre e reescrever os módulos mais antigos","Deixar que cada pessoa resolva o que encontrar no seu tempo livre","Tratar só quando causar incidente, para não atrasar o roadmap de produto"],"Débito bem gerido entra no backlog com custo e impacto explícitos, e o time reserva parte de cada ciclo para pagá-lo."],
  [3,"dev","O que é um ADR (Architecture Decision Record)?",["Um registro curto de uma decisão de arquitetura, com contexto, alternativas e consequências","Um documento de requisitos que descreve o comportamento esperado de cada funcionalidade","Um relatório de incidente com linha do tempo, causa raiz e ações corretivas combinadas","Um diagrama em camadas (C4) mostrando contexto, containers e componentes do sistema"],"ADRs explicam por que algo foi decidido. Quem chega ao time anos depois entende o contexto sem adivinhar."],
  [3,"dev","Qual destas NÃO é uma das quatro métricas DORA?",["Cobertura de testes","Frequência de deploy","Lead time de mudanças","Taxa de falha de mudanças"],"As quatro métricas são frequência de deploy, lead time de mudanças, taxa de falha de mudanças e tempo de restauração do serviço."],
  [3,"dev","É preciso trocar um banco de dados legado sem downtime. Qual estratégia é mais segura?",["Expand/contract: escrita dupla, migração gradual com verificação e troca progressiva das leituras","Big bang numa janela de manutenção de fim de semana, com backup completo antes da virada","Reescrever o sistema já apontando para o banco novo e só então migrar os dados de uma vez","Copiar o schema e os dados num sábado, depois trocar a connection string em todos os serviços"],"Mudanças em etapas reversíveis permitem comparar os dois bancos e voltar atrás a qualquer momento."],
  [3,"dev","Como saber se uma feature nova realmente melhorou o produto?",["Definir métrica e hipótese antes, liberar com feature flag e comparar com um grupo de controle","Comparar a métrica principal da semana anterior ao lançamento com a da semana seguinte","Acompanhar quantos usuários abriram a feature nos primeiros dias depois da liberação","Coletar a opinião do time e dos clientes mais próximos em entrevistas após o lançamento"],"Entregar não é o mesmo que gerar resultado. Um experimento com grupo de controle separa o efeito da feature de outros fatores."],
  [3,"dev","Uma decisão técnica divide o time em dois lados empatados. Qual a melhor conduta de quem lidera?",["Explicitar critérios e trade-offs, buscar dados ou um spike curto, decidir, registrar e definir quando reavaliar","Fazer uma votação anônima com o time inteiro e seguir a opção da maioria, sem precisar registrar o motivo","Adiar a decisão até que todo o time chegue a um consenso, para ninguém se sentir vencido pela escolha","Escolher a opção defendida pela pessoa mais experiente, porque ela responderá pelo resultado em produção"],"Decidir com critérios claros e registrar o motivo evita discussões que voltam todo mês. Uma data de reavaliação torna a decisão menos arriscada."],
  [3,"infra","Qual o objetivo principal de um postmortem “blameless”?",["Entender as causas sistêmicas e evitar recorrência, sem culpar pessoas","Identificar quem errou para oferecer treinamento direcionado","Produzir o relatório formal de indisponibilidade para o cliente","Medir o tempo de resposta de quem estava de plantão no incidente"],"Quando ninguém teme punição, as pessoas contam o que realmente aconteceu. Assim aparecem as falhas de processo e de sistema."],
  [3,"infra","O que é um error budget?",["A margem de falha que o SLO permite, usada para equilibrar velocidade e confiabilidade","O downtime máximo permitido antes de o contrato gerar multa para a empresa","O número de erros por minuto aceito antes de o monitoramento disparar alerta","A reserva financeira separada no orçamento para cobrir custos de incidentes"],"O budget é 100% − SLO: com SLO de 99,9%, sobra 0,1%. Se ele acaba, o time desacelera features e prioriza confiabilidade. A multa contratual é assunto do SLA."],
  [3,"infra","Uma carga estável roda 24/7 há anos na nuvem. Qual ação tende a reduzir mais o custo?",["Contratar instâncias reservadas ou savings plans","Rodar o banco principal em instâncias spot","Desligar tudo à noite com autoscaling para zero","Migrar para instâncias maiores"],"Compromisso de 1 a 3 anos dá descontos grandes para uso previsível. Spot pode ser interrompido; desligar à noite não serve para carga 24/7."],
  [3,"infra","Num plano de recuperação de desastres, o que significam RPO e RTO?",["RPO: quanto dado se pode perder; RTO: em quanto tempo o serviço precisa voltar","RPO: em quanto tempo o serviço precisa voltar; RTO: quanto dado se pode perder","RPO: intervalo entre testes de restauração; RTO: tempo de retenção dos backups","RPO: latência máxima entre regiões; RTO: tempo para o DNS apontar para a réplica"],"RPO de 1 hora exige backups ou replicação pelo menos de hora em hora. O RTO define a velocidade da restauração."],
  [3,"infra","Uma chave de acesso com permissão de administrador vazou num repositório público. Qual a primeira ação?",["Revogar e rotacionar a chave imediatamente, depois investigar o uso","Apagar o commit, reescrever o histórico e fazer force push na branch","Tornar o repositório privado e avisar quem tinha clonado para apagar","Abrir um incidente e investigar os logs antes de mexer na credencial"],"Robôs varrem repositórios públicos em minutos, e o histórico pode já estar em forks e caches. Só revogar a chave fecha a porta."],
  [3,"infra","Qual a diferença entre SLI, SLO e SLA?",["SLI é a medida; SLO é a meta interna; SLA é o compromisso contratual com consequências","SLA é a medida; SLO é o compromisso contratual; SLI é a meta interna definida pelo time","SLO é a medida; SLI é a meta interna; SLA é o relatório mensal enviado para o cliente","São nomes diferentes para a mesma meta, usados por times de produto, SRE e jurídico"],"Exemplo: o SLI é a % de requisições com sucesso, o SLO interno é 99,9% e o SLA com o cliente promete 99,5%, com multa."],
  [3,"infra","Alertas acordam o plantão toda noite, mas a maioria não exige ação. O que fazer?",["Alertar por sintomas que afetam usuários (SLO e burn rate) e remover o que não é acionável","Colocar mais pessoas na escala de plantão para dividir o cansaço das madrugadas","Silenciar os alertas à noite e revisar tudo o que disparou na manhã seguinte","Aumentar os limites de todos os alertas em 50% para reduzir o volume de disparos"],"Alertas que não exigem ação geram fadiga, e o alerta importante passa despercebido. Cada página deve pedir uma ação humana."],

const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ================= contas =================
 * No app para computador, as contas ficam no processo principal do Electron (scrypt, arquivo local).
 * Na versão web, ficam no armazenamento do navegador (PBKDF2 via Web Crypto).
 * As duas implementações expõem a mesma interface.
 */
const NOME_RE = /^[\p{L}\p{N}._-]{3,20}$/u, SENHA_MIN = 6;
function validarConta(nome, senha) {
  if (typeof nome !== "string" || !NOME_RE.test(nome.trim())) return "O nome de usuário precisa ter de 3 a 20 caracteres: letras, números, ponto, hífen ou sublinhado.";
  if (typeof senha !== "string" || senha.length < SENHA_MIN) return `A senha precisa ter pelo menos ${SENHA_MIN} caracteres.`;
  if (senha.length > 200) return "A senha é longa demais.";
  return null;
}
const WebAuth = (() => {
  const KEY = "masmorra-contas", SES = "masmorra-sessao";
  let atual = null;
  const read = () => { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.users) return d; } catch (e) { /* vazio */ } return { users: {} }; };
  const write = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };
  const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
  async function hash(senha, salt) {
    const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
    return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unhex(salt), iterations: 150000, hash: "SHA-256" }, k, 256));
  }
  const pub = (u) => u ? { name: u.name, best: u.best, games: u.games, wins: u.wins, history: u.history } : null;
  const key = (n) => String(n || "").trim().toLowerCase();
  const sessao = (k, lembrar) => {
    atual = k;
    try { sessionStorage.setItem(SES, k); if (lembrar) localStorage.setItem(SES, k); else localStorage.removeItem(SES); } catch (e) { /* só em memória */ }
  };
  const semCripto = () => !(window.crypto && crypto.subtle);
  return {
    kind: "web",
    async register({ name, password, remember }) {
      const erro = validarConta(name, password);
      if (erro) return { ok: false, error: erro };
      if (semCripto()) return { ok: false, error: "Este navegador não oferece criptografia para guardar a senha. Use o app para computador." };
      const d = read(), k = key(name);
      if (d.users[k]) return { ok: false, error: "Já existe uma conta com esse nome neste navegador." };
      const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
      d.users[k] = { name: name.trim(), salt, hash: await hash(password, salt), createdAt: new Date().toISOString(), best: 0, games: 0, wins: 0, history: [] };
      if (!write(d)) return { ok: false, error: "O navegador bloqueou o armazenamento do site. Libere os dados do site ou use o app para computador." };
      sessao(k, remember);
      return { ok: true, user: pub(d.users[k]) };
    },
    async login({ name, password, remember }) {
      const u = read().users[key(name)];
      if (!u || semCripto() || (await hash(String(password || ""), u.salt)) !== u.hash) {
        await wait(600);
        return { ok: false, error: "Usuário ou senha incorretos." };
      }
      sessao(key(name), remember);
      return { ok: true, user: pub(u) };
    },
    async logout() {
      atual = null;
      try { localStorage.removeItem(SES); sessionStorage.removeItem(SES); } catch (e) { /* nada a limpar */ }
      return { ok: true };
    },
    async current() {
      if (!atual) { try { atual = sessionStorage.getItem(SES) || localStorage.getItem(SES); } catch (e) { atual = null; } }
      const u = atual ? read().users[atual] : null;
      if (!u) atual = null;
      return { ok: true, user: pub(u) };
    },
    async saveResult(r) {
      const d = read(), u = atual ? d.users[atual] : null;
      if (!u) return { ok: false, error: "Entre na sua conta para salvar o resultado." };
      const novo = r.score > u.best;
      u.games++; if (r.win) u.wins++; if (novo) u.best = r.score;
      u.history.unshift({ score: r.score, cleared: r.cleared, win: !!r.win, cls: r.cls, date: new Date().toISOString() });
      u.history = u.history.slice(0, 20);
      if (!write(d)) return { ok: false, error: "Não foi possível salvar o resultado neste navegador." };
      return { ok: true, user: pub(u), newBest: novo };
    },
    async ranking() {
      const lista = Object.values(read().users).filter((u) => u.games > 0).sort((a, b) => b.best - a.best).slice(0, 5)
        .map((u) => ({ name: u.name, best: u.best, wins: u.wins }));
      return { ok: true, ranking: lista };
    }
  };
})();

const lvl = () => NIVEIS[S.ch];
const boss = () => lvl().boss;
function dmgFor(q) {
  let d = 2 + (q.dom === S.cls ? 1 : 0) + (S.cert[q.dom] || 0);
  if (q.dom === boss().fraco) d *= 2;
  return d;
}
const price = (it) => it.preco + (it.passo || 0) * (S.buys[it.id] || 0);

function newGame(cls) {
  S = { screen: "intro", cls, ch: 0, hp: BASE_HP, maxHp: BASE_HP, xp: 0, score: 0, cleared: -1,
        inv: { so: 1, pato: 1, rollback: 0, hotfix: 0 }, cert: { infra: 0, dev: 0, redes: 0 }, buys: {},
        seen: [], names: {}, stats: { infra: [0, 0], dev: [0, 0], redes: [0, 0] }, missed: [] };
  render();
}
function enterChapter() {
  S.deck = shuffle(Q.filter((q) => q.lvl === S.ch && !S.seen.includes(q.id)).map((q) => q.id));
  S.hand = [];
  S.bossHp = boss().hp;
  S.cur = null; S.pending = null;
  S.log = `<b>${esc(boss().nome)}</b> bloqueia o caminho. Escolha uma carta.`;
  while (S.hand.length < HAND && draw()) { /* compra */ }
  S.screen = "battle";
  render();
}
/* compra uma pergunta nunca vista na jornada; se o nível acabar, usa um nível vizinho */
function freshId(filter) {
  const pool = Q.filter((q) => !S.seen.includes(q.id) && !S.hand.includes(q.id) && filter(q));
  return pool.length ? pick(pool).id : null;
}
function draw() {
  let id = null;
  while (S.deck.length && id == null) { const c = S.deck.pop(); if (!S.seen.includes(c)) id = c; }
  if (id == null) id = freshId((q) => q.lvl === S.ch) ?? freshId((q) => Math.abs(q.lvl - S.ch) === 1) ?? freshId(() => true);
  if (id == null) return false;
  S.hand.push(id);
  S.seen.push(id);
  const usados = S.hand.map((h) => S.names[h]);
  const livres = ATAQUES[Q[id].dom].filter((n) => !usados.includes(n));
  S.names[id] = pick(livres.length ? livres : ATAQUES[Q[id].dom]);
  fx.cards.add(id);
  return true;
}
function play(i) {
  if (busy || S.cur || S.hand[i] == null) return;
  const t = lvl().tempo;
  S.cur = { slot: i, id: S.hand[i], order: shuffle([0, 1, 2, 3]), elim: [], chosen: null, deadline: t ? Date.now() + t * 1000 : 0 };
  fx.modal = true;
  render();
}
function answer(k) {
  const c = S.cur;
  if (!c || c.chosen != null || (k >= 0 && c.elim.includes(k))) return;
  c.chosen = k;
  const q = Q[c.id];
  c.ok = k >= 0 && c.order[k] === 0;
  S.stats[q.dom][1]++;
  if (c.ok) {
    c.dmg = dmgFor(q);
    S.stats[q.dom][0]++;
    S.xp += c.dmg * 10; S.score += c.dmg * 10;
  } else {
    S.missed.push({ id: q.id, picked: k >= 0 ? c.order[k] : -1 });
  }
  render();
}
async function next() {
  const c = S.cur;
  if (busy || !c || c.chosen == null) return;
  const q = Q[c.id];
  S.cur = null;
  S.pending = { kind: c.ok ? "hit" : "miss", slot: c.slot, dom: q.dom, dmg: c.ok ? c.dmg : 0, crit: c.ok && q.dom === boss().fraco, shield: !c.ok && S.inv.rollback > 0 };
  await animateAndResolve();
}
async function useHotfix() {
  if (busy || S.cur || !S.inv.hotfix) return;
  S.inv.hotfix--;
  S.xp += HOTFIX_DMG * 5; S.score += HOTFIX_DMG * 5;
  S.pending = { kind: "hit", slot: null, dom: "hotfix", dmg: HOTFIX_DMG, crit: false, hotfix: true };
  await animateAndResolve();
}
async function animateAndResolve() {
  busy = true;
  render();
  try { await (S.pending.kind === "hit" ? animHit(S.pending) : animMiss(S.pending)); } catch (e) { /* animação é opcional */ }
  resolvePending();
  busy = false;
  render();
}
function resolvePending() {
  const p = S.pending;
  if (!p) return;
  const nomeAtk = p.slot != null ? S.names[S.hand[p.slot]] : "Hotfix em Produção";
  if (p.kind === "hit") {
    S.bossHp = Math.max(0, S.bossHp - p.dmg);
    S.log = `<b>${esc(nomeAtk)}</b> causou ${p.dmg} de dano${p.crit ? " (fraqueza!)" : ""}.`;
  } else if (p.shield) {
    S.inv.rollback--;
    S.log = `O <b>Rollback</b> desfez o golpe de ${esc(boss().nome)}. Nenhum uptime perdido.`;
  } else {
    S.hp = Math.max(0, S.hp - lvl().dano);
    S.log = `<b>${esc(nomeAtk)}</b> falhou. ${esc(boss().nome)} derrubou ${lvl().dano} de uptime.`;
  }
  if (p.slot != null) { S.hand.splice(p.slot, 1); draw(); }
  S.pending = null;
  if (S.bossHp <= 0) {
    S.cleared = S.ch;
    const ganho = lvl().bonus + S.hp * 20;
    S.lastReward = { bonus: lvl().bonus, uptime: S.hp * 20 };
    S.xp += ganho; S.score += ganho;
    S.screen = S.ch === NIVEIS.length - 1 ? "end" : "clear";
  } else if (S.hp <= 0) {
    S.screen = "end";
  } else if (!S.hand.length) {
    S.screen = "end";
  }
}
function useSO() {
  const c = S.cur;
  if (!c || c.chosen != null || !S.inv.so || c.elim.length) return;
  S.inv.so--;
  c.elim = shuffle([0, 1, 2, 3].filter((k) => c.order[k] !== 0)).slice(0, 2);
  render();
}
function usePato() {
  const c = S.cur;
  if (!c || c.chosen != null || !S.inv.pato) return;
  const dom = Q[c.id].dom;
  const id = freshId((q) => q.lvl === S.ch && q.dom === dom) ?? freshId((q) => q.lvl === S.ch);
  if (id == null) return;
  S.inv.pato--;
  S.deck = S.deck.filter((d) => d !== id);
  S.seen.push(id);
  S.names[id] = S.names[c.id];
  S.hand[c.slot] = id;
  const t = lvl().tempo;
  S.cur = { slot: c.slot, id, order: shuffle([0, 1, 2, 3]), elim: [], chosen: null, deadline: t ? Date.now() + t * 1000 : 0 };
  fx.modal = true;
  render();
}
function buy(id) {
  const it = SHOP.find((s) => s.id === id);
  if (!it || !canBuy(it)) return;
  S.xp -= price(it);
  S.buys[id] = (S.buys[id] || 0) + 1;
  it.compra();
  toast = `Compra feita: ${it.nome}.`;
  render();
}
function canBuy(it) {
  if (S.xp < price(it)) return false;
  if (it.max && (S.buys[it.id] || 0) >= it.max) return false;
  if (it.pode && !it.pode()) return false;
  return true;
}
function promote() {
  S.ch++;
  S.screen = "intro";
  render();
}

function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
function spawnIn(parent, cls, x, y, html = "") {
  const pr = parent.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = cls;
  el.style.left = (x - pr.left) + "px";
  el.style.top = (y - pr.top) + "px";
  el.innerHTML = html;
  parent.appendChild(el);
  return el;
}
async function animHit(p) {
  if (reduceMotion()) { await wait(150); return; }
  const target = $app.querySelector(".boss canvas");
  const bossPanel = $app.querySelector(".boss");
  const origin = p.slot != null ? $app.querySelector(`.hand .card[data-v="${p.slot}"]`) : $app.querySelector('[data-act="hotfix"]');
  if (!target || !origin) return;
  const domCls = p.hotfix ? "k-atk" : `d-${p.dom}`;
  if (p.slot != null) origin.animate([{ transform: "none" }, { transform: "translateY(-34px) scale(1.07) rotate(-2deg)" }], { duration: 200, easing: "ease-out", fill: "forwards" });
  await wait(180);
  const a = center(origin), b = center(target);
  const bolt = document.createElement("div");
  bolt.className = `bolt ${domCls}${p.crit || p.hotfix ? " big" : ""}`;
  bolt.style.left = a.x + "px"; bolt.style.top = a.y + "px";
  document.body.appendChild(bolt);
  const mx = (a.x + b.x) / 2 - a.x, my = Math.min(a.y, b.y) - 90 - a.y;
  await bolt.animate([
    { transform: "translate(-50%,-50%) scale(.5)" },
    { transform: `translate(calc(-50% + ${mx}px), calc(-50% + ${my}px)) scale(1)` },
    { transform: `translate(calc(-50% + ${b.x - a.x}px), calc(-50% + ${b.y - a.y}px)) scale(1.4)` }
  ], { duration: 460, easing: "cubic-bezier(.45,0,.55,1)" }).finished;
  bolt.remove();
  /* impacto */
  if (p.slot != null) origin.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-50px) scale(.85)" }], { duration: 260, fill: "forwards" });
  target.classList.add("hitflash");
  target.animate([{ transform: "none" }, { transform: "translateX(-10px) rotate(-4deg)" }, { transform: "translateX(9px) rotate(3deg)" }, { transform: "translateX(-5px)" }, { transform: "none" }], { duration: 420 });
  const ring = spawnIn(bossPanel, `burst ${domCls}`, b.x, b.y);
  ring.animate([{ width: "20px", height: "20px", opacity: 1 }, { width: p.crit ? "220px" : "150px", height: p.crit ? "220px" : "150px", opacity: 0 }], { duration: 520, easing: "ease-out" }).finished.then(() => ring.remove());
  for (let i = 0; i < (p.crit ? 14 : 9); i++) {
    const s = spawnIn(bossPanel, `spark ${domCls}`, b.x, b.y);
    const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 60;
    s.animate([{ transform: "translate(-50%,-50%)", opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px)) rotate(180deg)`, opacity: 0 }], { duration: 560, easing: "ease-out" }).finished.then(() => s.remove());
  }
  const fl = spawnIn(bossPanel, `float${p.crit ? " crit" : ""}`, b.x, b.y - 10, `−${p.dmg}${p.crit ? "<small>CRÍTICO</small>" : p.hotfix ? "<small>HOTFIX</small>" : ""}`);
  fl.animate([{ transform: "translate(-50%,-30%) scale(.6)", opacity: 0 }, { transform: "translate(-50%,-80%) scale(1.15)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-170%) scale(1)", opacity: 0 }], { duration: 1000, easing: "ease-out", fill: "forwards" }).finished.then(() => fl.remove());
  const bar = $app.querySelector(".boss .bar i");
  if (bar) bar.style.width = (Math.max(0, S.bossHp - p.dmg) / boss().hp) * 100 + "%";
  await wait(170);
  target.classList.remove("hitflash");
  await wait(600);
}
async function animMiss(p) {
  if (reduceMotion()) { await wait(150); return; }
  const target = $app.querySelector(".boss canvas");
  const pl = $app.querySelector(".player");
  const card = p.slot != null ? $app.querySelector(`.hand .card[data-v="${p.slot}"]`) : null;
  if (!target || !pl) return;
  if (card) card.animate([{ filter: "none", opacity: 1 }, { filter: "grayscale(1) brightness(.6)", opacity: 0, transform: "translateY(20px) rotate(6deg) scale(.9)" }], { duration: 420, fill: "forwards" });
  const a = center(target), b = center(pl);
  const dx = (b.x - a.x) * 0.35, dy = (b.y - a.y) * 0.35;
  await target.animate([
    { transform: "none" },
    { transform: "translate(-8px, 4px) scale(.95)", offset: .25 },
    { transform: `translate(${dx}px, ${dy}px) scale(1.25)`, offset: .55 },
    { transform: "none" }
  ], { duration: 520, easing: "ease-in-out" }).finished.catch(() => {});
  if (p.shield) {
    const fl = spawnIn(pl, "float block", b.x, b.y, "ROLLBACK!");
    fl.animate([{ transform: "translate(-50%,-50%) scale(.5)", opacity: 0 }, { transform: "translate(-50%,-50%) scale(1.1)", opacity: 1, offset: .3 }, { transform: "translate(-50%,-120%)", opacity: 0 }], { duration: 900, fill: "forwards" }).finished.then(() => fl.remove());
    pl.animate([{ boxShadow: "0 0 0 0 var(--shield)" }, { boxShadow: "0 0 0 6px var(--shield)" }, { boxShadow: "0 0 0 0 var(--shield)" }], { duration: 600 });
    await wait(700);
    return;
  }
  const claw = document.createElement("div");
  claw.className = "claw";
  claw.innerHTML = [18, 40, 62].map((t) => `<i style="top:${t}%;transform:rotate(-14deg) scaleX(0)"></i>`).join("");
  pl.appendChild(claw);
  claw.querySelectorAll("i").forEach((line, i) => line.animate([{ transform: "rotate(-14deg) scaleX(0)", opacity: 1 }, { transform: "rotate(-14deg) scaleX(1)", opacity: 1, offset: .5 }, { transform: "rotate(-14deg) scaleX(1)", opacity: 0 }], { duration: 520, delay: i * 70, fill: "forwards" }));
  pl.classList.add("hurtflash");
  $app.animate([{ transform: "none" }, { transform: "translate(-6px, 2px)" }, { transform: "translate(6px, -2px)" }, { transform: "translate(-3px, 1px)" }, { transform: "none" }], { duration: 360 });
  const dano = lvl().dano;
  const leds = [...pl.querySelectorAll(".led.on")].slice(-dano);
  leds.forEach((l) => { l.classList.add("dying"); });
  const fl = spawnIn(pl, "float hurt", b.x, b.y, `−${dano}<small>UPTIME</small>`);
  fl.animate([{ transform: "translate(-50%,-30%) scale(.6)", opacity: 0 }, { transform: "translate(-50%,-70%) scale(1.1)", opacity: 1, offset: .25 }, { transform: "translate(-50%,-150%)", opacity: 0 }], { duration: 950, fill: "forwards" });
  await wait(250);
  pl.classList.remove("hurtflash");
  await wait(700);
  leds.forEach((l) => l.classList.remove("on"));
}

/* ================= sprites ================= */
function drawSprites(root) {
  root.querySelectorAll("canvas[data-boss]").forEach((cv) => {
    const b = NIVEIS[+cv.dataset.boss].boss;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, 12, 12);
    b.px.forEach((row, y) => {
      for (let x = 0; x < 12; x++) {
        const ch = row[x] || ".";
        if (ch === ".") continue;
        ctx.fillStyle = ch === "k" ? "#0b0f15" : (b.cores[ch] || b.cores.a);
        ctx.fillRect(x, y, 1, 1);
      }
    });
  });
}

/* ================= DLC: Ringue da Matemática =================
 * Treino sem relógio contra um boneco de palha (saco de pancadas) com 1000 de vida.
 * Cada acerto é um soco. Golpe nº k da sequência: dano = força^expoente, com
 *   força    = 1 + 0.1·(k − 1)            → o 1º golpe é 1^1.001 = 1
 *   expoente = 1.001 · 1.1^(k − 1)        → a cada acerto seguido soma 1/10 dele mesmo
 * Errar zera a sequência. As perguntas vêm das Listas 1, 2 e 3 de Polinômios, em ordem de dificuldade,
 * e cada uma traz a resolução passo a passo (e, nas de marcar, o motivo de cada alternativa errada).
 */
const MAT_HP = 1000;
const MAT_FORCA_PASSO = 0.1, MAT_EXP_INICIAL = 1.001, MAT_EXP_SOMA = 0.1;
const matForca = (k) => 1 + MAT_FORCA_PASSO * (k - 1);
/* o expoente começa em 1.001 e, a cada acerto seguido, soma 1/10 dele mesmo */
const matExpo = (k) => MAT_EXP_INICIAL * (1 + MAT_EXP_SOMA) ** (k - 1);
const matGolpe = (k) => matForca(k) ** matExpo(k);
