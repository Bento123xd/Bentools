<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barbearia do Kunha</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav"><a href="#topo" class="brand"><img id="logo" alt="Logo"><span id="nome"></span></a>
<button class="burger" aria-label="Menu">☰</button>
<nav><a href="#servicos">Serviços</a><a href="#equipe">Equipe</a><a href="#galeria">Galeria</a><a href="#depoimentos">Depoimentos</a><a href="#contato">Contato</a><a class="btn" id="agendarNav" target="_blank">WhatsApp</a></nav></header>
<section id="topo" class="hero"><div><h1 id="heroNome"></h1><p id="slogan"></p><a class="btn" id="agendarHero" target="_blank">Chamar no WhatsApp</a></div></section>
<section id="servicos"><h2>Serviços</h2><div class="grid" id="listaServicos"></div></section>
<section id="equipe" class="alt"><h2>Nossa Equipe</h2><div class="grid" id="listaEquipe"></div></section>
<section id="galeria"><h2>Galeria</h2><div class="gal" id="listaGaleria"></div></section>
<section id="depoimentos" class="alt"><h2>Depoimentos</h2><div class="grid" id="listaDep"></div></section>
<section id="contato"><h2>Contato</h2><div class="grid"><div class="card"><h3>Horários</h3><ul id="horarios"></ul></div><div class="card"><h3>Endereço</h3><p id="endereco"></p><a class="btn" id="mapa" target="_blank">Ver no mapa</a></div></div></section>
<footer><span id="rodape"></span> · <a id="insta" target="_blank">Instagram</a></footer>
<a class="wpp" id="wpp" target="_blank" aria-label="WhatsApp">WhatsApp</a>
<script src="config.js"></script><script src="script.js"></script>
</body></html>
